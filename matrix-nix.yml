  # Haskell
  - { tool: ormolu,     attr: "nixpkgs#ormolu", version: "0.8.0.2" }
  - { tool: hlint,      attr: "nixpkgs#hlint", version: "3.10" }
  - { tool: haskell-language-server, attr: "nixpkgs#haskell-language-server", version: "2.13.0.0" }

  # Clojure
  - { tool: clj-kondo,  attr: "nixpkgs#clj-kondo", version: "2026.08.04" }
  # nix appends the release timestamp: 2026.10.15-11.42.38. The probe printed a
  # fixed-width column and cut it, and check-versions.py caught the difference
  # before a 169-job build ran.
  - { tool: clojure-lsp, attr: "nixpkgs#clojure-lsp", version: "2026.10.15-11.42.38" }

  # Elixir / Erlang. credo is not in nixpkgs (probe answered MISSING), so the
  # formatter/linter story for Elixir is erlfmt + the compiler's own warnings.
  - { tool: elixir-ls,  attr: "nixpkgs#elixir-ls", version: "0.31.1" }
  - { tool: erlfmt,     attr: "nixpkgs#erlfmt", version: "1.8.0" }

  # Crystal
  - { tool: crystalline, attr: "nixpkgs#crystalline", version: "0.20.0" }
  - { tool: ameba,      attr: "nixpkgs#ameba", version: "1.7.0" }

  # Nim
  - { tool: nimlangserver, attr: "nixpkgs#nimlangserver", version: "1.14.0" }
  - { tool: nimlsp,     attr: "nixpkgs#nimlsp", version: "0.4.7" }

  # Zig
  - { tool: zls,        attr: "nixpkgs#zls", version: "0.17.0" }

  # OCaml
  - { tool: ocamlformat, attr: "nixpkgs#ocamlformat", version: "0.29.0" }

  # Dart - the SDK ships dart format/analyze, but Flutter is a separate thing and
  # people building Flutter need it.
  - { tool: flutter,    attr: "nixpkgs#flutter", version: "3.47.4" }

  # .NET - `dotnet format` is built in since SDK 6, so only the LSPs are added.
  - { tool: csharp-ls,  attr: "nixpkgs#csharp-ls", version: "0.28.0" }
  - { tool: omnisharp,  attr: "nixpkgs#omnisharp-roslyn", version: "1.39.14" }

  # data
  - { tool: jqp,        attr: "nixpkgs#jqp", version: "0.8.0" }
  - { tool: dasel,      attr: "nixpkgs#dasel", version: "3.11.2" }
  - { tool: miller,     attr: "nixpkgs#miller", version: "6.22.0" }

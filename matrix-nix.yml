# easysetup manifest — nix-built toolchains.
#
# One entry is one nixpkgs attribute. Nothing else is declared, because nothing
# else is needed:
#
#   * the dependency closure is nix's job, not a hand-maintained apt_deps list;
#   * the build is `nix build`, which DOWNLOADS a prebuilt closure from
#     cache.nixos.org rather than compiling (measured: clang 44 paths / 462 MB,
#     swift 90 paths / 1470 MB, zero local builds);
#   * the artifact is portable - unpacking it into an empty chroot runs the tool
#     with no nix present (verified).
#
# Fields
# ------
#   tool     the name users type: `install.sh node`
#   version  recorded for humans and for the tag; the authoritative value is
#            whatever `nix eval <attr>.version` returns, and CI corrects this
#   attr     the nixpkgs attribute to build, e.g. nixpkgs#swift
#   bins     subdirectories of the store path that hold executables (default: bin)
#
# The old fields are gone on purpose: apt_deps, requires, artifact, sha256 and
# the per-tool build script were all consequences of repacking upstream
# binaries. `sha256` still exists per release, but CI computes it from the
# tarball it produced, it is not written here by hand.
setups:
  # ---- languages -----------------------------------------------------------
  - tool: node
    attr: nixpkgs#nodejs
    version: "24.21.0"
  - tool: python
    attr: nixpkgs#python3
    version: "3.14.8"

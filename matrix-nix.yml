# easysetup manifest — one entry per nixpkgs attribute we publish.
#
# One entry per tool: the newest version nixpkgs exposes. Older ones are not
# published, because nothing pinned them on purpose and each one costs a tarball
# to build, download and store.
#
# The `attr` still names a specific version (`nodejs_26`, `clang_21`,
# `llvmPackages_23.clang`) rather than the floating alias, so a rebuild of the
# same flake.lock produces the same tarball even after nixpkgs moves the alias.
#
# Fields
#   tool     the name users type: `install.sh node`
#   version  informational; the authority is `nix eval .#<name>.version`, and
#            build-nixpkg.sh derives both the directory and the asset name from
#            what nix reports, so a stale value here cannot mislabel a release
#   attr     the nixpkgs attribute
#
# Setups with no nixpkgs attribute at all - swift's wasm/static-linux/android
# SDKs, rust's cross std, jenkins-plugin-cli - are not listed. They were
# buildable by hand because we assembled upstream tarballs; a pure nix pipeline
# cannot conjure an attribute that does not exist.
setups:
  # The shared base every other setup subtracts. It is not a toolchain - it is
  # the store paths most setups need (glibc and its companions), published once so
  # they are not duplicated into 50 tarballs. tools/compute-deps.py decides which
  # paths those are; build-nixpkg.sh packages exactly that list for this entry.
  #
  # An entry is needed here only so install.sh has something to fetch by name.
  - { tool: base,      attr: "nixpkgs#glibc", version: "2.44" }
  # One version per tool: the newest nixpkgs exposes. Older ones are
  # deliberately not published - keeping every version meant 63
  # tarballs where 40 do, and nothing pinned an old one on purpose.
  - { tool: bazel,     attr: "nixpkgs#bazel", version: "7.6.0" }
  - { tool: buf,       attr: "nixpkgs#buf", version: "1.73.0" }
  - { tool: cabal,     attr: "nixpkgs#cabal-install", version: "3.16.1.0" }
  - { tool: clang,     attr: "nixpkgs#llvmPackages_23.clang", version: "23.1.3" }
  - { tool: cmake,     attr: "nixpkgs#cmake", version: "4.4.4" }
  - { tool: conan,     attr: "nixpkgs#conan", version: "2.32.0" }
  # conda is NOT here, and the reason is concrete rather than a preference:
  # nixpkgs' `conda` builds a bubblewrap FHS sandbox whose only executable is
  # `conda-shell`, and that sandbox cannot even start inside an Actions container
  # (bwrap needs user namespaces, which CI does not grant). Verified by running
  # it: the command hangs with no output.
  #
  # micromamba is the maintained single-binary implementation with the same CLI
  # (`micromamba create -n x python=3.12`), and pixi is the newer project-based
  # tool. Both were run through a real install before being listed here.
  - { tool: micromamba, attr: "nixpkgs#micromamba", version: "2.9.0" }
  - { tool: pixi,      attr: "nixpkgs#pixi", version: "0.82.0" }
  - { tool: crystal,   attr: "nixpkgs#crystal", version: "1.21.1" }
  - { tool: dart,      attr: "nixpkgs#dart", version: "3.13.0" }
  - { tool: deno,      attr: "nixpkgs#deno", version: "2.9.7" }
  - { tool: dotnet,    attr: "nixpkgs#dotnetCorePackages.sdk_10_0", version: "10.0.401" }
  - { tool: elixir,    attr: "nixpkgs#elixir", version: "1.18.5" }
  - { tool: erlang,    attr: "nixpkgs#erlang", version: "28.5.0.8" }
  - { tool: ghc,       attr: "nixpkgs#ghc", version: "9.10.3" }
  - { tool: git-lfs,   attr: "nixpkgs#git-lfs", version: "3.8.0" }
  - { tool: go,        attr: "nixpkgs#go", version: "1.26.9" }
  - { tool: gradle,    attr: "nixpkgs#gradle_9", version: "9.8.0" }
  - { tool: helm,      attr: "nixpkgs#kubernetes-helm", version: "4.3.1" }
  - { tool: java,      attr: "nixpkgs#jdk25", version: "25.0.4.1+1" }
  - { tool: jq,        attr: "nixpkgs#jq", version: "1.8.2" }
  - { tool: julia,     attr: "nixpkgs#julia", version: "1.13.2" }
  - { tool: lua,       attr: "nixpkgs#lua5_5", version: "5.5.1" }
  - { tool: luarocks,  attr: "nixpkgs#luarocks", version: "3.13.0-1" }
  - { tool: maven,     attr: "nixpkgs#maven", version: "3.9.16" }
  - { tool: nim,       attr: "nixpkgs#nim", version: "2.2.12" }
  - { tool: ninja,     attr: "nixpkgs#ninja", version: "1.13.2" }
  - { tool: nix,       attr: "nixpkgs#nix", version: "2.34.9" }
  - { tool: node,      attr: "nixpkgs#nodejs_26", version: "26.12.0" }
  - { tool: opam,      attr: "nixpkgs#opam", version: "2.6.1" }
  - { tool: perl,      attr: "nixpkgs#perl", version: "5.42.3" }
  # ---- python's package set ------------------------------------------------
  # Separate setups because each is a separate program with its own closure.
  # compute-deps.py derives that pip's closure contains python314's, so pip's
  # tarball carries only the 2 paths python does not already provide.
  - { tool: pip,        attr: "nixpkgs#python314Packages.pip", version: "26.1.2" }
  - { tool: virtualenv, attr: "nixpkgs#python314Packages.virtualenv", version: "21.6.1" }
  - { tool: black,      attr: "nixpkgs#python314Packages.black", version: "26.5.1" }
  - { tool: ruff,       attr: "nixpkgs#python314Packages.ruff", version: "0.17.1" }
  - { tool: mypy,       attr: "nixpkgs#python314Packages.mypy", version: "2.1.0" }
  - { tool: pytest,     attr: "nixpkgs#python314Packages.pytest", version: "9.1.1" }

  # ---- php's package set --------------------------------------------------
  - { tool: composer,   attr: "nixpkgs#php85Packages.composer", version: "2.10.3" }
  - { tool: php-cs-fixer, attr: "nixpkgs#php85Packages.php-cs-fixer", version: "3.95.1" }
  - { tool: psalm,      attr: "nixpkgs#php85Packages.psalm", version: "6.18.0" }
  - { tool: phpmd,      attr: "nixpkgs#php85Packages.phpmd", version: "2.15.0" }
  - { tool: phing,      attr: "nixpkgs#php85Packages.phing", version: "3.1.2" }
  - { tool: box,        attr: "nixpkgs#php85Packages.box", version: "4.6.6" }

  # ---- CI tooling ---------------------------------------------------------
  # jenkins ships jenkins-cli, which talks to a remote Jenkins; the war is part
  # of the same output, hence the size.
  - { tool: jenkins,    attr: "nixpkgs#jenkins", version: "2.580.1" }
  - { tool: kubectl,    attr: "nixpkgs#kubectl", version: "1.37.1" }
  # opentofu, not terraform. terraform has been BUSL-licensed since 1.6, and
  # Hydra does not build unfree packages, so its narinfo is a 404 and every build
  # would compile it from source. opentofu is the MPL-licensed fork, is cached,
  # and is a drop-in replacement for `terraform` in the ways that matter here.
  # Its CLI is `tofu`; a `terraform` symlink is not provided by nixpkgs.
  - { tool: opentofu,   attr: "nixpkgs#opentofu", version: "1.13.1" }
  - { tool: shellcheck, attr: "nixpkgs#shellcheck", version: "0.11.0" }
  - { tool: ripgrep,    attr: "nixpkgs#ripgrep", version: "15.2.0" }
  - { tool: fd,         attr: "nixpkgs#fd", version: "10.5.0" }

  # ---- batch 1: the JS/TS and linting tools a modern CI reaches for ---------
  # Every one of these was probed before being added: attribute exists, the
  # output is in cache.nixos.org (a 404 means compiling from source on every
  # build), and the build produces an executable.
  - { tool: pnpm,       attr: "nixpkgs#pnpm", version: "12.9.0" }
  - { tool: yarn,       attr: "nixpkgs#yarn", version: "1.22.22" }
  - { tool: bun,        attr: "nixpkgs#bun", version: "1.4.2" }
  - { tool: typescript, attr: "nixpkgs#typescript", version: "7.0.2" }
  - { tool: esbuild,    attr: "nixpkgs#esbuild", version: "0.27.2" }
  - { tool: biome,      attr: "nixpkgs#biome", version: "2.5.15" }
  - { tool: prettier,   attr: "nixpkgs#prettier", version: "3.9.10" }
  - { tool: eslint,     attr: "nixpkgs#eslint", version: "10.12.0" }
  - { tool: hadolint,   attr: "nixpkgs#hadolint", version: "2.14.0" }
  - { tool: golangci-lint, attr: "nixpkgs#golangci-lint", version: "2.15.0" }
  - { tool: trivy,      attr: "nixpkgs#trivy", version: "0.76.0" }
  - { tool: gitleaks,   attr: "nixpkgs#gitleaks", version: "8.30.1" }

  # ---- batch 2: the C/C++ toolchain beyond clang/cmake/ninja ---------------
  # gcc sits beside clang rather than replacing it: projects differ in which one
  # they build with, and both are cached, so carrying both costs no download for
  # anyone who asks for only one.
  - { tool: gcc,        attr: "nixpkgs#gcc", version: "16.2.0" }
  - { tool: llvm,       attr: "nixpkgs#llvm", version: "21.1.8" }
  - { tool: lldb,       attr: "nixpkgs#lldb", version: "21.1.8" }
  - { tool: gdb,        attr: "nixpkgs#gdb", version: "17.2" }
  - { tool: valgrind,   attr: "nixpkgs#valgrind", version: "3.27.1" }
  - { tool: ccache,     attr: "nixpkgs#ccache", version: "4.14.1" }
  - { tool: meson,      attr: "nixpkgs#meson", version: "1.12.1" }
  - { tool: mold,       attr: "nixpkgs#mold", version: "3.0.0" }
  - { tool: autoconf,   attr: "nixpkgs#autoconf", version: "2.73" }
  - { tool: automake,   attr: "nixpkgs#automake", version: "1.18.1" }
  - { tool: libtool,    attr: "nixpkgs#libtool", version: "2.6.2" }
  - { tool: pkg-config, attr: "nixpkgs#pkg-config", version: "0.29.2" }

  # ---- batch 3: neighbouring ecosystems ------------------------------------
  - { tool: kotlin,     attr: "nixpkgs#kotlin", version: "2.4.20" }
  - { tool: scala,      attr: "nixpkgs#scala", version: "3.9.0" }
  - { tool: clojure,    attr: "nixpkgs#clojure", version: "1.12.6.16" }
  - { tool: podman,     attr: "nixpkgs#podman", version: "5.8.9" }
  - { tool: skopeo,     attr: "nixpkgs#skopeo", version: "1.24.1" }
  - { tool: kustomize,  attr: "nixpkgs#kustomize", version: "5.8.2" }
  - { tool: kind,       attr: "nixpkgs#kind", version: "0.33.0" }
  - { tool: awscli2,    attr: "nixpkgs#awscli2", version: "2.36.31" }
  - { tool: uv,         attr: "nixpkgs#uv", version: "0.13.1" }
  - { tool: php,       attr: "nixpkgs#php85", version: "8.5.11" }
  - { tool: protobuf,  attr: "nixpkgs#protobuf", version: "36.2" }
  - { tool: python,    attr: "nixpkgs#python314", version: "3.14.8" }
  - { tool: r,         attr: "nixpkgs#R", version: "4.6.1" }
  - { tool: ruby,      attr: "nixpkgs#ruby_4_0", version: "4.0.7" }
  - { tool: rust,      attr: "nixpkgs#rustc", version: "1.99.0" }
  # cargo is a SEPARATE setup because nixpkgs#rustc does not contain it: the
  # rustc output has rustc/rustdoc/rust-gdb/rust-lldb and nothing else, so
  # `cargo build` failed for anyone who installed `rust`. compute-deps.py derives
  # the overlap, so `install.sh cargo` pulls rustc first and the tarball carries
  # only the difference.
  - { tool: cargo,     attr: "nixpkgs#cargo", version: "1.99.0" }
  - { tool: sbt,       attr: "nixpkgs#sbt", version: "2.0.10" }
  - { tool: swift,     attr: "nixpkgs#swift", version: "6.3.3" }
  - { tool: yq,        attr: "nixpkgs#yq-go", version: "4.54.1" }
  - { tool: zig,       attr: "nixpkgs#zig", version: "0.17.0" }

  # ---- compilers and build tools ------------------------------------------
  # clang versions are spread over two naming schemes. `clang_NN` stops at 21;
  # 22 and 23 only exist as `llvmPackages_NN.clang`. Both are the WRAPPED
  # compiler - the variant that also supplies the bintools, so `clang` can find
  # its own assembler and linker. `clang-unwrapped` is the raw compiler and is
  # deliberately not shipped: installing it alone gives a compiler that cannot
  # link.
  - { tool: clang,   attr: "nixpkgs#clang_18",                 version: "18.1.8" }
  - { tool: clang,   attr: "nixpkgs#clang_19",                 version: "19.1.7" }
  - { tool: clang,   attr: "nixpkgs#clang_20",                 version: "20.1.8" }
  - { tool: clang,   attr: "nixpkgs#clang_21",                 version: "21.1.8" }
  - { tool: clang,   attr: "nixpkgs#llvmPackages_22.clang",    version: "22.1.8" }
  - { tool: clang,   attr: "nixpkgs#llvmPackages_23.clang",    version: "23.1.3" }

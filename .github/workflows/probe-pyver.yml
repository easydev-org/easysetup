name: probe-pyver

# Is it the PIN that is wrong, or the PYTHON VERSION we picked?
#
# Facts so far:
#   * our flake.lock revision IS nixos-unstable's channel revision (same string),
#     so "pin an older unstable" is not available - we are already on it
#   * under that pin, python3.15-pip is 404 on cache.nixos.org
#   * under nixos-25.11, python3.13-pip is 200
#
# Two explanations remain, and they need different fixes:
#   A. Hydra does not build python315Packages at all -> move our python setups to
#      the interpreter Hydra does build (3.13), and keep the same pin
#   B. python315 is simply too new for this revision -> pin older nixpkgs
#
# This asks the cache, at OUR pin, for pip under each interpreter nixpkgs
# exposes. Whatever answers 200 is what we should depend on.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: pip's cache status per interpreter, at our own pin
        run: |
          set -uo pipefail
          echo "pin: $(python3 -c "import json;print(json.load(open('flake.lock'))['nodes']['nixpkgs']['locked']['rev'])")"
          echo
          printf '%-14s %-44s %s\n' INTERP OUTPATH CACHE
          for v in 311 312 313 314 315; do
            p=$(nix eval --raw "nixpkgs#python${v}Packages.pip.outPath" 2>/dev/null) || p=""
            if [ -z "$p" ]; then
              printf '%-14s %-44s %s\n' "python$v" "<unresolved>" "-"
              continue
            fi
            h=$(basename "$p" | cut -d- -f1)
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://cache.nixos.org/$h.narinfo")
            printf '%-14s %-44s %s\n' "python$v" "$(basename "$p")" "$code"
          done

      # python314 gets its own step because it is the version the user asked
      # about, and a single line buried in the table above is easy to miss.
      - name: python314 specifically
        run: |
          set -uo pipefail
          for a in python314 python314Packages.pip python314Packages.virtualenv \
                   python314Packages.black python314Packages.ruff \
                   python314Packages.mypy python314Packages.pytest; do
            p=$(nix eval --raw "nixpkgs#$a.outPath" 2>/dev/null) || p=""
            if [ -z "$p" ]; then
              printf '  %-34s %s\n' "$a" "<unresolved>"
              continue
            fi
            h=$(basename "$p" | cut -d- -f1)
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://cache.nixos.org/$h.narinfo")
            printf '  %-34s %-42s %s\n' "$a" "$(basename "$p")" "$code"
          done

      - name: and the interpreters themselves?
        run: |
          set -uo pipefail
          printf '%-12s %-40s %s\n' INTERP OUTPATH CACHE
          for v in 311 312 313 314 315; do
            p=$(nix eval --raw "nixpkgs#python$v.outPath" 2>/dev/null) || p=""
            [ -n "$p" ] || { printf '%-12s %-40s %s\n' "python$v" "<unresolved>" "-"; continue; }
            h=$(basename "$p" | cut -d- -f1)
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://cache.nixos.org/$h.narinfo")
            printf '%-12s %-40s %s\n' "python$v" "$(basename "$p")" "$code"
          done

      - name: what versions would we get at old unstable revisions?
        run: |
          set -uo pipefail
          # If no interpreter at our pin is cached, pinning older is the only
          # option. Sample a few revisions back and report python's version there.
          for days in 3 7 14; do
            rev=$(curl -sS --max-time 40 "https://api.github.com/repos/NixOS/nixpkgs/commits?sha=nixos-unstable&per_page=1&until=$(date -u -d "-${days} days" +%Y-%m-%dT%H:%M:%SZ)" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0]['sha'] if d else '')" 2>/dev/null) || rev=""
            echo "== ${days}d ago: ${rev:0:12}"
            [ -n "$rev" ] || continue
            v=$(nix eval --raw --impure --expr \
              "(builtins.getFlake \"github:NixOS/nixpkgs/$rev\").legacyPackages.x86_64-linux.python3.version" 2>/dev/null) || v="?"
            echo "   python3 = $v"
          done

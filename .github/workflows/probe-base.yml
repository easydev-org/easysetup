name: probe-base

# Can easysetup be used on a distroless-style image?

# Two separate questions, and the second is the hard one:
#
#   1. can bash, busybox, curl, wget, coreutils and friends be published as
#      setups? (attribute exists, cached, produces a binary)
#
#   2. can they be INSTALLED there? install.sh itself needs curl, zstd and
#      python3 - a distroless image has none of them, and a shell it may not
#      have either. So adding the packages is necessary but not sufficient.
#
# This measures (1) and reports how small the bootstrap needs to be for (2).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: the basic tools
        run: |
          set -uo pipefail
          set +e
          printf '%-26s %-16s %-6s %-5s %s\n' ATTR VERSION CACHE BINS FIRST-BINS
          probe() {
            local attr="$1" n v outs chosen h code nb names
            n=$(nix eval --raw "nixpkgs#$attr.name" 2>/dev/null) || n=""
            [ -n "$n" ] || { printf '%-26s %-16s %-6s %-5s %s\n' "$attr" "-" "-" "-" "MISSING"; return; }
            v=$(nix eval --raw "nixpkgs#$attr.version" 2>/dev/null) || v="?"
            outs=$(nix build --no-link --print-out-paths "nixpkgs#$attr" 2>/dev/null) || outs=""
            [ -n "$outs" ] || { printf '%-26s %-16s %-6s %-5s %s\n' "$attr" "$v" "?" "-" "BUILD FAILED"; return; }
            chosen=""; nb=0; names=""
            for p in $outs; do
              if [ -d "$p/bin" ] || [ -d "$p/sbin" ]; then chosen="$p"; break; fi
            done
            [ -n "$chosen" ] || chosen=$(printf '%s\n' "$outs" | head -1)
            for sub in bin sbin; do
              [ -d "$chosen/$sub" ] && nb=$((nb + $(ls "$chosen/$sub" 2>/dev/null | wc -l)))
            done
            names=$(ls "$chosen/bin" 2>/dev/null | head -4 | tr '\n' ' ')
            [ "$nb" -gt 0 ] || names="(no bin/)"
            h=$(basename "$chosen" | cut -d- -f1)
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://cache.nixos.org/$h.narinfo")
            printf '%-26s %-16s %-6s %-5s %s\n' "$attr" "${v:0:15}" "$code" "$nb" "$names"
          }

          echo "===== shell ====="
          probe bash
          probe bashInteractive
          probe dash
          probe zsh
          probe busybox
          probe toybox
          echo
          echo "===== core userland ====="
          probe coreutils
          probe findutils
          probe gnugrep
          probe gnused
          probe gawk
          probe gnutar
          probe gzip
          probe bzip2
          probe xz
          probe zstd
          probe diffutils
          probe patch
          probe which
          probe procps
          probe util-linux
          echo
          echo "===== network ====="
          probe curl
          probe wget
          probe cacert
          probe openssl
          probe inetutils
          probe iproute2
          probe iputils
          probe dnspython 2>/dev/null
          echo
          echo "===== the installer's own needs ====="
          probe python3
          probe zstd
          probe curl

      - name: how small can a bootstrap get?
        run: |
          set -uo pipefail
          set +e
          echo "== static busybox: one binary, and it unpacks tarballs =="
          o=$(nix build --no-link --print-out-paths 'nixpkgs#pkgsStatic.busybox' 2>/dev/null | head -1) || o=""
          if [ -n "$o" ]; then
            echo "  output: $(basename "$o")"
            ls -la "$o/bin/busybox" 2>/dev/null | awk '{print "  size:", $5}'
            echo "  applets needed by install.sh:"
            for a in sh tar gzip xz cat head cut ls mkdir chmod ln cp rm; do
              "$o/bin/busybox" --list 2>/dev/null | grep -qx "$a" \
                && echo "    $a yes" || echo "    $a NO"
            done
          else
            echo "  pkgsStatic.busybox not available"
          fi
          echo
          echo "== static curl =="
          c=$(nix build --no-link --print-out-paths 'nixpkgs#pkgsStatic.curl' 2>/dev/null | head -1) || c=""
          echo "  ${c:-<not available>}"
          [ -n "$c" ] && ldd "$c/bin/curl" 2>&1 | head -3

      - name: does install.sh actually need python3?
        run: |
          set -uo pipefail
          set +e
          # install.sh calls `python3 matrixlib2.py` to resolve names and read
          # closures.json. If that is the only python use, a distroless bootstrap
          # could ship a tiny python - or avoid it entirely. This lists every
          # python3 invocation so the size of that dependency is visible.
          echo "== python3 uses in install.sh =="
          grep -n 'python3\|mlib ' install.sh | head -20
          echo
          echo "== and in the tools it calls =="
          grep -c 'python3' tools/gen-env.sh

name: probe-conda2

# Is `conda-shell` the conda CLI, or a sandbox that happens to be named that?
#
# The first probe read the wrapper script (it sets up a bwrap FHS root) but never
# actually RAN it, because an earlier step in that job died on `pipefail`. Reading
# a script and inferring its purpose is exactly the kind of guess that has been
# wrong before in this repo, so this runs it.
#
# What would settle it:
#   * `conda-shell conda --version`     - does the sandbox expose the real CLI?
#   * `conda-shell --version`           - or is it the CLI itself?
#   * what is on PATH inside the sandbox?
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: build conda and look at the sandbox contents
        run: |
          set -uo pipefail
          out=$(nix build --no-link --print-out-paths 'nixpkgs#conda' | tail -1)
          echo "output: $out"
          echo
          echo "== bin/ =="
          ls -l "$out/bin"
          echo
          # The wrapper points at an fhsenv-rootfs store path; that rootfs is what
          # the sandbox presents as /. Its bin/ is where conda would live.
          target=$(readlink -f "$out/bin/conda-shell")
          echo "wrapper: $target"
          echo
          echo "== the fhs rootfs it builds, and what is in ITS bin/ =="
          for d in /nix/store/*-conda-shell-*-fhsenv-rootfs; do
            echo "rootfs: $d"
            ls "$d/bin" 2>/dev/null | head -20
            echo "  ... total: $(ls "$d/bin" 2>/dev/null | wc -l) entries"
          done

      - name: run conda-shell and see what it does
        run: |
          set -uo pipefail
          out=$(nix build --no-link --print-out-paths 'nixpkgs#conda' | tail -1)
          sh="$out/bin/conda-shell"

          echo "== conda-shell --version =="
          timeout 90 "$sh" --version 2>&1 | head -5 || echo "(exit $?)"

          echo
          echo "== conda-shell conda --version  (pass-through?) =="
          timeout 90 "$sh" conda --version 2>&1 | head -5 || echo "(exit $?)"

          echo
          echo "== conda-shell -- conda info  =="
          timeout 90 "$sh" -c 'command -v conda || echo "no conda on PATH"' 2>&1 | head -5 || echo "(exit $?)"

          echo
          echo "== what is on PATH inside? =="
          timeout 90 "$sh" -c 'echo $PATH' 2>&1 | head -3 || echo "(exit $?)"

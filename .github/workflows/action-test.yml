name: action-test

# Dogfooding: use the action exactly as a consumer would, and assert the things
# that have broken before.
#
# Every check here corresponds to a real failure:
#   basic       - tools must work in a FOLLOWING step, not just during install
#   accumulate  - two separate `uses:` steps must not erase each other
#   wrong-os    - ubuntu 24.04 has glibc 2.39; the artifacts need 2.41
#   coexist     - two versions of one tool must both stay usable
on:
  workflow_dispatch:
    inputs:
      tools:
        description: 'override the tool list for the basic job'
        required: false
        default: 'node python'

permissions:
  contents: read

jobs:
  basic:
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    steps:
      - uses: actions/checkout@v4
      # The action lives in this repository, so reference it by path. A consumer
      # would write `uses: easydev-org/easysetup@main` instead.
      - uses: ./
        with:
          tools: ${{ inputs.tools }}

      - name: the tools run in a FOLLOWING step
        run: |
          set -eux
          # Assert on what was requested rather than a hard-coded name: the tool
          # list is an input, and asking for node while being told to install
          # swift is the test's mistake, not the action's.
          ls -d /nix/setup-root-* >/dev/null
          command -v node || command -v python3 || command -v swift
          echo "toolchain reachable from a later step"

      - name: the registry records where each tool lives
        run: |
          set -eux
          for f in /nix/setup-root-*; do
            echo "$f: $(cat "$f")"
            store=$(cut -d'|' -f1 "$f")
            test -d "$store" || { echo "::error::$store missing"; exit 1; }
          done

  accumulate:
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with: { tools: node }
      # The regression this guards: env.sh used to be generated from "what this
      # invocation installed", so the second use erased the first.
      - uses: ./
        with: { tools: python }
      - name: both are still installed
        run: |
          set -eux
          ls /nix/setup-root-* | wc -l
          test -f "/nix/setup-root-node-$(ls /nix/setup-root-node-* | head -1 | sed 's|.*setup-root-node-||')"
          command -v node
          command -v python3

  wrong-os:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the action refuses to install on a glibc it cannot satisfy
        id: try
        continue-on-error: true
        uses: ./
        with: { tools: node }
      - name: it must have failed
        run: |
          set -euo pipefail
          if [ "${{ steps.try.outcome }}" != "failure" ]; then
            echo "::error::the action installed onto ubuntu 24.04, whose glibc is too old"
            exit 1
          fi
          echo "correctly refused on the wrong platform"

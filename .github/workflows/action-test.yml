name: action-test

# Dogfood the action exactly as a consumer would, against the artifacts that are
# actually published. Each job corresponds to a failure that has already
# happened once, so a regression shows up here rather than in a consumer's build.
on:
  workflow_dispatch:
    inputs:
      tools:
        description: 'tool list for the basic job'
        required: false
        default: 'node python'
  push:
    branches: [main]
    # The checksum parsing lives in action.yml and reads a file the CLI repo
    # publishes; those two files are the whole surface of the bug this guards.
    paths:
      - action.yml
      - tools/test-checksum-parse.sh
      - .github/workflows/action-test.yml

permissions:
  contents: read

jobs:
  # Runs first and in seconds: it needs no nix, no network and no container, so a
  # broken checksum parser is reported before the slow jobs even start.
  checksum-parsing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: the .sha256 parser accepts every published shape
        run: tools/test-checksum-parse.sh

  # Install as a normal user and run the tools, because that is the only way two
  # bugs were reachable - and both looked fixed when exercised as root:
  #
  #   * the extractor created 0555 directories and then filled them
  #   * two setups carry the same store path, so the second found it read-only
  #
  # Root ignores permission bits, so `container:` jobs pass both and a plain runner
  # fails both. This job is the regression test for the runner case.
  nonroot-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch the published binary
        run: |
          set -euo pipefail
          tag=$(curl -fsSI https://github.com/easydev-org/easysetup-cli/releases/latest \
            | awk 'tolower($1)=="location:" {n=split($2,a,"/"); print a[n]; exit}' | tr -d '\r')
          curl -fsSL -o /tmp/easysetup \
            "https://github.com/easydev-org/easysetup-cli/releases/download/$tag/easysetup-linux-amd64"
          chmod 755 /tmp/easysetup
      - name: install as nobody and run the tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BIN: /tmp/easysetup
        run: tools/test-nonroot-install.sh

  basic:
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    steps:
      - uses: actions/checkout@v4
      # Referenced by path because the action lives in this repository; a
      # consumer writes `uses: easydev-org/easysetup@main`.
      - uses: ./
        with:
          # `|| 'node python'` because a push-triggered run has no inputs at all:
          # workflow_dispatch defaults are not applied to it, so inputs.tools is
          # the empty string and the action is asked to install nothing. That made
          # every job fail with "name at least one setup" the moment this workflow
          # gained a push trigger.
          tools: ${{ inputs.tools || 'node python' }}

      # The point of the whole action: the tools must work in a LATER step, not
      # only inside the step that installed them. GITHUB_PATH is what carries
      # that across steps.
      - name: the tools run in a following step
        run: |
          set -eux
          command -v node
          node --version
          command -v python3 || command -v python
          echo "toolchain reachable from a later step"

      - name: the registry records where each tool lives
        run: |
          set -eux
          ls /nix/setup-root-*
          for f in /nix/setup-root-*; do
            echo "$f -> $(cat "$f")"
            store=$(cut -d'|' -f1 "$f")
            # `none` is a setup with no executables - base is a library set. It
            # is installed, it registers nothing on PATH, and there is no store
            # path to check. Anything else must point at a real directory.
            [ "$store" = "none" ] && continue
            test -d "$store" || { echo "::error::$store is missing"; exit 1; }
          done

      - name: env.sh is sourceable under set -u
        run: |
          set -eux
          test -f /opt/setup/env.sh
          ( set -u; . /opt/setup/env.sh )

  # Two separate `uses:` steps must accumulate. This was a real bug: env.sh was
  # generated from "what this invocation installed", so the second call erased
  # the first tool.
  accumulate:
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with: { tools: node }
      - uses: ./
        with: { tools: jq }
      - name: both are still installed
        run: |
          set -eux
          # node, jq, and the shared base they both depend on = 3. The point of
          # the assertion is that the second `uses:` did not erase the first, so
          # count the tools rather than hard-coding a total that shifts whenever
          # the dependency graph changes.
          test -f /nix/setup-root-node-26.12.0
          test -f /nix/setup-root-jq-1.8.2
          command -v node
          command -v jq
          jq --version

  # A cache hit means install.sh never runs, so the second use of the action must
  # still put the tools on PATH. Without the explicit re-append, a cached run
  # would look installed but be unusable.
  cache-roundtrip:
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with: { tools: jq, cache: 'false' }
      - name: store is populated
        run: ls /nix/setup-root-*

  # No container, on purpose.
  #
  # This job used to assert the action REFUSED ubuntu-latest, because the
  # artifacts were said to need trixie's glibc. That was wrong: every binary's
  # PT_INTERP is an absolute /nix/store path inside the closure, and ldd resolves
  # libc from there. The host libc is never consulted.
  #
  # So the assertion is now the opposite - the action must WORK here - and that
  # makes this the most valuable job in the file: it proves a consumer needs no
  # special container at all.
  plain-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with: { tools: jq }
      - name: it ran without a container
        run: |
          set -euo pipefail
          . /opt/setup/env.sh
          jq --version
          echo '{"a":1}' | jq -r .a
          echo "host: $(. /etc/os-release; echo "$PRETTY_NAME")"
          echo "host libc: $(ldd --version | head -1)"
          echo "the artifact's own interpreter:"
          readelf -l "$(command -v jq)" 2>/dev/null | sed -n 's/.*interpreter: \(.*\)\]/  \1/p' \
            || echo "  (readelf unavailable)"

  # /nix/store must survive the whole job, not just the install.
  #
  # The install itself runs as one user; the cache step before it and any later
  # `uses:` run as the same one, but a later step that unpacks more setups needs
  # the directories writable again. `cp -a` preserves the archive's 0555 on store
  # directories, which silently undid the chmod - so this asserts the mode AFTER
  # an install, and that a second install still succeeds.
  nix-stays-writable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with: { tools: jq }
      - name: the directories are writable after the install
        run: |
          set -euo pipefail
          for d in /nix /nix/store; do
            mode=$(stat -c '%a' "$d")
            echo "$d mode=$mode owner=$(stat -c '%U' "$d") user=$(id -un)"
            # Group/other write must be set, because the next steps run as the
            # same unprivileged user that did not create these directories.
            case "$mode" in
              *7*|*[2367]) : ;;
              *) echo "::error::$d is not group/other writable (mode $mode)"; exit 1 ;;
            esac
          done
      - name: a second install still works
        uses: ./
        with: { tools: yq }
      - name: both are present
        run: |
          set -euo pipefail
          . /opt/setup/env.sh
          jq --version
          yq --version
          ls /nix/setup-root-*

  # A job that is not root and has no sudo must fail with a message that explains
  # why, rather than at unpack time with EACCES. Simulated by running the
  # prepare step with sudo hidden and the identity forced.
  no-root-no-sudo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # This used to shell out to the action's prepare step via
      # tools/extract-step.py. That script is gone - prepare moved into the static
      # binary - so the test now exercises the real `easysetup prepare`, which is
      # what the action actually runs.
      - name: the message names the constraint, with neither root nor sudo
        run: |
          set -uo pipefail
          # Fetch a real binary, so the thing under test is the shipped code.
          bin=/tmp/easysetup
          tag=$(curl -fsSI https://github.com/easydev-org/easysetup-cli/releases/latest \
            | awk 'tolower($1)=="location:" {n=split($2,a,"/"); print a[n]; exit}' | tr -d '\r')
          curl -fsSL -o "$bin" \
            "https://github.com/easydev-org/easysetup-cli/releases/download/$tag/easysetup-linux-amd64"
          chmod 755 "$bin"

          sudo rm -rf /nix
          chmod 755 "$bin"

          # Run as `nobody` with a PATH that has no sudo on it. Faking `id` was
          # not enough in an earlier version - sudo was still found and the branch
          # under test never ran. Here sudo is genuinely not on PATH.
          rm -rf /tmp/nosudo && mkdir -p /tmp/nosudo
          for f in sh mkdir chmod cat id; do
            p=$(command -v "$f" 2>/dev/null) || continue
            cp -L "$p" "/tmp/nosudo/$f"
          done
          chmod -R 755 /tmp/nosudo

          out=$(sudo -u nobody env -i PATH=/tmp/nosudo HOME=/tmp \
                  "$bin" prepare 2>&1 || true)
          echo "$out"

          echo "$out" | grep -q 'cannot create /nix/store' \
            && echo "names the constraint" \
            || { echo "::error::the failure does not say what went wrong"; exit 1; }
          echo "$out" | grep -q 'sudo easysetup prepare' \
            && echo "offers the sudo route" \
            || { echo "::error::no actionable fix in the message"; exit 1; }
          echo "$out" | grep -q 'chmod -R 777 /nix' \
            && echo "offers the Dockerfile route" \
            || { echo "::error::no in-image fix in the message"; exit 1; }

      - name: it succeeds when sudo is available
        run: |
          set -euo pipefail
          bin=/tmp/easysetup
          sudo rm -rf /nix
          # The bare runner has passwordless sudo and no /nix; prepare must use it.
          "$bin" prepare
          test -d /nix/store
          stat -c '%a %n' /nix /nix/store
          # Writable by the job user, which is not root.
          touch /nix/store/.writetest
          rm -f /nix/store/.writetest
          echo "prepare created a usable store as a non-root user"

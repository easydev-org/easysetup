name: probe-relocate

# How deeply is /nix/store baked into the artifacts?

# Whether the install root can be an arbitrary path (say ~/.easysetup) depends on
# how many references there are and of which kind, because the fixes differ:
#
#   ELF PT_INTERP   the kernel loads it before the program runs. No environment
#                   variable overrides it. patchelf can rewrite it, or a mount
#                   can satisfy it.
#   ELF DT_RPATH    where the loader finds libraries. patchelf rewrites it.
#   #! shebang      patchelf does nothing; the file has to be rewritten.
#   plain strings   .pc/.la/.cmake/config contents. Only rewriting helps, and a
#                   missed one fails later in a way that does not name the cause.
#
# Counting is done in Python: the shell version kept dying on `file`/`readelf`
# exit codes partway through 1000+ files, so it never printed its own numbers.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: install a small setup
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            curl zstd python3 ca-certificates file binutils patchelf
          bash install.sh jq

      - name: count the four kinds of reference
        run: |
          set -uo pipefail
          set +e
          python3 - <<'PY'
          import os, subprocess, sys

          STORE = "/nix/store"
          MARK = "/nix/store"

          files = []
          for dp, _dn, fn in os.walk(STORE):
              for f in fn:
                  p = os.path.join(dp, f)
                  if not os.path.islink(p):
                      files.append(p)
          print("total files in %s: %d" % (STORE, len(files)))

          elf = interp = rpath = shebang = mention = 0
          elf_nostore = []
          interp_samples = []
          for p in files:
              # content scan, cheap first
              try:
                  with open(p, "rb") as fh:
                      head = fh.read(2)
              except OSError:
                  continue
              if head == b"#!":
                  try:
                      first = open(p, "rb").readline(200)
                  except OSError:
                      first = b""
                  if MARK.encode() in first:
                      shebang += 1
              # ELF magic
              if head == b"\x7fE":
                  elf += 1
                  r = subprocess.run(["readelf", "-l", p],
                                     capture_output=True, text=True)
                  out = r.stdout
                  if "Requesting program interpreter" in out:
                      line = [l for l in out.splitlines()
                              if "Requesting program interpreter" in l]
                      if line and MARK in line[0]:
                          interp += 1
                          if len(interp_samples) < 3:
                              interp_samples.append(line[0].strip()[:110])
                      else:
                          elf_nostore.append(p)
                  if "RPATH" in out or "RUNPATH" in out:
                      if MARK in out:
                          rpath += 1

          # cheap: files whose bytes mention the marker at all
          r = subprocess.run(["grep", "-rl", MARK, STORE],
                             capture_output=True, text=True)
          mention = len([x for x in r.stdout.splitlines() if x.strip()])

          print()
          print("ELF files:                  %5d" % elf)
          print("  with PT_INTERP in store:  %5d" % interp)
          print("  with RPATH/RUNPATH in store: %3d" % rpath)
          print("  ELF with NO store interpreter: %d" % len(elf_nostore))
          for p in elf_nostore[:5]:
              print("      ", p)
          print("shebang scripts -> store:   %5d" % shebang)
          print("files mentioning store:     %5d" % mention)
          print()
          print("sample interpreters:")
          for s in interp_samples:
              print("   ", s)
          PY

      - name: can patchelf rewrite one, and is a mount available without root?
        run: |
          set -uo pipefail
          set +e
          reg=/nix/setup-root-jq-1.8.2
          store=$(cut -d'|' -f1 "$reg")
          rm -rf /tmp/jqtree
          cp -a "$store" /tmp/jqtree && chmod -R u+w /tmp/jqtree
          echo "== before =="
          readelf -l /tmp/jqtree/bin/jq 2>/dev/null | sed -n 's/.*interpreter: \(.*\)\]/\1/p'
          echo "rpath: $(patchelf --print-rpath /tmp/jqtree/bin/jq 2>/dev/null)"
          echo
          echo "== patchelf to /opt/easysetup/store/glibc =="
          patchelf --set-interpreter /opt/easysetup/store/glibc/lib/ld-linux-x86-64.so.2 \
                   --set-rpath /opt/easysetup/store/glibc/lib \
                   /tmp/jqtree/bin/jq 2>&1 | head -3
          echo "patchelf exit=$?"
          echo "after:"
          readelf -l /tmp/jqtree/bin/jq 2>/dev/null | sed -n 's/.*interpreter: \(.*\)\]/\1/p'
          echo
          echo "== unprivileged user namespaces =="
          cat /proc/sys/user/max_user_namespaces 2>/dev/null
          echo
          echo "== symlink-only approach: does a relative symlink work for the interpreter? =="
          echo "(the kernel resolves PT_INTERP as an absolute path, so no)"

name: release

# Cut one GitHub Release per setup in matrix.yml, each carrying a single prebuilt
# tarball of a complete /opt/setup/<tool> tree.
#
# Three stages, and the split matters:
#
#   setup   read matrix.yml and fan out one job per setup
#   build   runs INSIDE debian:trixie - the distro the artefacts target - packs
#           the tarball and verifies it, then hands the file to the runner
#   publish runs on the HOST runner, where `gh` and the token exist, creates the
#           release, uploads the asset and writes its sha256 back into matrix.yml
#
# Building on ubuntu-latest instead would produce binaries linked against a
# different glibc than the consumer's trixie, so the distro is not negotiable.

on:
  # MANUAL ONLY. Deliberately no `push:` trigger.
  #
  # A push trigger fires once per COMMIT, and this repository is edited through
  # the GitHub contents API, which creates one commit PER FILE. A 25-file change
  # therefore produced 25 runs, each fanning out to 28 build jobs - hundreds of
  # jobs queueing behind the account's concurrency limit, and none of them ever
  # finishing. Publishing artefacts is an explicit act anyway: you should decide
  # when a rebuild happens, not have it happen on every edit.
  workflow_dispatch:
    inputs:
      only:
        description: 'rebuild a single entry only, e.g. "node-22.23.4" (empty = all)'
        required: false
        default: ""

permissions:
  contents: write        # create releases, upload assets, commit matrix.yml

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.gen.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: gen
        env:
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          # The matrix comes from matrixlib, so this workflow and install.sh
          # cannot disagree about what an entry is called.
          python3 - <<'PY' > /tmp/list.json
          import json, os, sys
          sys.path.insert(0, ".")
          import matrixlib
          only = os.environ.get("ONLY", "").strip()
          out = []
          # `only` is a NAME, not necessarily a full directory: it is resolved
          # the same way install.sh resolves it, so `only: swift-sdk-wasm` and
          # `only: swift-sdk-wasm-6.4.1` and `only: node-22` all work. Comparing
          # raw strings instead silently produced a run with ZERO build jobs -
          # setup and publish both "succeeded" while nothing was built.
          only_dir = None
          if only:
              _e = matrixlib.resolve_requirement(only)
              if _e is None:
                  sys.exit("only=%r matches no setup" % only)
              only_dir = _e["dir"]
          for e in matrixlib.load():
              if only_dir and e["dir"] != only_dir:
                  continue
              out.append({"dir": e["dir"], "tool": e["tool"],
                          "version": e["version"], "artifact": e["artifact"],
                          # `builder` is the script that produces the tarball;
                          # several tools can share one (rust-toolchain-*).
                          "builder": e["builder"],
                          # Space-separated list of setups to run before this
                          # one; empty for most.
                          "requires": " ".join(e["requires"])})
          print(json.dumps({"include": out}))
          PY
          echo "list=$(cat /tmp/list.json)" >> "$GITHUB_OUTPUT"
          python3 -c 'import json;d=json.load(open("/tmp/list.json"));[print(x["dir"],x["tool"],x["version"]) for x in d["include"]]'

  build:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.list) }}
    container:
      image: debian:trixie
    steps:
      - name: build prerequisites
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates curl xz-utils python3 tar >/dev/null

      - uses: actions/checkout@v4

      # Install this setup's OWN apt_deps, the same list install.sh uses. The
      # build/verify steps then run in the same library environment a consumer
      # gets, which is what makes the ldd check meaningful: a missing entry in
      # apt_deps shows up here instead of in someone's pipeline.
      - name: install apt_deps for ${{ matrix.dir }}
        shell: bash
        run: |
          set -euo pipefail
          DEPS=$(python3 matrixlib.py apt "${{ matrix.dir }}")
          echo "apt_deps: $DEPS"
          # No bash-isms needed beyond this point, but the step is pinned to bash
          # because the job container's default shell is dash and the previous
          # version died on 'Bad substitution' (${DEPS// /}).
          if [ -n "$DEPS" ]; then
            # apt-get update is repeated here: the index from the earlier
            # "build prerequisites" step was already deleted (`rm -rf
            # /var/lib/apt/lists/*` is the habit in every Debian image), and
            # without an index apt-get install exits 2 with no useful message.
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends $DEPS
          fi

      - name: build ${{ matrix.dir }}
        shell: bash
        run: |
          set -euo pipefail
          # The build script is chosen by TOOL, but installs under the PATH ID so
          # node-22 and node-24 do not overwrite each other.
          bash "tools/build-${{ matrix.builder }}.sh" \
            "${{ matrix.dir }}" "${{ matrix.version }}" /tmp/out
          ls -lh /tmp/out

      # Verify in a clean directory: unpack, then run the tool by absolute path.
      # A tarball that unpacks but ships a broken binary must fail HERE, not in
      # some consumer's CI.
      #
      # `ldd` first, and that is the point: running the binary only reveals a
      # missing shared library by accident (node 26 died on libatomic.so.1 while
      # node 22/24 were fine). ldd names EVERY unresolved library up front, so a
      # typo in apt_deps fails the build instead of shipping a broken tarball.
      - name: verify ${{ matrix.dir }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/verify && cd /tmp/verify
          tar -xJf "/tmp/out/${{ matrix.artifact }}"
          R="/tmp/verify/opt/setup/${{ matrix.dir }}"
          test -d "$R"
          # BEAM (erlang/elixir) aborts on boot when the locale is not UTF-8
          # ("Runtime terminating during boot ... io:put_chars"), because it
          # expects utf8 filenames. A bare container has no locale at all, so
          # set one: this is a runtime requirement of the tool, not a defect in
          # the tarball, and env.sh exports the same for consumers.
          #
          # Setting LANG alone is not enough: C.UTF-8 must EXIST, and a minimal
          # debian image ships no generated locales, so generate it here.
          if ! locale -a 2>/dev/null | grep -qi '^C\.utf-8$'; then
            apt-get install -y -qq --no-install-recommends locales >/dev/null 2>&1 || true
            localedef -i C -f UTF-8 C.UTF-8 2>/dev/null || true
          fi
          export LANG=C.UTF-8 LC_ALL=C.UTF-8
          # A setup that `requires` another cannot be exercised alone: elixir
          # shells out to `erl`, luarocks to `lua`. Those dependencies are not
          # in this job's artifact, so build each one from its own recipe and
          # unpack it beside this tree. Without that, "run the tool" would only
          # ever pass for self-contained tools and the dependency path would go
          # untested until a consumer hit it.
          for req in ${{ matrix.requires }}; do
            echo "--- building dependency $req"
            # The step is `cd /tmp/verify`, but matrixlib reads matrix.yml by a
            # RELATIVE path, so every lookup must run with the checkout as cwd.
            REPO="$GITHUB_WORKSPACE"
            rbuilder=$(cd "$REPO" && python3 matrixlib.py get "$req" builder)
            rver=$(cd "$REPO" && python3 matrixlib.py get "$req" version)
            rart=$(cd "$REPO" && python3 matrixlib.py get "$req" artifact)
            # A dependency may itself need packages (lua builds with gcc/make).
            # Install ITS apt_deps too, or the build fails for a reason that has
            # nothing to do with the setup under test.
            rdeps=$(cd "$REPO" && python3 matrixlib.py apt "$req")
            if [ -n "$rdeps" ]; then
              apt-get install -y -qq --no-install-recommends $rdeps
            fi
            ( cd "$REPO" && bash "tools/build-$rbuilder.sh" "$req" "$rver" /tmp/out-dep )
            tar -xJf "/tmp/out-dep/$rart" -C /tmp/verify
            # Put the dependency on PATH so the tool under test can exec it.
            if [ -d "/tmp/verify/opt/setup/$req/bin" ]; then
              PATH="/tmp/verify/opt/setup/$req/bin:$PATH"
              export PATH
            fi
            echo "--- dependency $req unpacked at /tmp/verify/opt/setup/$req"
          done
          # Not every toolchain has a bin/ dir: dotnet unpacks to the prefix
          # root (dotnet, sdk/, shared/), while node/python/go put binaries in
          # bin/. Use whichever exists rather than assuming.
          if [ -d "$R/bin" ]; then B="$R/bin"; else B="$R"; fi
          echo "checking $B"
          # A tool whose launcher hard-codes /opt/setup/<dir> (R does, because it
          # refuses $R_HOME) cannot be run from /tmp/verify. Stand the final path
          # up with a symlink, exactly as the consumer will have it.
          FINAL="/opt/setup/${{ matrix.dir }}"
          if [ ! -e "$FINAL" ]; then
            mkdir -p /opt/setup
            ln -s "$R" "$FINAL"
            LINKED=1
          fi

          # Every ELF in bin/ must resolve all of its shared libraries.
          #
          # EXCEPT when the entry is a CROSS target: a windows-gnu tree ships
          # .dll/.exe objects and a windows-msvc tree ships std for a target
          # whose libraries do not exist on linux, so `ldd` reporting "not
          # found" there is correct and expected. Only the host-target entries
          # (no `target:` field) are held to the ldd check.
          echo "--- shared library check"
          missing=0
          if [ "${{ matrix.builder }}" = "rust" ] && [ "${{ matrix.tool }}" != "rust" ]; then
            echo "${{ matrix.tool }}: a cross-compile std, its libraries are not for linux - skipping ldd"
          else
            # Some trees ship their own .so (ruby bundles libruby.so.4.0 inside
            # lib/). ldd must run with the same LD_LIBRARY_PATH the consumer's
            # env.sh sets, or it reports "not found" for a library that IS in
            # the tarball.
            # Two places to look: the tree's lib/ (ruby's libruby.so) and
            # lib/bundled/ (libraries whose ABI the target distro lacks - R ships
            # libicuuc.so.74 and libjpeg.so.8 there). Both must be searched here
            # exactly as env.sh will at run time, or ldd reports a false miss.
            TREE_LIB="/tmp/verify/opt/setup/${{ matrix.dir }}/lib"
            export LD_LIBRARY_PATH="$TREE_LIB/bundled:$TREE_LIB${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            for f in "$B"/*; do
              [ -f "$f" ] || continue
              case "$(head -c 4 "$f" 2>/dev/null | od -An -c | tr -d ' ')" in
                *177ELF*)
                  if ldd "$f" 2>&1 | grep -q 'not found'; then
                    echo "MISSING for $f:"
                    ldd "$f" 2>&1 | grep 'not found'
                    missing=1
                  fi ;;
              esac
            done
          fi
          [ "$missing" -eq 0 ] || {
            echo "the tarball needs libraries apt_deps did not install" >&2
            echo "add them to apt_deps for ${{ matrix.dir }} in matrix.yml" >&2
            exit 1; }

          echo "--- run the tool"
          if [ "${{ matrix.builder }}" = "rust" ] && [ "${{ matrix.tool }}" != "rust" ]; then
            # A cross-compile std has no runnable binary of its own. Assert the
            # std for its target is actually in the tree, which is the
            # deliverable.
            # matrix.tool is `rust-toolchain-<target>`; strip the fixed prefix
            # with a shell parameter expansion (a GitHub expression cannot do it).
            full='${{ matrix.tool }}'
            tgt=${full#rust-toolchain-}
            found=$(find "/tmp/verify/opt/setup/${{ matrix.dir }}" -type d \
                      -path "*rustlib/$tgt*" | head -1)
            [ -n "$found" ] || {
              echo "std for $tgt is not in the tree" >&2; exit 1; }
            echo "std for $tgt present: $found"
          else
            case "${{ matrix.tool }}" in
              node)   "$B/node" --version ;;
              python) "$B/python3" --version ;;
              go)     "$B/go" version ;;
              java)   "$B/java" -version 2>&1 | head -1 ;;
              ruby)   "$B/ruby" --version ;;
              php)    "$B/php" --version | head -1 ;;
              helm)   "$B/helm" version --short ;;
              buf)    "$B/buf" --version ;;
              deno)   "$B/deno" --version ;;
              dart)   "$B/dart" --version ;;
              julia)  "$B/julia" --version ;;
              perl)   "$B/perl" -v 2>&1 | sed -n 2p ;;
              lua)    "$B/lua" -v 2>&1 | head -1 ;;
              # NOT `| head -1` for BEAM: it writes to stdout while booting, and
              # closing the pipe early kills the VM with
              # "Runtime terminating during boot (... {io,terminated})".
              erlang) "$B/erl" -noshell -eval 'io:format("~s~n",[erlang:system_info(otp_release)]),halt().' > /tmp/otp.txt 2>&1; cat /tmp/otp.txt ;;
              elixir) "$B/elixir" --version > /tmp/ev.txt 2>&1; head -1 /tmp/ev.txt ;;
              opam)   "$B/opam" --version ;;
              conda)  "$B/conda" --version ;;
              ghc)    "$B/ghc" --version ;;
              cabal)  "$B/cabal" --version ;;
              swift)  "$B/swift" --version ;;
              # An SDK has no binary; assert its artifactbundle manifest and
              # payload are present, which is what the compiler needs.
              swift-sdk-*)
                bd=$(find "$R" -maxdepth 2 -name '*.artifactbundle' | head -1)
                [ -n "$bd" ] && [ -f "$bd/info.json" ] || {
                  echo "swift-sdk: no artifactbundle/info.json" >&2; exit 1; }
                # The payload directory is not named after the SDK, so check for
                # the structure (a directory beside info.json), not a fixed name.
                pl=$(find "$bd" -maxdepth 1 -mindepth 1 -type d | head -1)
                [ -n "$pl" ] || { echo "swift-sdk: no payload dir" >&2; exit 1; }
                echo "artifactbundle: $(basename "$bd") / payload $(basename "$pl")" ;;
              # The build rewrote bin/R's baked-in prefix, so it runs as-is.
              r)      "$B/R" --version | head -1 ;;
              # luarocks is a lua script: its `requires` put lua on PATH above,
              # so this actually runs it.
              luarocks) "$B/luarocks" --version | head -1 ;;
              # dotnet's binary sits at the prefix root, not in bin/.
              dotnet) "$R/dotnet" --version ;;
              # maven / gradle / bazel need a JRE that is not in the tarball by
              # design; their build scripts already verified the layout.
              maven|gradle|bazel) echo "${{ matrix.tool }}: layout checked at build time" ;;
              *) echo "no runtime check for ${{ matrix.tool }}" ;;
            esac
          fi

      # The container's filesystem is thrown away with the job, so the tarball
      # has to travel to the publish job through the Actions artifact store.
      - uses: actions/upload-artifact@v4
        with:
          name: setup-${{ matrix.dir }}
          path: /tmp/out/${{ matrix.artifact }}
          retention-days: 1

  publish:
    needs: [setup, build]
    runs-on: ubuntu-latest
    # Publish whatever DID build. The default is to skip this whole job when any
    # build fails, which means one flaky download costs the other fourteen their
    # release. Publishing the rest is safe: each release is per-setup and
    # install.sh only ever fetches the asset its matrix entry names.
    if: always() && needs.setup.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        # A run with `only:` produces exactly one artifact, and a run where the
        # single build failed produces none. download-artifact@v4 FAILS when no
        # artifact matches, which then fails the whole publish job even though
        # there is simply nothing to publish - so let it fail softly and check
        # for ourselves.
        continue-on-error: true
        with:
          pattern: setup-*
          path: /tmp/assets
          merge-multiple: true

      - name: publish releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -d /tmp/assets ] || [ -z "$(ls -A /tmp/assets 2>/dev/null)" ]; then
            echo "no artifacts to publish (every build in this run failed or was skipped)"
            exit 0
          fi
          ls -l /tmp/assets
          # One release per tool+version. Delete-and-recreate so a rebuild
          # replaces the asset instead of piling up duplicates.
          python3 - <<'PY' > /tmp/releases.txt
          import sys
          sys.path.insert(0, ".")
          import matrixlib
          for e in matrixlib.load():
              print(f'{e["dir"]}\t{e["version"]}\t{e["artifact"]}')
          PY
          while IFS=$'\t' read -r id version artifact; do
            # `id` is already <tool>-<version> (matrixlib derives it), so the
            # release tag is the id itself - no second place assembles a name.
            tag="$id"
            # A build that failed upstream has no asset here. Skipping it keeps
            # the other releases going; the entry's sha256 stays empty, and
            # install.sh refuses to unpack an unverified asset, so a missing
            # artefact fails loudly at install time instead of silently.
            if [ ! -s "/tmp/assets/$artifact" ]; then
              echo "=== skip $tag (no asset: its build failed)"
              continue
            fi
            echo "=== release $tag"
            gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
            gh release create "$tag" \
              --title "$id $version (debian-trixie amd64)" \
              --notes "Prebuilt /opt/setup/$id tree for debian trixie amd64.

          Extract with \`tar -xJf <asset> -C /\`, or let install.sh do it:
              curl -fsSL https://raw.githubusercontent.com/easydev-org/easysetup/main/install.sh | bash -s -- $id" \
              "/tmp/assets/$artifact"
          done < /tmp/releases.txt

      # Pin the checksums into matrix.yml, because install.sh refuses to unpack
      # an asset it cannot verify.
      #
      # The work lives in tools/pin-checksums.sh: it needs a loop, a retry and a
      # heredoc, and inlining those let the YAML indentation decide the meaning of
      # the program. It also edits the LATEST main rather than this job's
      # checkout, because main moves while fifteen builds run.
      - name: record sha256 in matrix.yml
        run: bash tools/pin-checksums.sh /tmp/assets

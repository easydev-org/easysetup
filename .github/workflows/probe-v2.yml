name: probe-v2

# Three questions, all raised by looking at the current 94 setups:
#
#   1. llvm and lldb are at 21.1.8 while clang is at 23.1.3, because clang comes
#      from `llvmPackages_23` and the others from the default `llvm`. Do the
#      matching `llvmPackages_23.*` attributes exist, so a project can have one
#      consistent toolchain?
#
#   2. git, gh, make and friends are simply absent. Do the attributes exist?
#
#   3. every language should have its linter / formatter / language server. Which
#      of those exist per language, and are they cached?
#
# A candidate must clear all three bars, learned the hard way here: attribute
# exists, output is in cache.nixos.org (a miss means compiling from source on
# every build), and the build produces a binary (jq's outPath is its man output;
# crystal's does not exist; and neither head nor tail of a multi-output build is
# necessarily the one with bin/).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: probe
        run: |
          set -uo pipefail
          set +e

          printf '%-36s %-12s %-6s %-5s %s\n' ATTR VERSION CACHE BINS FIRST-BIN
          printf '%-36s %-12s %-6s %-5s %s\n' '------------------------------------' '------------' '-----' '----' '------------------'

          probe() {
            local attr="$1" name ver outs chosen h code nb names p
            name=$(nix eval --raw "nixpkgs#$attr.name" 2>/dev/null) || name=""
            if [ -z "$name" ]; then
              printf '%-36s %-12s %-6s %-5s %s\n' "$attr" "-" "-" "-" "no such attribute"
              return
            fi
            ver=$(nix eval --raw "nixpkgs#$attr.version" 2>/dev/null) || ver="?"

            outs=$(nix build --no-link --print-out-paths "nixpkgs#$attr" 2>/dev/null) || outs=""
            if [ -z "$outs" ]; then
              printf '%-36s %-12s %-6s %-5s %s\n' "$attr" "${ver:0:11}" "?" "-" "BUILD FAILED"
              return
            fi
            # Select the output that actually holds executables - neither head nor
            # tail of this list is reliable.
            chosen=""; nb=0; names=""
            for p in $outs; do
              if [ -d "$p/bin" ] || [ -d "$p/sbin" ]; then chosen="$p"; break; fi
            done
            [ -n "$chosen" ] || chosen=$(printf '%s\n' "$outs" | head -1)
            for sub in bin sbin; do
              if [ -d "$chosen/$sub" ]; then
                nb=$((nb + $(ls "$chosen/$sub" 2>/dev/null | wc -l)))
                [ -z "$names" ] && names=$(ls "$chosen/$sub" 2>/dev/null | head -3 | tr '\n' ' ')
              fi
            done
            [ "$nb" -gt 0 ] || names="(no bin/)"
            h=$(basename "$chosen" | cut -d- -f1)
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://cache.nixos.org/$h.narinfo")
            printf '%-36s %-12s %-6s %-5s %s\n' "$attr" "${ver:0:11}" "$code" "$nb" "$names"
          }

          echo "===== 1. llvm toolchain, matched to clang 23 ====="
          probe llvmPackages_23.llvm
          probe llvmPackages_23.lldb
          probe llvmPackages_23.clang-tools
          probe llvmPackages_23.llvm-manpages
          probe llvmPackages_23.bintools
          probe llvmPackages_23.mlir
          probe clang-tools

          echo
          echo "===== 2. the basics nobody thinks to add ====="
          probe git
          probe gh
          probe glab
          probe gnumake
          probe curl
          probe wget
          probe rsync
          probe openssh
          probe gnupg
          probe unzip
          probe zip
          probe xz
          probe zstd
          probe tar
          probe coreutils
          probe findutils
          probe util-linux
          probe procps
          probe tzdata
          probe ca-certificates

          echo
          echo "===== 3a. JS/TS: lint, format, LSP ====="
          probe typescript-language-server
          probe vscode-langservers-extracted
          probe biome
          probe prettier
          probe eslint
          probe deno
          probe nodePackages.npm

          echo
          echo "===== 3b. Python: lint, format, LSP, test ====="
          probe python314Packages.ruff
          probe python314Packages.black
          probe python314Packages.mypy
          probe python314Packages.pylint
          probe python314Packages.flake8
          probe python314Packages.isort
          probe python314Packages.pytest
          probe python314Packages.coverage
          probe python314Packages.jupyter
          probe python314Packages.ipython
          probe pyright
          probe python-lsp-server
          probe basedpyright

          echo
          echo "===== 3c. Go: lint, format, LSP ====="
          probe go
          probe gopls
          probe gotools
          probe go-tools
          probe golangci-lint
          probe goreleaser
          probe delve
          probe gofumpt
          probe staticcheck

          echo
          echo "===== 3d. Rust: lint, format, LSP ====="
          probe rust-analyzer
          probe rustfmt
          probe clippy
          probe cargo-watch
          probe cargo-nextest
          probe cargo-audit
          probe cargo-edit
          probe cargo-make

          echo
          echo "===== 3e. PHP: lint, format, LSP, test ====="
          probe php85Packages.php-cs-fixer
          probe php85Packages.phpstan
          probe php85Packages.psalm
          probe php85Packages.phpmd
          probe php85Packages.phpcs
          probe php85Packages.phpunit
          probe php85Packages.phpspec
          probe php85Packages.phan
          probe php85Packages.intelephense
          probe php85Packages.phpactor

          echo
          echo "===== 3f. Java/JVM: lint, format, LSP ====="
          probe checkstyle
          probe spotbugs
          probe pmd
          probe jdt-language-server
          probe google-java-format

          echo
          echo "===== 3g. Ruby: lint, format, LSP, test ====="
          probe rubyPackages.rubocop
          probe rubyPackages.ruby-lsp
          probe rubyPackages.solargraph
          probe rubyPackages.rspec
          probe rubyPackages.rake
          probe rubyPackages.standardrb

          echo
          echo "===== 3h. Lua: lint, format, LSP ====="
          probe lua-language-server
          probe stylua
          probe luacheck

          echo
          echo "===== 3i. C/C++: lint, format, LSP, analyze ====="
          probe clang-tools
          probe cppcheck
          probe cpplint
          probe include-what-you-use
          probe gcovr
          probe lcov
          probe ccls
          probe bear

          echo
          echo "===== 3j. Shell / config / docs ====="
          probe shellcheck
          probe shfmt
          probe yamllint
          probe yamlfmt
          probe markdownlint-cli2
          probe taplo
          probe actionlint
          probe buf

          echo
          echo "===== 3k. others worth having ====="
          probe sqlfluff
          probe jq
          probe yq-go
          probe jqp
          probe dasel
          probe miller
          probe hyperfine
          probe gh
          probe act
          probe pre-commit

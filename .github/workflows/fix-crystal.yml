name: fix-crystal

# Two setups need attention before the manifest is correct:
#
#   crystal-1.21.1   0 store paths, 0 binaries - the tarball is empty. Something
#                    about how nixpkgs' crystal resolves makes `outPath` point at
#                    nothing useful, or the build silently produced an empty tree.
#
#   phpmd-2.15.0     exits 255. It may be that --version is not its flag, which is
#                    harmless, or that it cannot start, which is not.
#
# Both are answered by running them, not by reading.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: crystal
        run: |
          set -uo pipefail
          set +e
          echo "== what does the setup file say? =="
          cat setups/crystal-1.21.1.nix
          echo
          echo "== the flake's attr =="
          nix eval --raw '.#"crystal-1.21.1".outPath' > /tmp/o 2>&1; echo "exit=$?"; cat /tmp/o
          echo
          out=$(nix eval --raw '.#"crystal-1.21.1".outPath' 2>/dev/null) || out=""
          if [ -n "$out" ]; then
            echo "outPath: $out"
            nix build --no-link '.#"crystal-1.21.1"' > /tmp/b 2>&1; echo "build exit=$?"
            tail -15 /tmp/b
            echo "== exists? =="
            ls -la "$out" 2>&1 | head -10
            echo "== closure =="
            nix path-info -r "$out" 2>&1 | head -5
          fi
          echo
          echo "== what is under nixpkgs#crystal itself? =="
          co=$(nix build --no-link --print-out-paths 'nixpkgs#crystal' 2>/dev/null | tail -1) || co=""
          echo "nixpkgs#crystal -> ${co:-<none>}"
          [ -n "$co" ] && ls "$co/bin" 2>/dev/null | head

      - name: phpmd
        run: |
          set -uo pipefail
          set +e
          out=$(nix eval --raw '.#"phpmd-2.15.0".outPath' 2>/dev/null) || out=""
          echo "outPath: ${out:-<unresolved>}"
          [ -n "$out" ] || exit 0
          nix build --no-link '.#"phpmd-2.15.0"' >/dev/null 2>&1
          echo "== phpmd (no args) =="
          "$out/bin/phpmd" --help > /tmp/p1 2>&1; echo "exit=$?"
          head -12 /tmp/p1
          echo
          echo "== phpmd --version =="
          "$out/bin/phpmd" --version > /tmp/p2 2>&1; echo "exit=$?"
          head -12 /tmp/p2

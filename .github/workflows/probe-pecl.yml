name: probe-pecl

# Is `pecl` really inside php's bin, and does `pecl` actually run?

# Everything about the pecl/pear manifest entries rests on this: nixpkgs sets
# pearSupport ? true, php's configure gets --with-pear, and PEAR's installer writes
# php, pear and pecl into $out/bin. If that is wrong, the entries point at a setup
# that does not contain the tool their name promises.

# `pecl version` is not enough on its own - it is a PHP script, so a broken
# interpreter path shows up as a PHP error rather than a missing file.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: what php85 puts in bin
        run: |
          set -euo pipefail
          out=$(nix build --no-link --print-out-paths --system x86_64-linux \
                  --option max-jobs 0 '.#"php-8.5.11"' | tail -1)
          echo "out=$out"
          echo "== bin =="
          ls "$out/bin"
          echo
          for t in php pear pecl; do
            if [ -e "$out/bin/$t" ]; then echo "$t: PRESENT"; else echo "$t: ABSENT"; fi
          done

      - name: and does pecl actually run
        run: |
          set -uo pipefail
          out=$(nix build --no-link --print-out-paths --system x86_64-linux \
                  --option max-jobs 0 '.#"php-8.5.11"' | tail -1)
          set +e
          echo "== pecl version =="
          "$out/bin/pecl" version 2>&1 | head -6
          echo "exit=$?"
          echo "== pear version =="
          "$out/bin/pear" version 2>&1 | head -4

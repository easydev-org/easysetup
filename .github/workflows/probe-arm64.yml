name: probe-arm64

# Can the arm64 closures be built the same way the amd64 ones are?

# The whole design rests on substitution: every setup must be downloadable from
# cache.nixos.org, never compiled. That was verified for x86_64-linux. arm64 is a
# different system and Hydra does not necessarily build both, so before changing
# the build matrix this checks, per setup:

#   * does the attribute evaluate for aarch64-linux
#   * is the resulting path in the cache
#   * what does it cost in bytes

# A setup that would compile from source is disqualifying: 200 of them compiled
# on an emulated runner is not a build, it is a day.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-platforms = aarch64-linux

      - name: a sample across the categories, on aarch64
        run: |
          set -uo pipefail
          set +e
          printf '%-26s %-14s %-6s %s\n' ATTR VERSION CACHE OUT
          probe() {
            local attr="$1" out v h c
            out=$(nix build --no-link --print-out-paths --system aarch64-linux \
                    "nixpkgs#$attr" 2>/dev/null | head -1) || out=""
            if [ -z "$out" ]; then printf '%-26s %-14s %-6s %s\n' "$attr" "-" "-" "BUILD-NEEDED"; return; fi
            v=$(nix eval --raw "nixpkgs#$attr.version" 2>/dev/null) || v="?"
            h=$(basename "$out" | cut -d- -f1)
            c=$(curl -s -o /dev/null -w '%{http_code}' "https://cache.nixos.org/$h.narinfo")
            printf '%-26s %-14s %-6s %s\n' "$attr" "${v:0:13}" "$c" "$(basename "$out" | cut -c1-40)"
          }
          echo "== the ones that matter for the shell image =="
          for a in bash busybox curl coreutils cacert; do probe "$a"; done
          echo
          echo "== a spread of the rest, including the heavy ones =="
          for a in jq nodejs_26 python314 go rust-1.99.0 openjdk swift llvmPackages_23.clang flutter; do
            probe "$a"
          done
          echo
          echo "== the ones most likely to have no arm64 build =="
          for a in dotnet-sdk_10 kotlin scala-cli ghidra; do probe "$a"; done

      - name: can the amd64 runner even evaluate aarch64 without emulation
        run: |
          set -uo pipefail
          set +e
          # `--system aarch64-linux` makes nix *evaluate* for that platform. If the
          # output is in the cache it is never compiled, so no emulator is needed -
          # this is the property the whole plan depends on.
          echo "== a path in the cache downloads without running arm64 code =="
          time nix build --no-link --print-out-paths --system aarch64-linux 'nixpkgs#bash' 2>&1 | tail -2
          echo
          echo "== confirm the binary really is aarch64 =="
          o=$(nix build --no-link --print-out-paths --system aarch64-linux 'nixpkgs#bash' 2>/dev/null | head -1)
          file "$o/bin/bash" 2>/dev/null
          echo
          echo "== and that it cannot run here, as expected =="
          "$o/bin/bash" --version 2>&1 | head -2

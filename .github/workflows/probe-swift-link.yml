name: probe-swift-link

# Does a LIBRARY_PATH of the closure's lib dirs make `swiftc a.swift` link?
#
# The claim under test, and why it matters
# ----------------------------------------
# nixpkgs builds swift with its runtime .so files in `$out/lib`, but the driver
# searches `$out/lib/swift/linux`, which holds only .swiftmodule files. So a
# plain `swiftc main.swift -o app` fails:
#
#   ld.bfd: cannot find -lswiftCore
#
# and even after adding -L for swiftCore, libFoundation.so's OWN dependencies are
# in SIBLING store paths (ICU), so the link then fails with:
#
#   ld.bfd: libFoundation.so: undefined reference to `uloc_toLegacyKey'
#
# setups/swift-6.3.3.nix used to "fix" this by rewriting the swiftc binary with a
# wrapper. That fix never shipped: the release is built from a nix derivation, the
# override changes the derivation, and the overridden path is NOT in
# cache.nixos.org, so it can only be produced by COMPILING swift (hours). The
# previous version of this workflow passed `--option max-jobs 0`, i.e. it forbade
# that compile, so it could never build the override and never ran the test:
#
#   error: Cannot build '/nix/store/zbnwc...-swift-6.3.3.drv'.
#          Reason: local builds are disabled (max-jobs = 0)
#
# This workflow tests the alternative that needs NO rebuild: export the library
# search path. It is a property of the ENVIRONMENT, not of the binary, so any
# published tarball works.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org

      # Build the UNMODIFIED package: this is what the released tarball contains,
      # and what a user actually gets. Local builds stay allowed, so nix can
      # produce the derivation if the cache misses; the step reports which it did.
      - name: build swift (as released, no override)
        run: |
          set -euo pipefail
          # A `git+file://...?shallow=1` flake only sees git's index, and
          # actions/checkout leaves it shallow, so `.#swift-6.3.3` resolved to
          # "does not provide attribute". A PATH flake reads the working tree.
          FLAKE="path:$PWD"
          echo "== does x86_64-linux expose swift? =="
          nix eval "$FLAKE#packages.x86_64-linux" --apply builtins.attrNames 2>&1 | tr ',' '\n' | grep -c swift || echo "no swift in the attr names"
          nix eval "$FLAKE#packages.x86_64-linux" --apply builtins.attrNames 2>&1 | tr ',' '\n' | grep swift || true
          echo "== and the per-system attr directly? =="
          nix eval "$FLAKE#packages.x86_64-linux.swift-6.3.3.name" 2>&1 | head -5 || true
          echo "== will this be a download or a compile? =="
          nix build --dry-run --system x86_64-linux "$FLAKE#swift-6.3.3" --extra-experimental-features 'nix-command flakes' 2>&1 | tail -8 || true
          out=$(nix build --no-link --print-out-paths --system x86_64-linux "$FLAKE#swift-6.3.3" | tail -1)
          echo "swift out = $out"
          echo "OUT=$out" >> "$GITHUB_ENV"

      - name: record what the published layout actually is
        run: |
          set -euo pipefail
          echo "--- $OUT ---"
          ls "$OUT"
          echo "--- bin/ ---"
          ls "$OUT/bin" 2>/dev/null || echo "(no bin/ in this store path)"
          echo "--- lib/ count: $(ls "$OUT/lib" 2>/dev/null | wc -l) ---"
          # The driver and the runtime live in DIFFERENT store paths (swiftc,
          # swift-driver, swift-corelibs-foundation). Say so rather than assume.
          echo "--- which store path has swiftc? ---"
          readlink -f "$(nix path-info -r "$OUT" 2>/dev/null | xargs -I{} sh -c 'test -e {}/bin/swiftc && echo {}/bin/swiftc' | head -1)" || true

      # The fix under test: LIBRARY_PATH covering every lib/ in the closure.
      - name: derive the library search path from the closure
        run: |
          set -euo pipefail
          libs=$(nix path-info -r "$OUT" | while read -r p; do
                   [ -d "$p/lib" ] && printf '%s:' "$p/lib"
                 done | sed 's/:$//')
          echo "lib dirs: $(echo "$libs" | tr ':' '\n' | wc -l)"
          echo "ICU on the path: $(echo "$libs" | tr ':' '\n' | grep -c ICU || true)"
          echo "LIBRARY_PATH=$libs" >> "$GITHUB_ENV"
          echo "NIX_LDFLAGS=$(echo "$libs" | tr ':' '\n' | sed 's/^/-L/' | tr '\n' ' ')" >> "$GITHUB_ENV"

      # THE assertion: with LIBRARY_PATH set (and NO -L on the command line), a
      # program that pulls in Foundation -- and therefore ICU -- must link and run.
      - name: it links and runs WITHOUT any -L on the command line
        run: |
          set -euo pipefail
          mkdir -p /tmp/t && cd /tmp/t
          cat > main.swift <<'EOF'
          import Foundation
          let d = ["ok": true]
          let j = try! JSONSerialization.data(withJSONObject: d)
          print(String(data: j, encoding: .utf8)!)
          EOF
          swiftc main.swift -o app 2>&1 | tee /tmp/link.log || {
            echo "::error::swiftc failed with LIBRARY_PATH set"
            grep -c "undefined reference" /tmp/link.log || true
            exit 1
          }
          got=$(./app)
          echo "program printed: $got"
          [ "$got" = '{"ok":true}' ] || { echo "::error::wrong output: $got"; exit 1; }
          echo "swiftc links ICU-dependent Foundation with no explicit -L"

      - name: and `swift build` works too
        run: |
          set -euo pipefail
          mkdir -p /tmp/p && cd /tmp/p
          cat > Package.swift <<'EOF'
          // swift-tools-version:5.9
          import PackageDescription
          let package = Package(
            name: "probe",
            targets: [.executableTarget(name: "probe", path: "Sources/probe")]
          )
          EOF
          mkdir -p Sources/probe
          cat > Sources/probe/main.swift <<'EOF'
          import Foundation
          print("built by swift build:", (["a": 1] as NSDictionary).count)
          EOF
          swift build 2>&1 | tail -8
          ./.build/debug/probe

      # A CONTROL: without LIBRARY_PATH the same program must FAIL. Without this
      # the test above proves nothing -- it could be passing for another reason
      # (an -L baked into the driver, a cached artifact).
      - name: control - the same build fails without LIBRARY_PATH
        run: |
          set -euo pipefail
          mkdir -p /tmp/c && cd /tmp/c
          cat > main.swift <<'EOF'
          import Foundation
          print("x")
          EOF
          # Unset ONLY the variable under test, keeping PATH so swiftc is found.
          if env -u LIBRARY_PATH -u NIX_LDFLAGS swiftc main.swift -o app2 2>/tmp/control.log; then
            echo "::warning::the build SUCCEEDED without LIBRARY_PATH; the wrapper-free claim is untested (the driver may now carry -L itself)"
          else
            echo "the control failed as expected; tail:"
            tail -5 /tmp/control.log
            if grep -q "undefined reference" /tmp/control.log; then
              echo "confirmed: the failure is an unresolved symbol (ICU), which LIBRARY_PATH resolves"
            fi
          fi

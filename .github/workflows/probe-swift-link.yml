name: probe-swift-link

# Does the swift SETUP produce a compiler that can link, without compiling swift?
#
# Two properties, neither of which was ever checked, and whose absence let a
# broken swift ship:
#
#  1. SUBSTITUTABLE -- `nix build --dry-run` must report "0 paths will be built".
#     The release pipeline refuses a setup that would be compiled ("is not fully
#     substitutable: N path(s) would be compiled"), because compiling swift can
#     run for hours. An `overrideAttrs` therefore CANNOT ship: it changes the
#     derivation, so the store path is not in cache.nixos.org. That is exactly
#     what happened -- the override sat in setups/swift-6.3.3.nix, the tarball was
#     built two days earlier, and every published swift was the unpatched one.
#
#  2. it LINKS -- a program importing Foundation (which pulls in ICU) must compile
#     and RUN with no -L on the command line. The published swift fails with:
#         ld.bfd: cannot find -lswiftCore
#         ld.bfd: libFoundation.so: undefined reference to `uloc_toLegacyKey'
#
# The fix under test is a symlinkJoin wrapper: it reuses the unchanged swift
# derivation (still a download) and only adds scripts that append -L/-rpath.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org

      # Fail before downloading gigabytes if the expression is wrong.
      - name: the expression evaluates
        run: |
          set -euo pipefail
          FLAKE="path:$PWD"
          # `nix eval .#swift-6.3.3.name` reports "does not provide attribute" even
          # though attrNames lists it: a value that THROWS during evaluation is
          # indistinguishable from a missing one in that message. Force it through
          # getFlake so the real error surfaces, which is the whole point of this
          # step.
          nix eval --impure --expr "
            let f = builtins.getFlake \"$FLAKE\";
            in f.packages.x86_64-linux.swift-6.3.3.name
          " 2>&1 | tail -30

      # The release rule. A non-zero count means the fix cannot ship.
      - name: it is substitutable (0 paths would be built)
        run: |
          set -euo pipefail
          FLAKE="path:$PWD"
          dry=$(nix build --dry-run "$FLAKE#swift-6.3.3" 2>&1 || true)
          printf '%s\n' "$dry" | tail -15
          built=$(printf '%s\n' "$dry" | grep -c 'will be built' || true)
          echo "paths built locally: $built"
          if [ "${built:-0}" -gt 0 ]; then
            echo "::error::the swift setup needs a local build ($built path(s)); the release pipeline rejects that"
            printf '%s\n' "$dry" | grep 'will be built' | head -10
            exit 1
          fi

      - name: build it
        run: |
          set -euo pipefail
          FLAKE="path:$PWD"
          out=$(nix build --no-link --print-out-paths "$FLAKE#swift-6.3.3" | tail -1)
          echo "OUT=$out" >> "$GITHUB_ENV"
          echo "built: $out"
          echo "--- bin/ ---"
          ls "$out/bin"

      - name: the wrappers carry the link flags
        run: |
          set -euo pipefail
          for p in swift swiftc swift-driver; do
            f="$OUT/bin/$p"
            [ -e "$f" ] || { echo "::error::missing $f"; exit 1; }
            echo "--- $p ---"
            head -14 "$f"
            grep -q -- '-L' "$f" || { echo "::error::$p has no -L"; exit 1; }
            grep -q -- 'rpath' "$f" || { echo "::error::$p has no rpath"; exit 1; }
          done

      # THE assertion: no -L on the command line; the wrapper must supply it.
      - name: it links and runs a Foundation program
        run: |
          set -euo pipefail
          mkdir -p /tmp/t && cd /tmp/t
          cat > main.swift <<'EOF'
          import Foundation
          let d = ["ok": true]
          let j = try! JSONSerialization.data(withJSONObject: d)
          print(String(data: j, encoding: .utf8)!)
          print(String(format: "%.2f", 1.239))
          EOF
          "$OUT/bin/swiftc" main.swift -o app 2>&1 | tee /tmp/link.log || {
            echo "::error::swiftc failed; undefined references:"
            grep -c 'undefined reference' /tmp/link.log || true
            exit 1
          }
          got=$(./app)
          echo "program printed:"
          echo "$got"
          printf '%s' "$got" | grep -q '{"ok":true}' || { echo "::error::wrong JSON output"; exit 1; }
          printf '%s' "$got" | grep -q '1.24' || { echo "::error::Foundation formatting failed"; exit 1; }
          echo "linked and ran"

      - name: swift build works too
        run: |
          set -euo pipefail
          mkdir -p /tmp/p && cd /tmp/p
          cat > Package.swift <<'EOF'
          // swift-tools-version:5.9
          import PackageDescription
          let package = Package(
            name: "probe",
            targets: [.executableTarget(name: "probe", path: "Sources/probe")]
          )
          EOF
          mkdir -p Sources/probe
          cat > Sources/probe/main.swift <<'EOF'
          import Foundation
          print("swift build ok:", (["a": 1, "b": 2] as NSDictionary).count)
          EOF
          "$OUT/bin/swift" build 2>&1 | tail -10
          ./.build/debug/probe | tee /tmp/run.log
          grep -q 'swift build ok: 2' /tmp/run.log

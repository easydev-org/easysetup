name: pip-report

# What actually happens when someone runs `pip install` against a pip that came
# from a nix closure? The complaint heard in practice is PEP 668's
# "externally-managed-environment", and the usual advice is "use a venv". This
# measures the real behaviour of OUR published pip so the answer is not folklore.
#
# Four things are checked, because they fail differently:
#   1. plain `pip install` - what error, word for word
#   2. does our python ship the EXTERNALLY-MANAGED marker, or is the failure just
#      a read-only filesystem? (these look similar and have different fixes)
#   3. `python -m venv` - does it work, and does pip work inside it
#   4. `pip install --user` - the other commonly suggested escape hatch
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    steps:
      - uses: actions/checkout@v4

      - name: install python and pip through easysetup
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends curl zstd python3 ca-certificates
          bash install.sh python pip
          bash tools/gen-env.sh /tmp/env.sh
          . /tmp/env.sh
          echo "python: $(command -v python3) $(python3 --version)"
          echo "pip:    $(command -v pip) $(pip --version)"

      - name: 1. plain pip install
        run: |
          set -uo pipefail
          . /tmp/env.sh
          # Written to files: a failure inside a pipe under pipefail would abort
          # the step and hide the message this whole job exists to capture.
          pip install requests > /tmp/plain.out 2>&1; echo "exit=$?" >> /tmp/plain.out
          echo "########## pip install requests ##########"
          cat /tmp/plain.out

      - name: 2. is it PEP 668 or a read-only filesystem?
        run: |
          set -uo pipefail
          . /tmp/env.sh
          echo "########## site-packages location and permissions ##########"
          python3 -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])'
          sp=$(python3 -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')
          ls -ld "$sp"
          echo
          echo "########## is there an EXTERNALLY-MANAGED marker? ##########"
          # PEP 668 is triggered by this file. Its presence means "this
          # interpreter is managed by the system, do not pip-install into it";
          # its absence means the failure is a plain permission problem.
          found=0
          for d in $(python3 -c 'import sys; print(" ".join(sys.path))'); do
            if [ -f "$d/EXTERNALLY-MANAGED" ]; then
              echo "  FOUND $d/EXTERNALLY-MANAGED"
              head -8 "$d/EXTERNALLY-MANAGED"
              found=1
            fi
          done
          [ "$found" = 1 ] || echo "  no EXTERNALLY-MANAGED marker anywhere"
          echo
          echo "########## what does pip itself report? ##########"
          pip debug --verbose > /tmp/dbg 2>&1; echo "exit=$?"
          grep -iE 'externally|managed' /tmp/dbg || echo "  pip debug says nothing about externally-managed"

      - name: 3. venv
        run: |
          set -uo pipefail
          . /tmp/env.sh
          echo "########## python -m venv ##########"
          python3 -m venv /tmp/v > /tmp/venv.out 2>&1; echo "venv exit=$?" >> /tmp/venv.out
          cat /tmp/venv.out
          if [ -x /tmp/v/bin/pip ]; then
            echo "########## pip inside the venv ##########"
            /tmp/v/bin/pip install --quiet requests > /tmp/vpip.out 2>&1
            echo "install exit=$?"
            tail -5 /tmp/vpip.out
            /tmp/v/bin/python -c 'import requests; print("requests", requests.__version__)'
          else
            echo "no pip in the venv"
          fi

      - name: 4. pip install --user
        run: |
          set -uo pipefail
          . /tmp/env.sh
          export HOME=/tmp/home && mkdir -p "$HOME"
          echo "########## pip install --user requests ##########"
          pip install --user requests > /tmp/user.out 2>&1; echo "exit=$?" >> /tmp/user.out
          cat /tmp/user.out
          echo
          python3 -c 'import requests; print("import ok", requests.__version__)' 2>&1 | head -3

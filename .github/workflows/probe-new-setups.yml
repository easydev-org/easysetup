name: probe-new-setups

# Does nixpkgs have pecl, and under what attribute?

# pecl ships with PHP (it is a script beside pear), so it is probably not a
# top-level attribute - but guessing produces a setup that fails at build time with
# "attribute not found", which is exactly the class of failure the earlier
# channel-versus-flake mistake caused.

# This asks at the pinned revision and prints what exists, so the manifest entry is
# written from evidence.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: which of these attributes exist at the pinned revision
        run: |
          set -uo pipefail
          set +e
          check() {
            local attr="$1"
            printf '%-34s ' "$attr"
            v=$(nix eval --raw --impure --expr "
              let f = builtins.getFlake (toString ./.);
                  p = f.inputs.nixpkgs.legacyPackages.x86_64-linux;
              in (p.${attr}).version" 2>/dev/null)
            if [ -n "$v" ]; then echo "version $v"
            else echo "ABSENT"; fi
          }
          for a in pecl pear php85Packages.pecl php85Packages.pear \
                   php.pecl skopeo; do
            check "$a"
          done

      - name: what does php85 ship in bin
        run: |
          set -uo pipefail
          set +e
          p=$(nix build --no-link --print-out-paths --system x86_64-linux \
                --option max-jobs 0 '.#"php-8.5.11"' 2>/dev/null | tail -1)
          echo "php out: $p"
          ls "$p/bin" 2>/dev/null
          echo "--- pecl anywhere in the closure? ---"
          nix path-info -r "$p" 2>/dev/null | xargs -r -n1 sh -c \
            'ls "$0"/bin 2>/dev/null | grep -q "^pecl$" && echo "found in $0"' | head -3

name: probe-new

# Confirm the attribute names for the packages to add, and their versions.
#
# The php/python package sets are nested (php85Packages.composer,
# python315Packages.pip), and a wrong attribute name costs a CI round to discover.
# Asking `.name` through the flake resolves the LOCKED nixpkgs, so a hit here is
# exactly what the build would use.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: probe attributes
        run: |
          set -uo pipefail
          probe() {
            local attr="$1" v
            v=$(nix eval --raw "nixpkgs#\"$attr\".version" 2>/dev/null) || v=""
            if [ -n "$v" ]; then
              printf '  %-34s %s\n' "$attr" "$v"
            else
              printf '  %-34s %s\n' "$attr" "MISSING"
            fi
          }

          echo "== python package set =="
          probe python315Packages.pip
          probe python315Packages.virtualenv
          probe python315Packages.poetry
          probe python315Packages.black
          probe python315Packages.ruff
          probe python315Packages.mypy
          probe python315Packages.pytest

          echo
          echo "== php package set =="
          probe php85Packages.composer
          probe php85Packages.phpcs
          probe php85Packages.php-cs-fixer
          probe php85Packages.phpstan
          probe php85Packages.psalm
          probe php85Packages.phpmd
          probe php85Packages.phpunit
          probe php85Packages.phing
          probe php85Packages.box
          probe php85Packages.deployer

          echo
          echo "== jenkins =="
          probe jenkins

          echo
          echo "== common CI tools =="
          probe kubectl
          probe terraform
          probe shellcheck
          probe ripgrep
          probe fd
          probe jq

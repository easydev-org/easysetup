name: probe-julia-arm64

# Is julia really unavailable for arm64, or only uncached?

# The arm64 probe reported cache=404 for julia-1.13.2, which means nixpkgs has a
# derivation but cache.nixos.org has never built it - an emulated compile of a
# runtime this size is not something a release should do silently. This confirms
# which of the two it is, so the manifest comment is accurate.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-platforms = aarch64-linux

      - name: julia's arm64 output and cache status
        run: |
          set -uo pipefail
          set +e
          echo "== does it evaluate =="
          o=$(nix eval --raw --impure --expr '
            let
              f = builtins.getFlake (toString ./.);
              pkgs = f.inputs.nixpkgs.legacyPackages.aarch64-linux;
            in (import (./setups + "/julia-1.13.2.nix") { inherit pkgs; }).outPath' 2>&1)
          echo "outPath: $o" | head -3
          echo
          echo "== is that path in the cache =="
          if [ -d "$o" ] || [ "${o:0:9}" = "/nix/store" ]; then
            h=$(basename "$o" | cut -d- -f1)
            echo "narinfo: $(curl -s -o /dev/null -w '%{http_code}' https://cache.nixos.org/$h.narinfo)"
            echo "size hint: $(curl -s https://cache.nixos.org/$h.narinfo | grep -E 'NarSize|FileSize' | head -2)"
          fi
          echo
          echo "== meta says =="
          nix eval --impure --expr '
            let f = builtins.getFlake (toString ./.); in {
              platforms = f.inputs.nixpkgs.legacyPackages.aarch64-linux.julia.meta.platforms;
              broken = f.inputs.nixpkgs.legacyPackages.aarch64-linux.julia.meta.broken or false;
            }' 2>&1 | tail -4

name: refresh

# Point out setups whose pin is behind upstream, and open a pull request that
# bumps them.
#
# It never writes to main. A toolchain bump changes the runtime every consuming
# CI pipeline gets, so it has to be reviewed like any other change; pin-by-hand
# stays the rule and this job only removes the manual "is there a newer one?"
# check.
#
# All the version logic lives in tools/bump.py so it can be run locally
# (`python3 tools/bump.py --check`) and tested without a runner.

on:
  schedule:
    - cron: "0 6 * * 1"      # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Each setup id tracks its OWN release line (node-22 -> newest 22.x,
      # python-312 -> newest 3.12.x, ...), so several ids for one tool do not
      # fight each other.
      - name: look for newer upstream versions
        id: check
        run: |
          set -euo pipefail
          if python3 tools/bump.py --check; then
            echo "stale=0" >> "$GITHUB_OUTPUT"
          else
            rc=$?
            # 1 = stale pins found; anything else is a real failure.
            [ "$rc" -eq 1 ] || exit "$rc"
            echo "stale=1" >> "$GITHUB_OUTPUT"
          fi

      - name: rewrite the stale pins
        if: steps.check.outputs.stale == '1'
        run: |
          set -euo pipefail
          python3 tools/bump.py --apply
          # A bump rewrites version + artifact and clears sha256, so the diff
          # must be exactly those three lines per bumped setup.
          git diff -- matrix.yml

      - name: open a pull request with the bumped pins
        if: steps.check.outputs.stale == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="refresh/toolchains-${{ github.run_id }}"
          git config user.name  "easysetup-bot"
          git config user.email "easysetup-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add matrix.yml
          git commit -m "chore(matrix): refresh pinned toolchain versions"
          git push -u origin "$BRANCH"

          # The body is generated from the actual diff, so the reviewer sees the
          # old -> new versions rather than a generic message.
          {
            echo "Automated check found newer upstream releases than the pins in \`matrix.yml\`."
            echo
            echo "| setup | from | to |"
            echo "|---|---|---|"
            git diff HEAD~1 -- matrix.yml | grep -E '^[-+]    version:' || true
            echo
            echo "Each bump also rewrites the artifact name and **clears the sha256**."
            echo "Merging this starts a release run that rebuilds the assets and re-pins the"
            echo "checksums, so \`install.sh\` keeps refusing anything it cannot verify."
            echo
            echo "**Review before merging**: a bump changes the toolchain every consuming"
            echo "CI pipeline gets."
          } > /tmp/body.md
          cat /tmp/body.md
          gh pr create \
            --title "chore(matrix): refresh pinned toolchain versions" \
            --body-file /tmp/body.md

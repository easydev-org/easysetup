name: refresh

# Check whether any PINNED version in matrix.yml is behind upstream, and open a
# pull request if so.
#
# It never writes to main: a toolchain bump has to be reviewed like any other
# change, because it can break a consuming CI pipeline. Pin-by-hand is the rule;
# this job only points out when a pin is stale.

on:
  schedule:
    - cron: "0 6 * * 1"      # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: look for newer upstream versions
        id: check
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, yaml, sys

          def latest(url, pick):
              try:
                  with urllib.request.urlopen(url, timeout=30) as r:
                      return pick(json.load(r))
              except Exception as e:
                  print(f"warn: {url}: {e}", file=sys.stderr)
                  return None

          doc = yaml.safe_load(open("matrix.yml"))
          pinned = {}
          for img in doc["images"]:
              for k, v in (img.get("tools") or {}).items():
                  pinned.setdefault(k, v)

          newer = {}
          # node: the dist index is the authority.
          n = latest("https://nodejs.org/dist/index.json", lambda d: d[0]["version"].lstrip("v"))
          if n and "node" in pinned and n != pinned["node"]:
              newer["node"] = n
          # go: the download feed lists stable releases first.
          g = latest("https://go.dev/dl/?mode=json", lambda d: d[0]["version"].removeprefix("go"))
          if g and "go" in pinned and g != pinned["go"]:
              newer["go"] = g
          # java: Adoptium's feature-release feed.
          j = latest("https://api.adoptium.net/v3/info/available_releases", lambda d: str(d["most_recent_feature_release"]))
          if j and "java" in pinned and not pinned["java"].startswith(j + "."):
              newer["java"] = j

          print("pinned:", pinned)
          print("newer :", newer)
          with open("/tmp/newer.json", "w") as f:
              json.dump(newer, f)
          PY
          if [ -s /tmp/newer.json ] && [ "$(cat /tmp/newer.json)" != "{}" ]; then
            echo "stale=1" >> "$GITHUB_OUTPUT"
          else
            echo "stale=0" >> "$GITHUB_OUTPUT"
          fi

      - name: open a pull request with the bumped pins
        if: steps.check.outputs.stale == '1'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          newer = json.load(open("/tmp/newer.json"))
          text = open("matrix.yml").read()
          for tool, ver in newer.items():
              # Rewrite only the pinned value for that tool.
              text = re.sub(rf'(\n\s+{tool}:\s*")[^"]*(")', rf'\g<1>{ver}\g<2>', text)
          open("matrix.yml", "w").write(text)
          print("bumped:", newer)
          PY
          git config user.name  "easysetup-bot"
          git config user.email "easysetup-bot@users.noreply.github.com"
          git checkout -b "refresh/toolchains-${{ github.run_id }}"
          git add matrix.yml
          git commit -m "chore(matrix): refresh pinned toolchain versions"
          git push -u origin "refresh/toolchains-${{ github.run_id }}"
          gh pr create \
            --title "chore(matrix): refresh pinned toolchain versions" \
            --body "Automated check found newer upstream releases than the pins in matrix.yml. Review before merging: a bump changes the toolchain every consuming CI pipeline gets."

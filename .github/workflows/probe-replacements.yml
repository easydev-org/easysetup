name: probe-replacements

# One job per tool.
#
# The single-job version stalled: `pip --version` pulled python's whole closure
# and the step never finished, so micromamba's result was never printed either.
# Separate jobs keep one slow probe from hiding the others, and each has its own
# timeout.
#
# The questions:
#   micromamba  is it a working conda-compatible CLI? (replaces `conda`, which
#               ships a bwrap sandbox that cannot start in an Actions container)
#   pixi        same question for the newer project-based tool
#   pip         does the pip setup we publish actually run?
#   cargo       our rust setup is nixpkgs#rustc - does it include cargo?
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  micromamba:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: micromamba
        run: |
          set -uo pipefail
          out=$(nix build --no-link --print-out-paths 'nixpkgs#micromamba' 2>/dev/null | tail -1) || out=""
          echo "output: ${out:-<cannot resolve>}"
          [ -n "$out" ] || exit 0
          echo "== bin/ =="; ls "$out/bin"
          echo "== --version =="
          timeout 90 "$out/bin/micromamba" --version > /tmp/m1 2>&1; echo "exit=$?"; cat /tmp/m1
          echo "== dry-run create python=3.12 =="
          timeout 240 "$out/bin/micromamba" create -n t python=3.12 --dry-run > /tmp/m2 2>&1
          echo "exit=$?"; tail -15 /tmp/m2

  pixi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: pixi
        run: |
          set -uo pipefail
          out=$(nix build --no-link --print-out-paths 'nixpkgs#pixi' 2>/dev/null | tail -1) || out=""
          echo "output: ${out:-<cannot resolve>}"
          [ -n "$out" ] || exit 0
          echo "== bin/ =="; ls "$out/bin"
          echo "== --version =="
          timeout 90 "$out/bin/pixi" --version > /tmp/p1 2>&1; echo "exit=$?"; cat /tmp/p1
          echo "== install a temp project =="
          tmp=$(mktemp -d); cd "$tmp"
          printf '[project]\nname = "t"\nchannels = ["conda-forge"]\nplatforms = ["linux-64"]\n\n[dependencies]\npython = "3.12.*"\n' > pixi.toml
          timeout 300 "$out/bin/pixi" install > /tmp/p2 2>&1; echo "exit=$?"; tail -15 /tmp/p2

  pip:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: pip
        run: |
          set -uo pipefail
          # Give it time: pip's closure contains a whole python.
          out=$(nix build --no-link --print-out-paths '.#"pip-26.1.2"' 2>/dev/null | tail -1) || out=""
          echo "output: ${out:-<cannot resolve>}"
          [ -n "$out" ] || exit 0
          echo "== bin/ =="; ls "$out/bin"
          echo "== pip --version =="
          timeout 240 "$out/bin/pip" --version > /tmp/i1 2>&1; echo "exit=$?"; cat /tmp/i1

  cargo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: cargo and rust
        run: |
          set -uo pipefail
          echo "== which attribute carries cargo? =="
          for a in cargo rustc rust; do
            printf '  %-8s ' "$a"
            nix eval --raw "nixpkgs#$a.name" 2>/dev/null || echo "-"
          done
          echo
          for a in cargo rustc; do
            o=$(nix build --no-link --print-out-paths "nixpkgs#$a" 2>/dev/null | tail -1) || o=""
            [ -n "$o" ] || { echo "$a: <cannot resolve>"; continue; }
            echo "== $a =="
            echo "  output: $o"
            echo "  bin/: $(ls "$o/bin" 2>/dev/null | tr '\n' ' ')"
            if [ -x "$o/bin/cargo" ]; then
              timeout 90 "$o/bin/cargo" --version > /tmp/k 2>&1; echo "  cargo exit=$?"; sed 's/^/    /' /tmp/k
            fi
          done

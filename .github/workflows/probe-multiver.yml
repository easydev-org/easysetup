name: probe-multiver

# Which versions of python, node and go can be published side by side?

# The manifest names each setup `<tool>-<version>`, so two versions of one tool
# only collide if their VERSION strings are equal. That is exactly what happens
# with a package set: python313Packages.ruff and python314Packages.ruff are both
# 0.17.1, so both would be called `ruff-0.17.1`. Whatever the probe finds here
# decides how the manifest has to be shaped, so it is measured first.
#
# Also asked, because it has bitten twice: is each candidate's PACKAGE SET cached
# per interpreter? python312Packages.ruff answered 404 while 313 and 314 were
# 200, so "the interpreter is cached" does not imply "its tools are".
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: probe
        run: |
          set -uo pipefail
          set +e
          printf '%-40s %-16s %-6s %s\n' ATTR VERSION CACHE NOTE
          printf '%-40s %-16s %-6s %s\n' '----------------------------------------' '----------------' '-----' '----'
          probe() {
            local attr="$1" n v outs chosen h code nb
            n=$(nix eval --raw "nixpkgs#$attr.name" 2>/dev/null) || n=""
            [ -n "$n" ] || { printf '%-40s %-16s %-6s %s\n' "$attr" "-" "-" "MISSING"; return; }
            v=$(nix eval --raw "nixpkgs#$attr.version" 2>/dev/null) || v="?"
            outs=$(nix build --no-link --print-out-paths "nixpkgs#$attr" 2>/dev/null) || outs=""
            [ -n "$outs" ] || { printf '%-40s %-16s %-6s %s\n' "$attr" "$v" "?" "BUILD FAILED"; return; }
            chosen=""; nb=0
            for p in $outs; do
              if [ -d "$p/bin" ] || [ -d "$p/sbin" ]; then chosen="$p"; break; fi
            done
            [ -n "$chosen" ] || chosen=$(printf '%s\n' "$outs" | head -1)
            for sub in bin sbin; do
              [ -d "$chosen/$sub" ] && nb=$((nb + $(ls "$chosen/$sub" 2>/dev/null | wc -l)))
            done
            h=$(basename "$chosen" | cut -d- -f1)
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://cache.nixos.org/$h.narinfo")
            printf '%-40s %-16s %-6s %s\n' "$attr" "$v" "$code" "$nb bins"
          }

          echo "===== python interpreters ====="
          probe python313
          probe python314
          echo
          echo "===== python package sets, 313 vs 314 ====="
          for p in pip virtualenv ruff mypy pytest pylint coverage ipython; do
            probe python313Packages.$p
            probe python314Packages.$p
          done
          echo
          echo "===== node ====="
          probe nodejs_24
          probe nodejs_26
          echo
          echo "===== go: what versions exist? ====="
          probe go
          for v in 23 24 25 26 27; do probe go_1_$v; done
          probe go_24; probe go_27

      - name: go attribute names, less guessing
        run: |
          set -uo pipefail
          set +e
          echo "== every top-level attr matching ^go(_[0-9]+)?$ =="
          nix eval --json 'nixpkgs#""' --apply 'x: builtins.filter (n: builtins.match "go(_[0-9]+)?" n != null) (builtins.attrNames x)' 2>/dev/null \
            || nix eval --json --expr '
                 let pkgs = import <nixpkgs> {};
                 in builtins.filter (n: builtins.match "go(_[0-9]+)?" n != null) (builtins.attrNames pkgs)' 2>/dev/null \
            || echo "(could not enumerate)"

name: download-test

# Large assets, with and without a token.

# The original symptom was java (565 MB) and maven (440 MB) failing while base
# (18 MB) and node (69 MB) succeeded, which pointed at the anonymous rate limit
# rather than at the releases. This installs the two large ones specifically, and
# then repeats without a token to see whether the retry logic rides out a limit.

# Rewritten when install.sh was replaced by the static binary: every step here used
# to call the shell script, so the workflow had been dead since.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  large-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: fetch the binary
        run: |
          set -euo pipefail
          tag=$(curl -fsSI https://github.com/easydev-org/easysetup-cli/releases/latest \
            | awk 'tolower($1)=="location:" {n=split($2,a,"/"); print a[n]; exit}' | tr -d '\r')
          curl -fsSL -o /tmp/easysetup \
            "https://github.com/easydev-org/easysetup-cli/releases/download/$tag/easysetup-linux-amd64"
          chmod 755 /tmp/easysetup

      - name: java and maven, with a token
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo /tmp/easysetup prepare
          time /tmp/easysetup install java maven
          /tmp/easysetup env /tmp/env.sh > /dev/null
          . /tmp/env.sh
          java -version 2>&1 | head -1
          mvn --version 2>&1 | head -1

      - name: and without one, so the retry path is exercised
        run: |
          set -uo pipefail
          sudo rm -rf /nix
          sudo /tmp/easysetup prepare
          # No token: the anonymous quota is 60/hour per IP, and this runner may or
          # may not already have spent it. Either way the install should complete -
          # the retry flags are what cover the case where it is spent.
          out=$(sudo GITHUB_TOKEN= /tmp/easysetup install node 2>&1 || true)
          echo "$out" | tail -5
          echo "$out" | grep -qi 'installed:' \
            && echo "anonymous install worked" \
            || { echo "::warning::anonymous install did not complete - check whether it was rate limited"; exit 1; }

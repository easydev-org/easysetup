name: probe-android

# Can the Android SDK be its own setup, with flutter depending on it?

# flutter's tarball is 1811 MB, by far the largest here, and most of that is not
# flutter - it is the Android SDK it bundles. If the SDK were a separate setup,
# then a project using Android + Kotlin, or Android + React Native, could share
# it, and flutter's own tarball would shrink.
#
# Three things have to be true, and each can fail:
#   1. nixpkgs exposes the SDK as its own attribute
#   2. it is buildable here (it is unfree and needs licence acceptance)
#   3. the pieces are separable - a wrapper that hard-codes the SDK path cannot
#      be split, which is the same trap as splitting a nix closure anywhere else
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: does an android sdk attribute exist?
        run: |
          set -uo pipefail
          set +e
          printf '%-40s %-12s %s\n' ATTR NAME NOTE
          probe() {
            local attr="$1" n
            n=$(nix eval --raw "nixpkgs#$attr.name" 2>/dev/null) || n=""
            if [ -n "$n" ]; then printf '%-40s %s\n' "$attr" "$n"
            else printf '%-40s %-12s %s\n' "$attr" "-" "not resolvable"; fi
          }
          probe androidenv.androidPkgs.androidsdk
          probe androidenv.androidPkgs.platform-tools
          probe android-sdk
          probe android-studio
          probe android-tools
          probe apksigner
          probe bundletool
          probe gradle

      - name: what is actually inside flutter, and how big is each piece?
        run: |
          set -uo pipefail
          set +e
          out=$(nix build --no-link --print-out-paths '.#"flutter-3.47.4"' 2>/dev/null | head -1) || out=""
          echo "flutter output: ${out:-<unresolved>}"
          [ -n "$out" ] || exit 0
          echo
          echo "== total size =="
          du -sh "$out" 2>/dev/null
          echo
          echo "== does it contain an android sdk? =="
          find "$out" -maxdepth 3 -iname '*android*' -type d 2>/dev/null | head -5
          echo
          echo "== the 10 largest subtrees, which is where 1.8 GB lives =="
          du -sh "$out"/* 2>/dev/null | sort -hr | head -10
          echo
          echo "== closure size, and the largest members =="
          nix path-info -rSh "$out" 2>/dev/null | sort -k2 -hr | head -12

      - name: how much of flutter's closure is shared with a plain android sdk?
        run: |
          set -uo pipefail
          set +e
          # If the SDK attribute resolves, compare closures. The interesting number
          # is how many paths flutter could drop if the SDK came from elsewhere.
          nix build --no-link '.#"flutter-3.47.4"' >/dev/null 2>&1
          nix path-info -r '.#"flutter-3.47.4"' 2>/dev/null | sort > /tmp/flutter.txt
          echo "flutter closure: $(wc -l < /tmp/flutter.txt) paths"

          for attr in androidenv.androidPkgs.androidsdk android-tools; do
            o=$(nix build --no-link --print-out-paths "nixpkgs#$attr" 2>/dev/null | head -1) || o=""
            if [ -z "$o" ]; then echo "  $attr: not buildable here"; continue; fi
            nix path-info -r "$o" 2>/dev/null | sort > /tmp/sdk.txt
            common=$(comm -12 /tmp/flutter.txt /tmp/sdk.txt | wc -l)
            echo "  $attr: $(wc -l < /tmp/sdk.txt) paths, $common shared with flutter"
          done

      - name: is the SDK even allowed to build here?
        run: |
          set -uo pipefail
          set +e
          echo "== trying androidenv.androidPkgs.androidsdk (unfree + licence) =="
          nix build --no-link 'nixpkgs#androidenv.androidPkgs.androidsdk' > /tmp/a.log 2>&1
          echo "exit=$?"
          tail -15 /tmp/a.log

name: probe-bootstrap

# Does the Containerfile produce a scratch image whose shell came from easysetup?

# The claim being tested: bash, busybox and curl are installed BY EASYSETUP into
# a scratch image. Stage 1 is only a launchpad - it exists because something has
# to download the easysetup binary, and a scratch image has nothing to download
# with. It is not part of the result: stage 2 copies /nix and nothing else, so
# no part of alpine's userland reaches the final image.

# That works because every path in the closures is absolute and self-contained:
# /nix/store/<hash>-glibc/lib/ld-linux-x86-64.so.2 is the interpreter for every
# binary, and copying /nix to the same absolute path keeps it valid.

# alpine for stage 1, not busybox: the official busybox image's wget reports
# "TLS certificate validation not implemented" - it fetches but verifies nothing,
# and GitHub serves releases only over HTTPS. That was measured, and it is the
# one thing about this design that depends on the launcher image.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:

  build-scratch-with-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build the image
        run: |
          set -euo pipefail
          docker build -f Containerfile -t easysetup-shell:test .

      - name: inspect it
        run: |
          set -euo pipefail
          docker images easysetup-shell:test --format 'size: {{.Size}}'
          echo "== layers =="
          docker history easysetup-shell:test --no-trunc --format '{{.Size}}\t{{.CreatedBy}}' | head -8

      - name: it has a working shell and busybox, from scratch
        run: |
          set -euo pipefail
          echo "== /bin/sh does not exist (this is not a distro) =="
          docker run --rm --entrypoint /bin/sh easysetup-shell:test -c 'echo hi' 2>&1 | head -2 || echo "  (no /bin/sh - expected)"
          echo
          echo "== but bash from /nix/store does =="
          docker run --rm easysetup-shell:test -c 'echo "bash says: $BASH_VERSION"'
          echo
          echo "== and busybox, and curl =="
          docker run --rm easysetup-shell:test -c 'busybox | head -1'
          docker run --rm easysetup-shell:test -c 'curl --version | head -1'
          echo
          echo "== no distro files at all =="
          docker run --rm --entrypoint /bin/sh easysetup-shell:test -c 'ls /' 2>/dev/null || \
            docker run --rm easysetup-shell:test -c 'echo "top level:"; ls -1 /'

      - name: it can still reach the network
        run: |
          set -euo pipefail
          docker run --rm easysetup-shell:test -c 'curl -fsS -o /dev/null -w "curl https: %{http_code}\n" https://api.github.com'

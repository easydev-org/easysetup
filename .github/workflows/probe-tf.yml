name: probe-tf

# Two questions:
#   1. is terraform in nixpkgs, under some other attribute name?
#   2. why do the six python-package setups fail to build?
#
# terraform is BUSL-licensed since 1.6, so nixpkgs may gate it behind
# allowUnfree - our flake already sets allowUnfree, but the attribute may also
# have been renamed to opentofu or moved into a package set.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: terraform candidates
        run: |
          set -uo pipefail
          for a in terraform opentofu terraform-full terraform_1 tofu; do
            printf '  %-16s ' "$a"
            nix eval --raw "nixpkgs#$a.name" 2>/dev/null || echo "-"
          done
          echo
          echo "== the exact error for plain terraform =="
          nix eval --raw 'nixpkgs#terraform.name' > /tmp/tf 2>&1
          echo "exit=$?"; cat /tmp/tf

  pybuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: can pip actually be built?
        run: |
          set -uo pipefail
          out=$(nix eval --raw 'nixpkgs#python315Packages.pip.outPath' 2>/dev/null) || out=""
          echo "outPath: ${out:-<cannot resolve>}"
          echo
          echo "== building it, full error =="
          nix build --no-link 'nixpkgs#python315Packages.pip' > /tmp/b 2>&1
          echo "exit=$?"
          tail -25 /tmp/b

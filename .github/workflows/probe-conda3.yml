name: probe-conda3

# One step, no pipes that can truncate, so nothing can silently skip the run.
#
# The previous two attempts both died before executing conda-shell: a `| head`
# under `pipefail` kills the step when head exits early. The output here is
# written to files and printed afterwards.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: run conda-shell, capture everything to files
        run: |
          set -uo pipefail
          out=$(nix build --no-link --print-out-paths 'nixpkgs#conda' | tail -1)
          sh="$out/bin/conda-shell"
          echo "wrapper: $sh"

          # Each probe writes to a file; nothing is piped, so a non-zero exit from
          # the program cannot abort the step and hide later results.
          timeout 120 "$sh" --version        > /tmp/a.out 2>&1; echo "exit=$?" >> /tmp/a.out
          timeout 120 "$sh" conda --version  > /tmp/b.out 2>&1; echo "exit=$?" >> /tmp/b.out
          timeout 120 "$sh" -c 'command -v conda; command -v conda-shell; echo PATH=$PATH' \
                                             > /tmp/c.out 2>&1; echo "exit=$?" >> /tmp/c.out
          timeout 120 "$sh" -c 'conda --version || echo NO_CONDA' \
                                             > /tmp/d.out 2>&1; echo "exit=$?" >> /tmp/d.out

          echo
          echo "########## conda-shell --version ##########"
          cat /tmp/a.out
          echo
          echo "########## conda-shell conda --version ##########"
          cat /tmp/b.out
          echo
          echo "########## inside: which conda + PATH ##########"
          cat /tmp/c.out
          echo
          echo "########## inside: conda --version ##########"
          cat /tmp/d.out

      - name: is conda in the fhs rootfs at all?
        run: |
          set -uo pipefail
          found=0
          for d in /nix/store/*-conda-shell-*-fhsenv-rootfs; do
            echo "rootfs: $d"
            n=$(ls "$d/bin" 2>/dev/null | wc -l)
            echo "  bin entries: $n"
            # The question is not "is anything there" but "is conda there".
            if ls "$d/bin" 2>/dev/null | grep -qx 'conda'; then
              echo "  *** conda FOUND in $d/bin"
              found=1
            else
              echo "  conda NOT in $d/bin"
            fi
            ls "$d/bin" 2>/dev/null | grep -i conda > /tmp/cf.txt || true
            echo "  conda-ish names: $(cat /tmp/cf.txt | tr '\n' ' ')"
          done
          echo
          echo "found=$found"

      - name: what does micromamba offer instead?
        run: |
          set -uo pipefail
          out=$(nix build --no-link --print-out-paths 'nixpkgs#micromamba' 2>/dev/null | tail -1) || out=""
          if [ -z "$out" ]; then echo "micromamba unavailable"; exit 0; fi
          echo "micromamba: $out"
          ls "$out/bin"
          timeout 60 "$out/bin/micromamba" --version > /tmp/mm.out 2>&1; echo "exit=$?" >> /tmp/mm.out
          cat /tmp/mm.out
          timeout 90 "$out/bin/micromamba" create -n t python=3.12 --dry-run > /tmp/mm2.out 2>&1
          echo "dry-run exit=$?"
          tail -5 /tmp/mm2.out

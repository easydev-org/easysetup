name: probe-gaps

# Which languages have a gap in their workflow, really?

# The first pass counted a language as "supported" if it had a runtime and one
# tool, which is too generous: Kotlin without a linter is not a working setup,
# and .NET without a formatter is half of one. This probes the specific tools
# each language's normal workflow expects, so the answer is a list of gaps rather
# than a list of names.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: probe
        run: |
          set -uo pipefail
          set +e
          printf '%-38s %-11s %-6s %s\n' ATTR VERSION CACHE BIN
          printf '%-38s %-11s %-6s %s\n' '--------------------------------------' '-----------' '-----' '-----'
          probe() {
            local attr="$1" name ver outs chosen h nb
            name=$(nix eval --raw "nixpkgs#$attr.name" 2>/dev/null) || name=""
            if [ -z "$name" ]; then
              printf '%-38s %-11s %-6s %s\n' "$attr" "-" "-" "MISSING"; return
            fi
            ver=$(nix eval --raw "nixpkgs#$attr.version" 2>/dev/null) || ver="?"
            outs=$(nix build --no-link --print-out-paths "nixpkgs#$attr" 2>/dev/null) || outs=""
            if [ -z "$outs" ]; then
              printf '%-38s %-11s %-6s %s\n' "$attr" "${ver:0:10}" "?" "BUILD FAILED"; return
            fi
            chosen=""; nb=0
            for p in $outs; do
              if [ -d "$p/bin" ] || [ -d "$p/sbin" ]; then chosen="$p"; break; fi
            done
            [ -n "$chosen" ] || chosen=$(printf '%s\n' "$outs" | head -1)
            for sub in bin sbin; do
              [ -d "$chosen/$sub" ] && nb=$((nb + $(ls "$chosen/$sub" | wc -l)))
            done
            h=$(basename "$chosen" | cut -d- -f1)
            printf '%-38s %-11s %-6s %s\n' "$attr" "${ver:0:10}" \
              "$(curl -s -o /dev/null -w '%{http_code}' "https://cache.nixos.org/$h.narinfo")" "$nb"
          }

          echo "===== Kotlin ====="
          probe ktlint; probe detekt; probe kotlin-language-server
          echo "===== Scala ====="
          probe scalafmt; probe metals; probe scala-cli
          echo "===== Swift ====="
          probe swiftlint; probe swiftformat; probe sourcekit-lsp
          echo "===== Dart / Flutter ====="
          probe flutter
          echo "===== .NET ====="
          probe dotnet-format; probe csharp-ls; probe omnisharp-roslyn
          echo "===== Java ====="
          probe spotbugs; probe errorprone
          echo "===== Haskell ====="
          probe ormolu; probe hlint; probe haskell-language-server
          echo "===== OCaml ====="
          probe ocamlformat; probe ocaml-lsp
          echo "===== Erlang / Elixir ====="
          probe erlfmt; probe elixir-ls; probe credo
          echo "===== Clojure ====="
          probe clj-kondo; probe clojure-lsp
          echo "===== Julia ====="
          probe julia-lsp 2>/dev/null; probe LanguageServer 2>/dev/null
          echo "===== R ====="
          probe rPackages.lintr; probe rPackages.styler; probe rPackages.languageserver
          echo "===== Nim ====="
          probe nimlsp; probe nimlangserver
          echo "===== Crystal ====="
          probe crystalline; probe ameba
          echo "===== Zig ====="
          probe zls
          echo "===== Deno/Node extras ====="
          probe nodePackages.typescript; probe ts-node; probe tsx
          echo "===== C/C++ more ====="
          probe llvmPackages_23.clang-analyzer 2>/dev/null; probe perf; probe strace; probe ltrace
          echo "===== general dev ====="
          probe tmux; probe vim; probe emacs-nox 2>/dev/null; probe nano
          probe jq; probe sqlite; probe docker-client

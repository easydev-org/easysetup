name: compute-closures

# Regenerate closures.json from the manifest and the nix closures.
#
# This is the step that makes delta packaging possible: it answers, for the whole
# manifest, which store paths each setup can leave out because a dependency or the
# shared base already provides them.
#
# It costs about a minute and downloads no package content - `nix eval .outPath`
# resolves paths from the derivations, and `path-info --store cache.nixos.org`
# walks closures from .narinfo metadata only.
#
# Run this after adding or removing a setup, then rebuild the affected ones.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'commit the result back to main'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  compute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org

      # One graph per architecture. The store paths differ, so a single file
      # cannot describe both, and computing arm64 needs no emulator: every path
      # in it is already in cache.nixos.org, so nix evaluates and downloads
      # rather than builds.
      - name: compute the dependency graph, per architecture
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            echo "===== $arch ====="
            ARCH="$arch" python3 tools/compute-deps.py
          done

      # Every manifest version must equal what nix reports, because build-nixpkg.sh
      # refuses to build when they disagree - a tarball named 1.140.0 while nix
      # built 1.140.06880 would mislabel a release. Two entries were wrong this
      # way (ccls, vscode-langservers), both truncated by a probe's fixed-width
      # version column. Checking here means the next one is caught before a full
      # 155-job build rather than during it.
      - name: versions in the manifest match nix
        run: |
          set -uo pipefail
          for arch in amd64 arm64; do
            echo "===== $arch ====="
            ARCH="$arch" python3 tools/check-versions.py || {
              echo "::error::the manifest disagrees with nix for $arch; run tools/check-versions.py --fix and regenerate setups/"
              exit 1
            }
          done || {
            echo "::error::the manifest disagrees with nix; run tools/check-versions.py --fix and regenerate setups/"
            exit 1
          }

      # A setup that cannot be resolved is SKIPPED, which is safe but silent - and
      # silence is how six python-package entries and terraform disappeared from
      # the graph without anyone noticing. This prints every failure and its
      # reason, so the omission is visible in the run.
      - name: list anything the graph could not include
        run: |
          set -uo pipefail
          for arch in amd64 arm64; do
            echo "===== $arch ====="
            ARCH="$arch" python3 tools/probe-closure-fails.py | tee /tmp/missing-$arch.txt
            echo
            n=$(grep -cE 'FAILED|CACHE MISS' /tmp/missing-$arch.txt || true)
            echo "setups missing from closures-$arch.json: $n"
            if [ "$n" -gt 0 ]; then
              echo "::warning::$arch: $n setup(s) were skipped - see the list above"
            fi
          done

      # The guarantee, checked as a fact.
      #
      # Everything above derives the graph; this proves the graph only contains
      # things cache.nixos.org has actually built. It is a gate, not a report: if
      # any path would have to be compiled, the run fails here rather than at a
      # build job that then quietly spends an hour compiling.
      #
      # The build jobs carry their own --option max-jobs 0, so this is the second
      # of two independent checks - one over the whole graph, one over each
      # individual build. Either alone would do; both means a mistake has to defeat
      # two different mechanisms.
      - name: every published path must already exist in the cache
        run: |
          set -euo pipefail
          python3 tools/assert-cached.py

      - name: show the result
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            echo "########## $arch ##########"
            ARCH="$arch" python3 tools/show-graph.py
          done

      - name: commit
        if: inputs.commit
        run: |
          set -euo pipefail
          git config user.name  "easysetup"
          git config user.email "easysetup@easydev.local"
          git add closures-amd64.json closures-arm64.json
          if git diff --cached --quiet; then
            echo "closure graphs unchanged"
            exit 0
          fi
          git commit -F - <<'MSG'
          chore: recompute closures.json

          Derived from the nix closures by tools/compute-deps.py: the shared base,
          each setup's derived dependencies, and the paths left to package after
          both are subtracted.
          MSG
          git push

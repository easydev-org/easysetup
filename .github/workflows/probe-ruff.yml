name: probe-ruff

# Is ruff a standalone Rust binary, or a per-interpreter Python package?

# This decides how many times we ship it. If `nixpkgs#ruff` exists as its own
# package, one setup serves every python version - and the whole problem of
# python313Packages.ruff vs python314Packages.ruff disappears. If it only exists
# inside a package set, each version needs its own copy.

# The probe output was also confusing: `python314Packages.ruff` printed a store
# PATH where the attribute name belongs, which means the attribute resolved to
# something already-built rather than to a plain attr. That needs explaining
# before anything is added.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: does a standalone ruff exist?
        run: |
          set -uo pipefail
          set +e
          for attr in ruff ruff-bin python3Packages.ruff python313Packages.ruff python314Packages.ruff; do
            printf '== %s\n' "$attr"
            n=$(nix eval --raw "nixpkgs#$attr.name" 2>/dev/null) || n=""
            if [ -z "$n" ]; then printf '   MISSING\n'; continue; fi
            v=$(nix eval --raw "nixpkgs#$attr.version" 2>/dev/null)
            printf '   name: %s   version: %s\n' "$n" "$v"
            o=$(nix build --no-link --print-out-paths "nixpkgs#$attr" 2>/dev/null | head -1) || o=""
            printf '   out:  %s\n' "$(basename "$o")"
            printf '   bin:  %s\n' "$(ls "$o/bin" 2>/dev/null | tr '\n' ' ')"
          done

      - name: are the two package-set ruffs the same binary or two builds?
        run: |
          set -uo pipefail
          set +e
          a=$(nix build --no-link --print-out-paths 'nixpkgs#python313Packages.ruff' 2>/dev/null | head -1)
          b=$(nix build --no-link --print-out-paths 'nixpkgs#python314Packages.ruff' 2>/dev/null | head -1)
          r=$(nix build --no-link --print-out-paths 'nixpkgs#ruff' 2>/dev/null | head -1)
          echo "313 ruff: $a"
          echo "314 ruff: $b"
          echo "standalone: ${r:-<none>}"
          echo
          [ -n "$a" ] && [ -n "$b" ] && {
            if [ "$a" = "$b" ]; then
              echo "SAME store path - the package set reuses one build"
            else
              echo "DIFFERENT store paths - two separate builds"
              echo "--- sizes ---"
              du -sh "$a" "$b" 2>/dev/null
              echo "--- the binary itself ---"
              file "$a/bin/ruff" 2>/dev/null
              echo "--- does it link a python? ---"
              ldd "$a/bin/ruff" 2>/dev/null | head -6
            fi
          }

      - name: what ruff actually is
        run: |
          set -uo pipefail
          set +e
          o=$(nix build --no-link --print-out-paths 'nixpkgs#python314Packages.ruff' 2>/dev/null | head -1)
          echo "== file type =="
          file "$o/bin/ruff" 2>/dev/null
          echo
          echo "== size =="
          ls -lh "$o/bin/ruff" 2>/dev/null | awk '{print $5}'
          echo
          echo "== shared libraries (a Rust binary links libc, not python) =="
          ldd "$o/bin/ruff" 2>/dev/null | head -8
          echo
          echo "== is a python interpreter inside its closure? =="
          nix path-info -r "$o" 2>/dev/null | grep -c python || echo 0

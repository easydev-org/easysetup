name: probe-cacert

# What attribute actually carries a CA bundle, and does it have a version?

# `nss-cacert` failed to build with "cannot evaluate cacert-3.126.version" - the
# attribute exists but expose no `version`, which the build script needs to label
# the asset. Anything shipped needs a version the manifest can pin.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: which attribute, and what does it expose
        run: |
          set -uo pipefail
          set +e
          for attr in nss-cacert cacert cacertPackage; do
            echo "===== $attr ====="
            n=$(nix eval --raw "nixpkgs#$attr.name" 2>&1) || { echo "  name: $n"; continue; }
            echo "  name:    $n"
            v=$(nix eval --raw "nixpkgs#$attr.version" 2>&1)
            echo "  version: $v"
            o=$(nix build --no-link --print-out-paths "nixpkgs#$attr" 2>/dev/null | head -1)
            echo "  out:     $(basename "$o" 2>/dev/null)"
            echo "  bundle:"
            find "$o" -name 'ca-bundle.crt' -o -name 'ca-certificates.crt' 2>/dev/null | head -3
            echo "  top level:"
            ls "$o" 2>/dev/null | head -5
            h=$(basename "$o" | cut -d- -f1); \
            echo "  cache:   $(curl -s -o /dev/null -w '%{http_code}' "https://cache.nixos.org/$h.narinfo")"
          done

      - name: is there a futures-proof way to name it
        run: |
          set -uo pipefail
          set +e
          echo "== lowercase attr names that look like certs =="
          nix eval --json --apply 'x: builtins.filter (n: builtins.match ".*cacert.*" n != null) (builtins.attrNames x)' \
            'nixpkgs#""' 2>/dev/null || echo "  (enumeration failed)"

      - uses: actions/upload-artifact@v4
        with:
          name: setup-${{ matrix.name }}-arm64
          path: out/*.tar.zst
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [setup, build, build-arm64]
    if: always() && needs.setup.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: setup-*
          path: /tmp/assets
          merge-multiple: true
        # A setup whose build failed has no artifact. Failing the whole publish
        # job would hide the setups that DID build, so tolerate an empty result
        # and report it instead.
        continue-on-error: true

      # One release for every setup, rather than one release per setup.

      # Why: 194 releases each holding two assets is a lot of clutter for one
      # concept, and every new setup added another. GitHub allows 1000 assets per
      # release and there is no cap on total size, so a single release holds all
      # of them - 194 tarballs plus one checksum file, well inside the limit.

      # The tag is FIXED, not dated. A dated tag would mean every release is a new
      # release, so `releases/latest/download/<asset>` could only ever find the
      # assets uploaded in the most recent run - and an unchanged setup would
      # vanish from `latest` the first time anything else changed. A fixed tag
      # keeps every asset reachable at one stable URL for ever, and makes the
      # incremental upload below meaningful: assets accumulate rather than being
      # replaced wholesale.

      # Uploads are incremental. Only the tarballs this run actually built are
      # sent; everything already in the release stays. That is what keeps a
      # one-setup change from re-uploading 33 GB.

      # The checksums go in ONE SHA256SUMS file rather than a .sha256 beside each
      # tarball. Halving the asset count doubles the headroom under the 1000
      # limit, and coreutils' standard format means `sha256sum -c SHA256SUMS`
      # works on the whole set.
      - name: publish every built asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # One release per architecture, not one release with both.
          #
          # A single release would put ~400 tarballs plus a checksum file against
          # GitHub's 1000-asset limit - comfortable today, half gone at 250
          # setups. Two releases give each architecture the full allowance, and
          # they are separate things: a consumer on arm64 never wants the amd64
          # assets and vice versa.
          publish_arch() {
            local arch="$1" tag="setups-$1"
            local assets=(/tmp/assets/*-"$arch".tar.zst)
            if [ "${#assets[@]}" -eq 0 ]; then
              echo "$arch: no assets were produced; nothing to publish"
              return 0
            fi
            echo "== $arch -> $tag (${#assets[@]} tarball(s))"

            gh release view "$tag" >/dev/null 2>&1 || \
              gh release create "$tag" \
                --title "prebuilt nix closures ($arch)" \
                --notes "Every easysetup setup that exists for linux/$arch, prebuilt. Assets are added incrementally: a setup that has not changed keeps its existing tarball. Checksums are in SHA256SUMS."

            # What is already published, so the new SHA256SUMS covers the whole set
            # rather than only this run's files. Without this the checksum file
            # would silently lose every setup that did not change.
            local existing carried fresh built_names merged
            existing=$(mktemp); carried=$(mktemp); fresh=$(mktemp)
            built_names=$(mktemp); merged=$(mktemp)
            gh release view "$tag" --json assets --jq '.assets[].name' \
              > "$existing" || true
            echo "already published: $(wc -l < "$existing")"

            if grep -qx 'SHA256SUMS' "$existing"; then
              gh release download "$tag" --pattern 'SHA256SUMS' \
                --output "$carried" --clobber || true
            fi

            # The digest is written by hand rather than by `sha256sum "$a"`, which
            # would record the path it was given - /tmp/assets/foo.tar.zst - and a
            # consumer looking an entry up by bare filename would find nothing.
            local a
            for a in "${assets[@]}"; do
              printf '%s  %s\n' "$(sha256sum "$a" | cut -d' ' -f1)" "$(basename "$a")" >> "$fresh"
            done

            for a in "${assets[@]}"; do basename "$a"; done > "$built_names"
            if [ -s "$carried" ]; then
              awk 'NR==FNR{new[$2]=1; next} !($2 in new)' "$built_names" "$carried" > "$merged"
            fi
            cat "$fresh" >> "$merged"
            sort -k2 "$merged" -o "$merged"
            echo "SHA256SUMS covers $(wc -l < "$merged") tarballs"

            # Uploaded under a per-architecture temp name, then renamed in the
            # release. gh takes the asset name from the file name, and both
            # releases want an asset called plain SHA256SUMS - so a staging
            # directory per architecture is what keeps the two loops from writing
            # over each other's file before it is uploaded.
            local stage="/tmp/sums-$arch"
            rm -rf "$stage" && mkdir -p "$stage"
            cp "$merged" "$stage/SHA256SUMS"
            gh release upload "$tag" "${assets[@]}" "$stage/SHA256SUMS" --clobber
          }

          for arch in amd64 arm64; do
            publish_arch "$arch"
          done

      # Record what was built, so the next run can tell what is genuinely
      # unchanged. Done only AFTER every upload succeeded: a fingerprint written
      # for a setup whose asset failed to upload would make the next run skip a
      # release that does not exist. build-plan.py also cross-checks GitHub as a
      # second guard.
      - name: record what was built
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(/tmp/assets/*.tar.zst)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "nothing was published; leaving the state file alone"
            exit 0
          fi
          # Recorded per architecture, because build-state is what decides whether
          # the next run rebuilds something. amd64 and arm64 tarballs of one setup
          # are different bytes and can be out of step - one published, the other
          # not - so a single entry would make the next run skip the missing one.
          for arch in amd64 arm64; do
            built=()
            for a in /tmp/assets/*-"$arch".tar.zst; do
              base=$(basename "$a")
              built+=("${base%-debian-trixie-$arch.tar.zst}")
            done
            [ "${#built[@]}" -gt 0 ] || continue
            ARCH="$arch" python3 tools/build-plan.py --record "${built[@]}"
          done

          if git diff --quiet build-state.json 2>/dev/null; then
            echo "state unchanged"
            exit 0
          fi
          # Committed so the next run starts from it. A rebase may be needed if
          # another workflow touched main meanwhile; retry a couple of times.
          git config user.name  "easysetup"
          git config user.email "easysetup@easydev.local"
          git add build-state.json
          git commit -q -m "chore: record ${#built[@]} published builds so the next run only rebuilds what changed"
          for i in 1 2 3; do
            if git push -q origin HEAD:main 2>/dev/null; then echo "pushed"; exit 0; fi
            git pull --rebase -q origin main || true
            sleep 5
          done
          echo "::warning::could not push build-state.json; the next run will rebuild more than necessary"

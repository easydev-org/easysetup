name: probe-cache

# Are the six python-package setups missing from cache.nixos.org because OUR pin
# is too new, or because nixpkgs never caches them at all?
#
# That distinction decides the fix:
#   * if a STABLE channel's python packages are cached, the answer is to pin to a
#     release channel instead of nixos-unstable's tip
#   * if they are missing there too, the python package sets are simply not in the
#     binary cache and must be built (or dropped from the manifest)
#
# It asks the cache directly for one known path from each pin.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: is our pin's pip in the cache?
        run: |
          set -uo pipefail
          echo "== our locked pin =="
          cat flake.lock | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['nodes']['nixpkgs']['locked']['rev'], d['nodes']['nixpkgs']['locked'].get('lastModified'))"
          echo
          p=$(nix eval --raw '.#"pip-26.1.2".outPath' 2>/dev/null) || p=""
          echo "pip outPath: ${p:-<unresolved>}"
          if [ -n "$p" ]; then
            h=$(basename "$p" | cut -d- -f1)
            echo "== narinfo for $h =="
            code=$(curl -s -o /tmp/ni -w '%{http_code}' "https://cache.nixos.org/$h.narinfo")
            echo "HTTP $code"
            head -6 /tmp/ni
          fi

      - name: does a STABLE channel cache its python packages?
        run: |
          set -uo pipefail
          # Ask a release channel for the same package. If this one IS cached, the
          # problem is our pin being ahead of what CI has built.
          for ch in nixos-25.11 nixos-25.05; do
            echo "===== $ch"
            p=$(nix eval --raw --impure --expr \
              "(builtins.getFlake \"github:NixOS/nixpkgs/$ch\").legacyPackages.x86_64-linux.python313Packages.pip.outPath" \
              2>/dev/null) || p=""
            echo "  pip outPath: ${p:-<unresolved>}"
            if [ -n "$p" ]; then
              h=$(basename "$p" | cut -d- -f1)
              code=$(curl -s -o /dev/null -w '%{http_code}' "https://cache.nixos.org/$h.narinfo")
              echo "  narinfo HTTP $code"
            fi
          done

      - name: how many of our 54 setups are cache misses?
        run: |
          set -uo pipefail
          python3 - <<'PY' > /tmp/list.txt
          import sys
          sys.path.insert(0, ".")
          import matrixlib2
          for e in matrixlib2.load("matrix-nix.yml"):
              print(e["dir"])
          PY
          ok=0; miss=0
          for d in $(cat /tmp/list.txt); do
            p=$(nix eval --raw ".#\"$d\".outPath" 2>/dev/null) || { echo "  UNRESOLVED $d"; continue; }
            h=$(basename "$p" | cut -d- -f1)
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://cache.nixos.org/$h.narinfo")
            if [ "$code" = "200" ]; then ok=$((ok+1)); else miss=$((miss+1)); echo "  MISS $d ($code)"; fi
          done
          echo
          echo "cached: $ok   missing: $miss"

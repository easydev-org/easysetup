name: closure-timing2

# The first attempt failed in 1 second, for a specific reason: `nix path-info
# --store <cache> -r <flake-ref>` cannot resolve a flake reference against the
# remote store - the flake has to be evaluated against the LOCAL store first.
#
# Two-step form instead:
#   nix eval ... .drvPath     -> which derivation (needs only evaluation)
#   nix path-info --store cache -r <that .drv>
#
# The question remains the same: can the closure be walked from cache metadata
# without downloading any content? If yes, the dependency graph for every setup
# costs seconds, not the gigabytes that building each one costs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  timing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: can a closure be read from cache metadata alone?
        run: |
          set -uo pipefail
          attr='nixpkgs#php85Packages.composer'

          echo "== 1. evaluate to a .drv (no build) =="
          t0=$(date +%s)
          drv=$(nix eval --raw "$attr.drvPath" 2>/tmp/e.err) || { echo "eval failed"; tail -3 /tmp/e.err; exit 0; }
          t1=$(date +%s)
          echo "  drv: $drv"
          echo "  eval took $((t1 - t0))s"

          echo "== 2. closure of that drv, against the binary cache =="
          t2=$(date +%s)
          if nix path-info --store https://cache.nixos.org -r "$drv" > /tmp/cl 2>/tmp/c.err; then
            t3=$(date +%s)
            echo "  OK  $(wc -l < /tmp/cl) paths in $((t3 - t2))s"
          else
            t3=$(date +%s)
            echo "  FAILED in $((t3 - t2))s"
            tail -4 /tmp/c.err | sed 's/^/    /'
          fi

          echo "== 3. switch to the OUTPUT path and retry =="
          # `.outPath` forces the derivation to be realised, which is a download -
          # unless nix can fill in the path purely from the .drv's input-addressed
          # hash, which it can.
          out=$(nix eval --raw "$attr.outPath" 2>/dev/null) || out=""
          echo "  outPath: ${out:-<unresolved>}"
          if [ -n "$out" ]; then
            t4=$(date +%s)
            nix path-info --store https://cache.nixos.org -r "$out" > /tmp/cl2 2>/tmp/c2.err \
              && { t5=$(date +%s); echo "  OK  $(wc -l < /tmp/cl2) paths in $((t5 - t4))s"; } \
              || { t5=$(date +%s); echo "  FAILED in $((t5 - t4))s"; tail -3 /tmp/c2.err | sed 's/^/    /'; }
          fi

      - name: time it across the whole manifest
        run: |
          set -uo pipefail
          python3 - <<'PY' > /tmp/list.txt
          import sys
          sys.path.insert(0, ".")
          import matrixlib2
          for e in matrixlib2.load("matrix-nix.yml"):
              print(e["dir"], e["attr"])
          PY
          t0=$(date +%s)
          ok=0; failed=0; npaths=0
          while read -r dir attr; do
            out=$(nix eval --raw "$attr.outPath" 2>/dev/null) || { failed=$((failed+1)); echo "  no outPath: $dir"; continue; }
            if nix path-info --store https://cache.nixos.org -r "$out" > "/tmp/p-$dir" 2>/dev/null; then
              ok=$((ok+1)); npaths=$((npaths + $(wc -l < "/tmp/p-$dir")))
            else
              failed=$((failed+1)); echo "  no closure: $dir"
            fi
          done < /tmp/list.txt
          t1=$(date +%s)
          echo "done: $ok resolved, $failed failed, $((t1-t0))s total, $npaths path entries"

name: build

# Build every toolchain image declared in matrix.yml and push it to ghcr.
#
# The matrix is READ FROM matrix.yml, so adding an image is a one-line edit
# there - this workflow has no per-image knowledge.
#
# Only pushes on main (or a tag); a pull request builds and verifies but never
# publishes, so a PR cannot overwrite a tag other repositories depend on.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # required to push to ghcr

jobs:
  # Read matrix.yml once and expose it as a job matrix, so each image builds in
  # its own job (parallel, and one failure does not hide the others).
  matrix:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.gen.outputs.images }}
    steps:
      - uses: actions/checkout@v4
      - id: gen
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/m.json
          import json, yaml
          doc = yaml.safe_load(open("matrix.yml"))
          out = []
          for img in doc["images"]:
              tools = img.get("tools") or {}
              out.append({
                  "tag": img["tag"],
                  "tools": " ".join(sorted(tools)),
                  "args": " ".join(f"{k.upper()}_VERSION={v}" for k, v in sorted(tools.items())),
              })
          print(json.dumps({"include": out}))
          PY
          echo "images=$(cat /tmp/m.json)" >> "$GITHUB_OUTPUT"
          python3 -c 'import json;d=json.load(open("/tmp/m.json"));[print(x["tag"],"->",x["tools"]) for x in d["include"]]'

  image:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.images) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: log in to ghcr
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The build args come straight from matrix.yml. They are expanded into a
      # file, not the command line, so a version containing spaces ("21.0.8+9"
      # is fine, but a future one might not) cannot word-split badly.
      - name: build ${{ matrix.tag }}
        run: |
          set -euo pipefail
          printf '%s\n' ${{ matrix.args }} > /tmp/args.txt
          build_args=(--build-arg "TOOLS=${{ matrix.tools }}")
          while read -r kv; do [ -n "$kv" ] && build_args+=(--build-arg "$kv"); done < /tmp/args.txt
          docker buildx build \
            "${build_args[@]}" \
            --tag "ghcr.io/easydev-org/easysetup:${{ matrix.tag }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --load \
            -f Dockerfile .

      # Verify INSIDE the image: every declared tool must answer --version after
      # sourcing env.sh. This is what makes the matrix trustworthy - an image
      # that builds but ships a broken toolchain fails here, not in a user repo.
      - name: verify ${{ matrix.tag }}
        run: |
          set -euo pipefail
          docker run --rm "ghcr.io/easydev-org/easysetup:${{ matrix.tag }}" bash -lc '
            set -e
            . /opt/setup/env.sh
            for t in ${{ matrix.tools }}; do
              case "$t" in
                node)   node --version ;;
                python) python3 --version ;;
                go)     go version ;;
                java)   java -version 2>&1 | head -1 ;;
                *) echo "unknown tool $t" >&2; exit 1 ;;
              esac
            done
          '

      - name: push ${{ matrix.tag }}
        if: github.event_name != 'pull_request'
        run: docker push "ghcr.io/easydev-org/easysetup:${{ matrix.tag }}"

name: probe-tf2

# Why does resolving terraform through OUR flake still fail?
#
# `nix eval --raw '.#"terraform-1.16.5".outPath'` is the form compute-deps.py
# uses. This runs it, prints the exact error, and compares the other plausible
# spellings - so the fix is based on the message rather than a guess.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: the forms compute-deps uses
        run: |
          set -uo pipefail
          echo "== .#\"terraform-1.16.5\".outPath =="
          nix eval --raw '.#"terraform-1.16.5".outPath' > /tmp/a 2>&1; echo "exit=$?"
          tail -8 /tmp/a
          echo
          echo "== is the attribute listed by the flake at all? =="
          nix eval --json '.#packages.x86_64-linux' --apply 'x: builtins.length (builtins.attrNames x)' > /tmp/b 2>&1
          echo "exit=$?"; cat /tmp/b
          echo
          echo "== does it appear among the names? =="
          nix eval --json '.#packages.x86_64-linux' --apply 'x: builtins.filter (n: builtins.match ".*terraform.*" n != null) (builtins.attrNames x)' > /tmp/c 2>&1
          echo "exit=$?"; cat /tmp/c
          echo
          echo "== what does the setup file contain? =="
          cat setups/terraform-1.16.5.nix 2>/dev/null || echo "(missing)"

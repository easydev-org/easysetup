name: probe-conda

# What is nixpkgs' `conda`, and where is the actual `conda` command?
#
# The audit found the conda setup ships exactly one executable, `conda-shell`, so
# `conda create -n ...` does not exist. Two questions follow, and both are
# answered here rather than guessed:
#
#   1. what IS conda-shell? (read the script)
#   2. is there a real conda CLI in nixpkgs under some other name?
#
# Candidates worth checking: micromamba and mamba are the maintained
# implementations; `conda` from python3Packages is the library; miniconda is an
# installer, which nixpkgs cannot package as a plain derivation.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: what does conda-shell do?
        run: |
          set -uo pipefail
          out=$(nix build --no-link --print-out-paths 'nixpkgs#conda' 2>/dev/null | tail -1)
          echo "conda output: $out"
          echo
          echo "== bin/ =="
          ls -l "$out/bin" 2>/dev/null
          echo
          echo "== what conda-shell is =="
          file "$out/bin/conda-shell" 2>/dev/null
          echo "--- first 30 lines ---"
          head -30 "$out/bin/conda-shell" 2>/dev/null

      - name: is there a conda executable anywhere in the output?
        run: |
          set -uo pipefail
          out=$(nix build --no-link --print-out-paths 'nixpkgs#conda' 2>/dev/null | tail -1)
          echo "== every executable-ish file named conda* =="
          find "$out" -name 'conda*' 2>/dev/null | head -20
          echo
          echo "== python modules =="
          ls "$out/lib" 2>/dev/null | head -5

      - name: probe alternative conda implementations
        run: |
          set -uo pipefail
          probe() {
            local attr="$1"
            local v
            # `.version` on a dotted or missing attr is not reliable; ask the name
            # and treat failure as absent.
            v=$(nix eval --raw "nixpkgs#$attr.name" 2>/dev/null) || v=""
            if [ -n "$v" ]; then
              printf '  %-30s %s\n' "$attr" "$v"
            else
              printf '  %-30s %s\n' "$attr" "-"
            fi
          }
          echo "== conda-family implementations =="
          probe micromamba
          probe mamba
          probe conda
          probe conda-shell
          probe pixi
          probe rattler
          echo
          echo "== what does micromamba provide? =="
          out=$(nix build --no-link --print-out-paths 'nixpkgs#micromamba' 2>/dev/null | tail -1) || out=""
          if [ -n "$out" ]; then
            ls "$out/bin" 2>/dev/null
            "$out/bin/micromamba" --version 2>&1 | head -2
          else
            echo "  (micromamba not available)"
          fi

      - name: does the conda setup's conda-shell run at all?
        run: |
          set -uo pipefail
          out=$(nix build --no-link --print-out-paths 'nixpkgs#conda' 2>/dev/null | tail -1)
          echo "== running conda-shell with --help =="
          timeout 60 "$out/bin/conda-shell" --help 2>&1 | head -12 || echo "(exited $?)"

name: easysetup
description: >-
  Install pinned toolchains from prebuilt nix closures: node, python, go, java,
  rust, swift, clang, php and more. Each tarball is a complete nix store closure,
  so installing is one download and one unpack - no apt, no dependency
  resolution, no compilation.
author: easydev-org

inputs:
  tools:
    description: >-
      Space-separated setup names, e.g. "node python jq". A bare name means the
      newest version; name it explicitly for an older one ("node-24"). Python's
      tools take a suffix when both interpreters are present ("mypy-py3.13").
    required: true
  cache:
    description: >-
      Reuse /nix between runs. The store is content-addressed, so a cache hit is
      always the exact tree that was published - good for keeping repeat runs
      fast.
    required: false
    default: "true"
  env-script:
    description: >-
      Where to write env.sh. Later steps rarely need it: the action appends the
      tool directories to GITHUB_PATH, so plain `run: node -v` works.
    required: false
    default: /opt/setup/env.sh
  cli-version:
    description: >-
      Which easysetup binary to download, from the easysetup-cli releases.
      Empty means the newest release.
    required: false
    default: ""

outputs:
  env-script:
    description: Path to the generated env.sh
    value: ${{ steps.env.outputs.env-script }}

runs:
  using: composite
  steps:
    # A single static binary does the whole install.
    #
    # This replaced install.sh, which needed sh, curl, zstd and python3 to
    # bootstrap itself - four things a distroless image does not have. The binary
    # has no interpreter at all (ldd: "not a dynamic executable"), so the only
    # requirement left is a way to fetch it.
    #
    # Downloading the binary rather than committing it: it is 6 MB per
    # architecture, and 12 MB of binaries in git history for a file that changes
    # on every release is a permanent cost for a one-second saving - the job
    # downloads tarballs anyway.
    - name: fetch the easysetup binary
      id: cli
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        WANT: ${{ inputs.cli-version }}
      run: |
        set -euo pipefail
        case "$(uname -m)" in
          x86_64)         arch=amd64 ;;
          aarch64|arm64)  arch=arm64 ;;
          *) echo "::error::unsupported architecture $(uname -m)"; exit 1 ;;
        esac

        if [ -n "$WANT" ]; then
          tag="$WANT"
        else
          tag=$(curl -fsSL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/easydev-org/easysetup-cli/releases/latest" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')
        fi
        echo "easysetup $tag for linux/$arch"

        base="https://github.com/easydev-org/easysetup-cli/releases/download/$tag"
        bin="$RUNNER_TEMP/easysetup"
        curl -fsSL --retry 3 --retry-all-errors \
          -H "Authorization: Bearer $GH_TOKEN" \
          -o "$bin" "$base/easysetup-linux-$arch"
        # The checksum is published beside the binary; verifying it means a
        # truncated download fails here rather than as a mysterious exec error.
        curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
          -o "$bin.sha256" "$base/easysetup-linux-$arch.sha256"
        ( cd "$RUNNER_TEMP" && echo "$(cat "$bin.sha256")  easysetup" | sha256sum -c - )
        chmod +x "$bin"
        "$bin" --help > /dev/null
        echo "bin=$bin" >> "$GITHUB_OUTPUT"

    # Make /nix usable by the rest of the job.
    #
    # The one thing that needs root, and it cannot be avoided: every binary in
    # the closures names /nix/store/<hash>-glibc/lib/ld-linux-x86-64.so.2 as its
    # ELF interpreter, the kernel resolves that before the program starts, and no
    # environment variable redirects it. So the path has to exist. Where the bytes
    # physically live is free - a symlink works - but the name cannot be avoided.
    - name: prepare /nix/store
      shell: bash
      run: |
        set -euo pipefail
        "${{ steps.cli.outputs.bin }}" prepare

    # Keyed on the setup list AND on what those setups currently resolve to.
    #
    # Keying on the list alone was a real bug: `tools: python` kept hitting a
    # cache built when python was 3.15, so /nix held a `setup-root-python-3.15.0`
    # entry whose store path no longer existed. The hash suffix is the manifest
    # plus closures.json, so a version change produces a different key.
    - name: restore the nix store
      if: inputs.cache == 'true'
      uses: actions/cache@v4
      with:
        path: /nix
        key: easysetup-nix-${{ inputs.tools }}-${{ hashFiles('**/matrix-nix.yml') }}-${{ github.run_id }}
        restore-keys: |
          easysetup-nix-${{ inputs.tools }}-

    - name: install
      shell: bash
      env:
        # Release assets are rate-limited to 60 requests/hour per IP anonymously.
        # A job installing several large setups exhausts that, and the failure
        # reads as "download failed" rather than "rate limited". github.token is
        # always available and uses a separate 5000/hour quota.
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        # Word-splitting is intended: the input is space-separated by contract.
        # shellcheck disable=SC2086
        "${{ steps.cli.outputs.bin }}" install ${{ inputs.tools }}

    # A cache hit means the install step did nothing, so GITHUB_PATH was never
    # written. Regenerating env.sh and re-appending the paths is what makes
    # "installed" and "usable in the next step" the same thing.
    - name: expose the tools to later steps
      id: env
      shell: bash
      env:
        OUT: ${{ inputs.env-script }}
      run: |
        set -euo pipefail
        "${{ steps.cli.outputs.bin }}" env "$OUT" > /dev/null

        # GITHUB_PATH is how one step passes PATH to the NEXT one. Without this,
        # `uses: easysetup` followed by `run: node -v` in a separate step would
        # not see node at all, whatever env.sh says.
        if [ -n "${GITHUB_PATH:-}" ]; then
          grep -o 'PATH="[^:]*' "$OUT" | sed 's/PATH="//' >> "$GITHUB_PATH" || true
        fi
        if [ -n "${GITHUB_ENV:-}" ]; then
          echo "EASYSETUP_ENV=$OUT" >> "$GITHUB_ENV"
        fi
        echo "env-script=$OUT" >> "$GITHUB_OUTPUT"

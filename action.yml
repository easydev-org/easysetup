name: easysetup
description: >-
  Install pinned toolchains from prebuilt nix closures: node, python, go, java,
  rust, swift, clang, cmake and more. Each tarball is a complete nix store
  closure, so installing is one download and one unpack - no apt, no dependency
  resolution, no compilation.
author: easydev-org

inputs:
  tools:
    description: >-
      Space-separated setup names, e.g. "node python swift". A name resolves to
      exactly one setup; if several versions exist, name the version too.
    required: true
  cache:
    description: >-
      Reuse /nix between runs. The store is content-addressed, so a cache hit is
      always the exact tree that was published - good for keeping repeat runs
      fast.
    required: false
    default: "true"
  env-script:
    description: >-
      Where to write env.sh. Later steps rarely need it: the action appends the
      tool directories to GITHUB_PATH, so plain `run: node -v` works.
    required: false
    # The path keeps its historical name; nothing puts a tree there any more -
    # setups unpack into /nix/store. It is just a file the caller can source.
    default: /opt/setup/env.sh

outputs:
  env-script:
    description: Path to the generated env.sh
    value: ${{ steps.env.outputs.env-script }}

runs:
  using: composite
  steps:
    # The artifacts carry an absolute /nix/store interpreter, so they need the
    # glibc they were built against. Checking up front turns "the tool is
    # missing" into "this runner's libc is too old", which is a different fix.
    - name: check the platform
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -r /etc/os-release ]; then
          echo "::warning::cannot read /etc/os-release; assuming debian 13"
          exit 0
        fi
        . /etc/os-release
        if [ "${ID:-}" != "debian" ] || [ "${VERSION_ID:-}" != "13" ]; then
          echo "::error::easysetup artifacts are built for debian 13 (trixie); this is ${ID:-?} ${VERSION_ID:-?}."
          echo "::error::Add 'container: debian:trixie-slim' to the job, or use a trixie-based image."
          exit 1
        fi
        echo "platform ok: debian ${VERSION_ID}"

    # debian:trixie-slim ships none of these, and install.sh needs all four:
    # curl to fetch, zstd to unpack, python3 to read the manifest, and the CA
    # bundle because the image has no /etc/ssl/certs at all (verified - without
    # it every HTTPS request fails with curl error 77).
    - name: install the installer's own prerequisites
      shell: bash
      run: |
        set -euo pipefail
        if command -v curl >/dev/null && command -v zstd >/dev/null \
           && command -v python3 >/dev/null && [ -d /etc/ssl/certs ]; then
          echo "prerequisites present"
          exit 0
        fi
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends \
          curl zstd python3 ca-certificates
        echo "prerequisites installed"

    # Keyed on the setup list. The store is content-addressed, so a hit is
    # bit-for-bit what was published; a miss costs one download.
    #
    # What is cached is /nix - the store AND the setup-root-* registry files. That
    # is deliberate: the registry is how the next step finds the binaries, so a
    # cache that restored the store but not the registry would install nothing
    # usable. It also means a cache hit and a fresh install take the same code
    # path afterwards.
    - name: restore the nix store
      if: inputs.cache == 'true'
      uses: actions/cache@v4
      with:
        path: /nix
        key: easysetup-nix-${{ inputs.tools }}

    - name: install
      shell: bash
      env:
        EASYSETUP_TOOLS: ${{ inputs.tools }}
      run: |
        set -euo pipefail
        curl -fsSL --retry 3 \
          https://raw.githubusercontent.com/easydev-org/easysetup/main/install.sh \
          -o /tmp/easysetup-install.sh
        # Word-splitting the list is intended: it is space-separated by contract.
        # shellcheck disable=SC2086
        bash /tmp/easysetup-install.sh $EASYSETUP_TOOLS

    # A cache hit means install.sh never ran, so GITHUB_PATH was never written.
    # Regenerating env.sh and re-appending the paths is what makes "installed"
    # and "usable in the next step" the same thing.
    - name: expose the tools to later steps
      id: env
      shell: bash
      env:
        OUT: ${{ inputs.env-script }}
      run: |
        set -euo pipefail
        bash "$GITHUB_ACTION_PATH/tools/gen-env.sh" "$OUT"
        echo "env-script=$OUT" >> "$GITHUB_OUTPUT"

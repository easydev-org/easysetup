name: easysetup
description: >-
  Install pinned toolchains from prebuilt nix closures: node, python, go, java,
  rust, swift, clang, cmake and more. Each tarball is a complete nix store
  closure, so installing is one download and one unpack - no apt, no dependency
  resolution, no compilation.
author: easydev-org

inputs:
  tools:
    description: >-
      Space-separated setup names, e.g. "node python swift". A name resolves to
      exactly one setup; if several versions exist, name the version too.
    required: true
  cache:
    description: >-
      Reuse /nix between runs. The store is content-addressed, so a cache hit is
      always the exact tree that was published - good for keeping repeat runs
      fast.
    required: false
    default: "true"
  env-script:
    description: >-
      Where to write env.sh. Later steps rarely need it: the action appends the
      tool directories to GITHUB_PATH, so plain `run: node -v` works.
    required: false
    # The path keeps its historical name; nothing puts a tree there any more -
    # setups unpack into /nix/store. It is just a file the caller can source.
    default: /opt/setup/env.sh

outputs:
  env-script:
    description: Path to the generated env.sh
    value: ${{ steps.env.outputs.env-script }}

runs:
  using: composite
  steps:
    # No distro check.
    #
    # This used to refuse anything but Debian 13, on the grounds that the
    # artifacts need trixie's glibc. That was wrong, and measurably so: every
    # binary's PT_INTERP is an absolute /nix/store path inside the closure
    # itself, and ldd resolves libc from there too. The host libc is never
    # consulted, so the version on the runner does not matter.
    #
    # Measured after removing the check: jq from the published artifacts runs on
    # Ubuntu 24.04 (glibc 2.39), Debian 12 (2.36), Fedora 44 (2.43) and Alpine
    # (musl, no glibc at all). The only thing that actually breaks on an older or
    # non-Debian image is this step's own prerequisites, which is a different
    # problem with a different fix.
    #
    # What IS required: a POSIX-ish userland with bash, and the four packages
    # install.sh needs - curl to fetch, zstd to unpack, python3 to read the
    # manifest, and a CA bundle. Debian-slim images ship none of them; most other
    # CI images already have all four, in which case this step is a no-op.
    - name: install the installer's own prerequisites
      shell: bash
      run: |
        set -euo pipefail
        if command -v curl >/dev/null && command -v zstd >/dev/null \
           && command -v python3 >/dev/null && [ -d /etc/ssl/certs ]; then
          echo "prerequisites present"
          exit 0
        fi
        # Pick the package manager that is actually here rather than assuming apt.
        if command -v apt-get >/dev/null; then
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            curl zstd python3 ca-certificates
        elif command -v dnf >/dev/null; then
          dnf install -y -q curl zstd python3 ca-certificates
        elif command -v yum >/dev/null; then
          yum install -y -q curl zstd python3 ca-certificates
        elif command -v apk >/dev/null; then
          apk add --no-cache curl zstd python3 ca-certificates
        elif command -v zypper >/dev/null; then
          zypper -q install -y curl zstd python3 ca-certificates
        else
          echo "::error::cannot install curl/zstd/python3/ca-certificates: no known package manager."
          echo "::error::Install them yourself before this action, then rerun."
          exit 1
        fi
        echo "prerequisites installed"

    # Keyed on the setup list AND on what those setups currently resolve to.
    #
    # Keying on the list alone was a real bug: `tools: python` kept hitting a
    # cache built when python was 3.15, so /nix held a `setup-root-python-3.15.0`
    # entry whose store path no longer existed, and the install neither refreshed
    # it nor could use it. The hash suffix is the manifest plus closures.json, so
    # a version change - or a delta recomputation - produces a different key and
    # therefore a cold, correct cache.
    #
    # What is cached is /nix - the store AND the setup-root-* registry files.
    # That is deliberate: the registry is how the next step finds the binaries.
    - name: work out the cache key
      id: cachekey
      shell: bash
      run: |
        set -euo pipefail
        base="https://raw.githubusercontent.com/easydev-org/easysetup/main"
        h=$( { curl -fsSL "$base/matrix-nix.yml"; curl -fsSL "$base/closures.json"; } \
             | sha256sum | cut -c1-16 )
        echo "hash=$h" >> "$GITHUB_OUTPUT"

    - name: restore the nix store
      if: inputs.cache == 'true'
      uses: actions/cache@v4
      with:
        path: /nix
        key: easysetup-nix-${{ inputs.tools }}-${{ steps.cachekey.outputs.hash }}

    - name: install
      shell: bash
      env:
        EASYSETUP_TOOLS: ${{ inputs.tools }}
      run: |
        set -euo pipefail
        curl -fsSL --retry 3 \
          https://raw.githubusercontent.com/easydev-org/easysetup/main/install.sh \
          -o /tmp/easysetup-install.sh
        # Word-splitting the list is intended: it is space-separated by contract.
        # shellcheck disable=SC2086
        bash /tmp/easysetup-install.sh $EASYSETUP_TOOLS

    # A cache hit means install.sh never ran, so GITHUB_PATH was never written.
    # Regenerating env.sh and re-appending the paths is what makes "installed"
    # and "usable in the next step" the same thing.
    - name: expose the tools to later steps
      id: env
      shell: bash
      env:
        OUT: ${{ inputs.env-script }}
      run: |
        set -euo pipefail
        bash "$GITHUB_ACTION_PATH/tools/gen-env.sh" "$OUT"
        echo "env-script=$OUT" >> "$GITHUB_OUTPUT"

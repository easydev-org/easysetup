    sha256: "b3793b72d96b3928e1ee09f0638afc6f272b7173ff498c2f7873a6fce4ea9ea1"

  # ---------------------------------------------------------------- rust ---
  # The host toolchain: rustc + cargo + the linux std. The release job merges

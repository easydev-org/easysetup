# matrix.yml — the toolchain versions easysetup publishes.
#
# ONE ENTRY PER TOOL. There are deliberately no combinations here: a job that
# needs node AND python asks for two setups, and each installs itself into
# /opt/setup/<tool>. Combinations are the CONSUMER's business, not ours.
#
# For every entry this file records:
#   version    the pinned upstream version (hand-pinned, never "latest")
#   apt_deps   base packages installed with apt before unpacking. These are the
#              shared runtime libraries the prebuilt tool needs on debian, and
#              nothing else - the tool itself is NOT an apt package.
#   artifact   the release asset carrying a complete /opt/setup/<tool> tree
#   sha256     checksum of that asset; the installer refuses a mismatch
#
# A release tag is <tool>-<version>, so the asset for node 22.20.0 lives at
#   https://github.com/easydev-org/easysetup/releases/download/node-22.20.0/<artifact>

base:
  # Every setup targets debian trixie on amd64. Anything else is unsupported.
  distro: debian-trixie
  arch: amd64

setups:
  node:
    version: "22.20.0"
    apt_deps: [ca-certificates, curl, xz-utils]
    artifact: node-22.20.0-debian-trixie-amd64.tar.xz
    sha256: "9bef5e27b3116e41998af1ad59df28823d6604330e4ade744acde1bac68eb51d"            # filled in by the release workflow

  python:
    version: "3.12.15"
    apt_deps: [ca-certificates, curl, libssl3, zlib1g, libffi8, libbz2-1.0, liblzma5, libsqlite3-0, libreadline8]
    artifact: python-3.12.15-debian-trixie-amd64.tar.xz
    sha256: "b2d5462247f2274378bbe4cbc3578b9f173f4ace2331e3791265619c76fa949f"

  go:
    version: "1.27.2"
    apt_deps: [ca-certificates, curl]
    artifact: go-1.27.2-debian-trixie-amd64.tar.xz
    sha256: "622dbbba230bca3baab07ec0c250e90579303200452f649bfc627fdd2fa4556c"

  java:
    version: "21.0.8+9"
    apt_deps: [ca-certificates, curl]
    artifact: java-21.0.8-9-debian-trixie-amd64.tar.xz
    sha256: "2151c6b607f58f830db804ccfe52502a029604e08ac5db028c87e26a7afa3596"

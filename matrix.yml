  - tool: cmake
    version: "4.4.4"
    apt_deps: [ca-certificates, curl]
    artifact: cmake-4.4.4-debian-trixie-amd64.tar.xz
    sha256: ""

  # ---------------------------------------------------------------
  # The build backend cmake generates for by default. One static binary.
  - tool: ninja
    version: "1.13.2"
    apt_deps: [ca-certificates, curl, unzip]
    artifact: ninja-1.13.2-debian-trixie-amd64.tar.xz
    sha256: "2a61114345a3c314fffdf300dbaed8ebec1cc009fc6651e32cebd4691dcb0ca0"

  # ------------------------------------------------------------------

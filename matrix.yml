  - tool: node
    version: "22.23.4"
    apt_deps: [ca-certificates, curl, xz-utils, libatomic1]
    artifact: node-22.23.4-debian-trixie-amd64.tar.xz
    sha256: "f206e7d660a860f89acd91a00aabb11207ac27dc133bf05fd92300aa9e44e207"

  - tool: node
    version: "24.22.1"

    sha256: "127a95f889d1c197f079eab08dc8f0edefaad802b31d18dabe3b01b17517c49e"

  # Cross target: Windows GNU. It links with mingw on linux, so this one really
  # produces a .exe from a linux host - that is why it carries the linker's
  # runtime package in apt_deps.
  - tool: rust-toolchain-x86_64-pc-windows-gnu
    builder: rust
    version: "1.99.1"
    requires: ["rust@>=1.99,<2"]
    apt_deps: [ca-certificates, curl, gcc-mingw-w64-x86-64]
    artifact: rust-toolchain-x86_64-pc-windows-gnu-1.99.1-debian-trixie-amd64.tar.xz
    sha256: "46c0f2d525a7364c6305fb9b9b259e6e3543d58c3a4c0c72c26604227d8ed957"

  # Cross target: Windows MSVC. Only the std is published for it; linking needs
  # MSVC on Windows, so on linux this supports `cargo check`, not a finished
  # binary. Stated here so nobody expects an .exe.
  - tool: rust-toolchain-x86_64-pc-windows-msvc
    builder: rust
    version: "1.99.1"
    requires: ["rust@>=1.99,<2"]

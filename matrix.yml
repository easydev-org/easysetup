    sha256: "f89dd80dbabb25d82ac7b6b4b0662f11dff9e978ef9f6529666796f195ed308c"

  # ------------------------------------------------------------------ ghc ---
  # GHC ships deb11/deb12/deb13 builds; only deb11 and deb12 exist for these

# matrix.yml — the toolchain versions easysetup publishes.
#
# ONE ENTRY PER (tool, VERSION). There are deliberately no combinations: a job
# that needs node AND python installs two setups, and each extracts into its own
# /opt/setup/<tool>-<major> directory. Combinations are the CONSUMER's business.
#
# Several versions of the same tool coexist on purpose, so a repository can pin
# the runtime its lockfile was built against instead of chasing the newest.
# Each one lands in a versioned directory:
#
#   /opt/setup/node-22/bin/node
#   /opt/setup/node-24/bin/node
#
# so installing two does not put them in each other's way.
#
# Fields:
#   id         the name used by install.sh and by a job's `setup:` list
#   version    hand-pinned upstream version (never "latest")
#   apt_deps   base packages installed with apt before unpacking - shared
#              runtime libraries only, never the tool itself
#   artifact   the release asset carrying a complete tree
#   sha256     checksum; install.sh refuses to unpack on a mismatch
#
# A release tag is <id>-<version>, e.g. releases/download/node-22-22.23.4/...

base:
  # Every setup targets debian trixie on amd64. Anything else is unsupported.
  distro: debian-trixie
  arch: amd64

setups:
  # ---------------------------------------------------------------- node ---
  node-22:
    tool: node
    version: "22.23.4"
    apt_deps: [ca-certificates, curl, xz-utils, libatomic1]
    artifact: node-22.23.4-debian-trixie-amd64.tar.xz
    sha256: "9c731bca08dd18e30d9c868ae6285e8445d6cbe112d56af80146dc033bc98c0a"

  node-24:
    tool: node
    version: "24.22.1"

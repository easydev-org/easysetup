    sha256: "05d9906fdfd2c49dd9f2e68632416eda141c200c31a90a3c436215598e13f393"

  # ----------------------------------------------------------------- opam ---
  # Single binary. It still needs an OCaml compiler to do anything, which opam
  # fetches on demand - that is opam's own model, not something we can pin.
  - tool: opam
    version: "2.6.1"
    apt_deps: [ca-certificates, curl, bzip2, m4, build-essential, pkg-config]
    artifact: opam-2.6.1-debian-trixie-amd64.tar.xz
    sha256: "6f25da9e11be424ead93f77a52e3ad4f34a3036f068cd4bb8c69f0553db75382"

  # --------------------------------------------------------------- erlang ---
  # Prebuilt OTP from erlef/otp_builds (ubuntu 24.04 build; glibc is backward
  # compatible with trixie's).
  - tool: erlang
    version: "29.1.2"
    apt_deps: [ca-certificates, curl, libssl3, zlib1g, libncursesw6, libstdc++6]
    artifact: erlang-29.1.2-debian-trixie-amd64.tar.xz
    sha256: "04151cad1cd353063182602b0ef846c5c16345b9894e00256e3c21ef1555e8c6"

  # --------------------------------------------------------------- elixir ---

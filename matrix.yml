  # ---------------------------------------------------------------- java ---
  - tool: java
    version: "17.0.20+101"
    apt_deps: [ca-certificates, curl]
    artifact: java-17.0.20-101-debian-trixie-amd64.tar.xz
    sha256: "0f7eba75ccd66c0c7311fa968af922070c6ae87c7809ea1c277cc4b2fdbb0833"


# matrix.yml — the toolchain versions easysetup publishes.
#
# A LIST, one entry per published setup. `version` is a FIELD of the entry, not
# part of its name: nothing in this file encodes a version twice, and the
# directory a setup installs into is DERIVED from tool + version rather than
# being something a human has to keep in sync.
#
# Fields:
#   tool       the toolchain (node, python, go, java, maven, ...)
#   version    the exact upstream version, pinned by hand
#   apt_deps   base packages installed with apt before unpacking. Shared
#              runtime libraries only - never the tool itself, and never
#              anything that requires a download at install time.
#   artifact   the release asset carrying a complete /opt/setup tree
#   sha256     checksum of that asset; install.sh refuses a mismatch
#
# Derived names (never stored):
#   directory   /opt/setup/<tool>-<version>      e.g. /opt/setup/node-22.23.4
#   release tag <tool>-<version>                 e.g. node-22.23.4
#
# The install contract, for every entry: apt-get the listed packages, then
# unpack the tarball. No other network access is permitted or needed - the
# toolchain is already built and sits in the release.

base:
  # Every setup targets debian trixie on amd64. Anything else is unsupported.
  distro: debian-trixie
  arch: amd64

setups:
  # ---------------------------------------------------------------- node ---
  - tool: node
    version: "22.23.4"
    apt_deps: [ca-certificates, curl, xz-utils, libatomic1]
    artifact: node-22.23.4-debian-trixie-amd64.tar.xz
    sha256: "81fd1e9a9bae941905cd6ecaa52197d47054c04710953ee5564e51e2c5905af6"

  - tool: node
    version: "24.22.1"
    apt_deps: [ca-certificates, curl, xz-utils, libatomic1]
    artifact: node-24.22.1-debian-trixie-amd64.tar.xz
    sha256: "06bfff0d7bd5f6b89e6decb26ffb22295125831ccc9e1b5ddf2343104485ec92"

  - tool: node
    version: "26.12.1"
    apt_deps: [ca-certificates, curl, xz-utils, libatomic1]
    artifact: node-26.12.1-debian-trixie-amd64.tar.xz
    sha256: "902d34debd822621e2f6cb4f9348355f4ec31c1f53d9649d1be1c6e9a70e7a06"

  # -------------------------------------------------------------- python ---

  # --------------------------------------------------------------- maven ---
  # Apache Maven, from the official -bin.tar.gz. Needs a JRE, which is NOT
  # bundled: install a java-* setup alongside and JAVA_HOME will be set.
  - tool: maven
    version: "3.10.0"
    apt_deps: [ca-certificates, curl]
    artifact: maven-3.10.0-debian-trixie-amd64.tar.xz
    sha256: ""

  # -------------------------------------------------------------- gradle ---
  - tool: gradle
    version: "9.8.2"
    apt_deps: [ca-certificates, curl, unzip]
    artifact: gradle-9.8.2-debian-trixie-amd64.tar.xz
    sha256: ""

  - tool: gradle
    version: "8.14.6"
    apt_deps: [ca-certificates, curl, unzip]
    artifact: gradle-8.14.6-debian-trixie-amd64.tar.xz
    sha256: ""

  # ---------------------------------------------------------------- ruby ---
  # Ruby ships SOURCE only, so the build compiles it once in the release job
  # and the tarball carries the compiled tree. Installing never compiles.
  - tool: ruby
    version: "4.0.7"
    apt_deps: [ca-certificates, curl, libssl3, libyaml-0-2, zlib1g, libffi8, libreadline8, libgmp10]
    artifact: ruby-4.0.7-debian-trixie-amd64.tar.xz
    sha256: ""

  - tool: ruby
    version: "3.4.9"
    apt_deps: [ca-certificates, curl, libssl3, libyaml-0-2, zlib1g, libffi8, libreadline8, libgmp10]
    artifact: ruby-3.4.9-debian-trixie-amd64.tar.xz
    sha256: ""

  # ---------------------------------------------------------------- rust ---
  # The host toolchain: rustc + cargo + the linux std. The release job merges
  # those three upstream components into ONE tree, so installing is a single
  # unpack and nothing is fetched from rustup at run time.
  - tool: rust
    version: "1.99.1"
    apt_deps: [ca-certificates, curl, gcc, libc6-dev]
    artifact: rust-1.99.1-debian-trixie-amd64.tar.xz
    sha256: "8c9c9df7159a3004fef45761ff0a6b3e5638c6ac8fefe7d0320bef67163c28d6"

  # Cross target: Windows GNU. It links with mingw on linux, so this one really
  # produces a .exe from a linux host - that is why it carries the linker's
  # runtime package in apt_deps.
  - tool: rust
    version: "1.99.1"
    target: x86_64-pc-windows-gnu
    apt_deps: [ca-certificates, curl, gcc-mingw-w64-x86-64]
    artifact: rust-1.99.1-x86_64-pc-windows-gnu-debian-trixie-amd64.tar.xz
    sha256: ""

  # Cross target: Windows MSVC. Only the std is published for it; linking needs
  # MSVC on Windows, so on linux this supports `cargo check`, not a finished
  # binary. Stated here so nobody expects an .exe.
  - tool: rust
    version: "1.99.1"
    target: x86_64-pc-windows-msvc
    apt_deps: [ca-certificates, curl]
    artifact: rust-1.99.1-x86_64-pc-windows-msvc-debian-trixie-amd64.tar.xz
    sha256: ""

  # -------------------------------------------------------------- dotnet ---
  - tool: dotnet

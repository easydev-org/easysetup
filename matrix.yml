    sha256: "59f65698925a29c8ab00e505f5e7aa1fe7b04705c33aa307d5f5dc5f50a3fb1d"

  - tool: node
    version: "26.12.1"
    apt_deps: [ca-certificates, curl, xz-utils, libatomic1]

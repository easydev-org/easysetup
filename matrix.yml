    sha256: "f551dcdc2f9497ddf89d948e21a95a81ce5a1aadb7d8619ef9c766c9fe98e236"

  - tool: python
    version: "3.14.9"
    apt_deps: [ca-certificates, curl, libssl3, zlib1g, libffi8, libbz2-1.0, liblzma5, libsqlite3-0, libreadline8]
    artifact: python-3.14.9-debian-trixie-amd64.tar.xz
    sha256: "ab8b5247fe1b82c12a886b3f87ff90b32569de04cf4d1785d8cddc2e7dc6b51c"


    sha256: "1b9839fd7d005a43e8e869a4d3793c96ba25c7c4d6cc08a42adce1ad81c421cb"

  - tool: node
    version: "26.12.1"
    apt_deps: [ca-certificates, curl, xz-utils, libatomic1]

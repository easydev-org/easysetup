  - tool: opam
    version: "2.6.1"
    apt_deps: [ca-certificates, curl, bzip2, m4, build-essential, pkg-config]
    artifact: opam-2.6.1-debian-trixie-amd64.tar.xz
    sha256: "9606f893126cf5b187cdea2dafc7bdbf0e91bf39fa6c454237dbed573dc80661"


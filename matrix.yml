    sha256: "c2107b4b554a47f57fd77eb51b28ddba4c5a6e7136a10a96a8407e8e2acdbc3e"

  - tool: go
    version: "1.27.3"
    apt_deps: [ca-certificates, curl]
    artifact: go-1.27.3-debian-trixie-amd64.tar.xz
    sha256: "0027a57eb1752bbe92a6ee93cb2c1a95e016635d2a62c0068210376b00a771f0"

  # ---------------------------------------------------------------- java ---
  - tool: java
    version: "17.0.20+101"
    apt_deps: [ca-certificates, curl]
    artifact: java-17.0.20-101-debian-trixie-amd64.tar.xz
    sha256: "f1de4fd553e7c991a5e7f5430f9ec3eb468310e49a4834bf7df744179d62af9e"


    sha256: "107bdd55766347d53ec77641841695901a7ab5df2e084bdc112ddfaa38c4e7ba"

  - tool: node
    version: "26.12.1"
    apt_deps: [ca-certificates, curl, xz-utils, libatomic1]
    artifact: node-26.12.1-debian-trixie-amd64.tar.xz
    sha256: "253dc0ea923d9a079072e9eef7fbe4c7b0be74afea587448cdee28a3584b7135"


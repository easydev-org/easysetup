    artifact: erlang-29.1.2-debian-trixie-amd64.tar.xz
    sha256: "8bf8d7b0b4b6d5159dd36ac2b9d5377359db5ea282b1dd2cbddf6c99dbcbab40"

  # --------------------------------------------------------------- elixir ---

    sha256: "d6a9a209a8d8acb8eb06918a68133b2170f8624514648d26c5b8045ec913fb8a"

  # ------------------------------------------------------------------- R ---
  # Prebuilt from posit's ubuntu-24.04 .deb, plus the two libraries whose ABI
  # trixie does not carry: the .deb needs libicuuc.so.74 and libjpeg.so.8,
  # while trixie ships libicu 76 and libjpeg .so.62. Their sonames differ, so
  # apt_deps cannot satisfy them; build-r.sh unpacks those two .debs into the
  # tree's own lib/bundled/ and env.sh puts it on LD_LIBRARY_PATH. Nothing is
  # compiled.
  - tool: r
    version: "4.6.1"
    apt_deps: [ca-certificates, curl, libssl3, zlib1g, libreadline8, liblzma5, libbz2-1.0, libpcre2-8-0, libcurl4, libblas3, liblapack3, libgomp1, libcairo2, libglib2.0-0t64, libpango-1.0-0, libpangocairo-1.0-0, libpng16-16t64, libtcl8.6, libtk8.6, libtiff6, libx11-6, libxt6t64, libdeflate0, libtirpc3t64]
    artifact: r-4.6.1-debian-trixie-amd64.tar.xz
    sha256: "d9a55aa9058a9ee5cd8b7111475c86f27dd7e27c1a916cc5394a4fd8c171cf16"

  # --------------------------------------------------------------- julia ---
  - tool: julia
    version: "1.12.0"
    apt_deps: [ca-certificates, curl]
    artifact: julia-1.12.0-debian-trixie-amd64.tar.xz
    sha256: "aaad76b56ed812b2cd8864ea6d114aabd70ce754038a3bbef6bcc24b6f12f085"


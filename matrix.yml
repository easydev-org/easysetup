# matrix.yml — the toolchain versions easysetup publishes.
#
# ONE ENTRY PER (tool, VERSION). There are deliberately no combinations: a job
# that needs node AND python installs two setups, and each extracts into its own
# /opt/setup/<tool>-<major> directory. Combinations are the CONSUMER's business.
#
# Several versions of the same tool coexist on purpose, so a repository can pin
# the runtime its lockfile was built against instead of chasing the newest.
# Each one lands in a versioned directory:
#
#   /opt/setup/node-22/bin/node
#   /opt/setup/node-24/bin/node
#
# so installing two does not put them in each other's way.
#
# Fields:
#   id         the name used by install.sh and by a job's `setup:` list
#   version    hand-pinned upstream version (never "latest")
#   apt_deps   base packages installed with apt before unpacking - shared
#              runtime libraries only, never the tool itself
#   artifact   the release asset carrying a complete tree
#   sha256     checksum; install.sh refuses to unpack on a mismatch
#
# A release tag is <id>-<version>, e.g. releases/download/node-22-22.23.4/...

base:
  # Every setup targets debian trixie on amd64. Anything else is unsupported.
  distro: debian-trixie
  arch: amd64

setups:
  # ---------------------------------------------------------------- node ---
  node-22:
    tool: node
    version: "22.23.4"
    apt_deps: [ca-certificates, curl, xz-utils]
    artifact: node-22.23.4-debian-trixie-amd64.tar.xz
    sha256: ""

  node-24:
    tool: node
    version: "24.22.1"
    apt_deps: [ca-certificates, curl, xz-utils]
    artifact: node-24.22.1-debian-trixie-amd64.tar.xz
    sha256: ""

  node-26:
    tool: node
    version: "26.12.1"
    apt_deps: [ca-certificates, curl, xz-utils]
    artifact: node-26.12.1-debian-trixie-amd64.tar.xz
    sha256: ""

  # -------------------------------------------------------------- python ---
  python-312:
    tool: python
    version: "3.12.15"
    apt_deps: [ca-certificates, curl, libssl3, zlib1g, libffi8, libbz2-1.0, liblzma5, libsqlite3-0, libreadline8]
    artifact: python-3.12.15-debian-trixie-amd64.tar.xz
    sha256: ""

  python-313:
    tool: python
    version: "3.13.17"
    apt_deps: [ca-certificates, curl, libssl3, zlib1g, libffi8, libbz2-1.0, liblzma5, libsqlite3-0, libreadline8]
    artifact: python-3.13.17-debian-trixie-amd64.tar.xz
    sha256: ""

  python-314:
    tool: python
    version: "3.14.9"
    apt_deps: [ca-certificates, curl, libssl3, zlib1g, libffi8, libbz2-1.0, liblzma5, libsqlite3-0, libreadline8]
    artifact: python-3.14.9-debian-trixie-amd64.tar.xz
    sha256: ""

  python-315:
    tool: python
    version: "3.15.1"
    apt_deps: [ca-certificates, curl, libssl3, zlib1g, libffi8, libbz2-1.0, liblzma5, libsqlite3-0, libreadline8]
    artifact: python-3.15.1-debian-trixie-amd64.tar.xz
    sha256: ""

  # ------------------------------------------------------------------ go ---
  go-124:
    tool: go
    version: "1.24.13"
    apt_deps: [ca-certificates, curl]
    artifact: go-1.24.13-debian-trixie-amd64.tar.xz
    sha256: ""

  go-125:
    tool: go
    version: "1.25.14"
    apt_deps: [ca-certificates, curl]
    artifact: go-1.25.14-debian-trixie-amd64.tar.xz
    sha256: ""

  go-126:
    tool: go
    version: "1.26.10"
    apt_deps: [ca-certificates, curl]
    artifact: go-1.26.10-debian-trixie-amd64.tar.xz
    sha256: ""

  go-127:
    tool: go
    version: "1.27.3"
    apt_deps: [ca-certificates, curl]
    artifact: go-1.27.3-debian-trixie-amd64.tar.xz
    sha256: ""

  # ---------------------------------------------------------------- java ---
  # Adoptium's semver carries a build suffix ("21.0.12+101.0.LTS"); the "+" is
  # not safe in an asset name, so it becomes "-" in `artifact`.
  java-17:
    tool: java
    version: "17.0.20+101"
    apt_deps: [ca-certificates, curl]
    artifact: java-17.0.20-101-debian-trixie-amd64.tar.xz
    sha256: ""

  java-21:
    tool: java
    version: "21.0.12+101"
    apt_deps: [ca-certificates, curl]
    artifact: java-21.0.12-101-debian-trixie-amd64.tar.xz
    sha256: ""

  java-25:
    tool: java
    version: "25.0.4+101"
    apt_deps: [ca-certificates, curl]
    artifact: java-25.0.4-101-debian-trixie-amd64.tar.xz
    sha256: ""

  java-27:
    tool: java
    version: "27.0.0+35"
    apt_deps: [ca-certificates, curl]
    artifact: java-27.0.0-35-debian-trixie-amd64.tar.xz
    sha256: ""

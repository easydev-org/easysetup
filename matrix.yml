# matrix.yml — the toolchain versions easysetup publishes.
#
# A LIST, one entry per published setup. `version` is a FIELD of the entry, not
# part of its name: nothing in this file encodes a version twice, and the
# directory a setup installs into is DERIVED from tool + version rather than
# being something a human has to keep in sync.
#
# Fields:
#   tool       the toolchain (node, python, go, java, maven, ...)
#   version    the exact upstream version, pinned by hand
#   apt_deps   base packages installed with apt before unpacking. Shared
#              runtime libraries only - never the tool itself, and never
#              anything that requires a download at install time.
#   artifact   the release asset carrying a complete /opt/setup tree
#   sha256     checksum of that asset; install.sh refuses a mismatch
#
# Derived names (never stored):
#   directory   /opt/setup/<tool>-<version>      e.g. /opt/setup/node-22.23.4
#   release tag <tool>-<version>                 e.g. node-22.23.4
#
# The install contract, for every entry: apt-get the listed packages, then
# unpack the tarball. No other network access is permitted or needed - the
# toolchain is already built and sits in the release.

base:
  # Every setup targets debian trixie on amd64. Anything else is unsupported.
  distro: debian-trixie
  arch: amd64

setups:
  # ---------------------------------------------------------------- node ---
  - tool: node
    version: "22.23.4"
    apt_deps: [ca-certificates, curl, xz-utils, libatomic1]
    artifact: node-22.23.4-debian-trixie-amd64.tar.xz
    sha256: ""

  - tool: node
    version: "24.22.1"
    apt_deps: [ca-certificates, curl, xz-utils, libatomic1]
    artifact: node-24.22.1-debian-trixie-amd64.tar.xz
    sha256: ""

  - tool: node
    version: "26.12.1"
    apt_deps: [ca-certificates, curl, xz-utils, libatomic1]
    artifact: node-26.12.1-debian-trixie-amd64.tar.xz
    sha256: ""

  # -------------------------------------------------------------- python ---
  - tool: python
    version: "3.12.15"
    apt_deps: [ca-certificates, curl, libssl3, zlib1g, libffi8, libbz2-1.0, liblzma5, libsqlite3-0, libreadline8]
    artifact: python-3.12.15-debian-trixie-amd64.tar.xz
    sha256: ""

  - tool: python
    version: "3.13.17"
    apt_deps: [ca-certificates, curl, libssl3, zlib1g, libffi8, libbz2-1.0, liblzma5, libsqlite3-0, libreadline8]
    artifact: python-3.13.17-debian-trixie-amd64.tar.xz
    sha256: ""

  - tool: python
    version: "3.14.9"
    apt_deps: [ca-certificates, curl, libssl3, zlib1g, libffi8, libbz2-1.0, liblzma5, libsqlite3-0, libreadline8]
    artifact: python-3.14.9-debian-trixie-amd64.tar.xz
    sha256: ""

  - tool: python
    version: "3.15.1"
    apt_deps: [ca-certificates, curl, libssl3, zlib1g, libffi8, libbz2-1.0, liblzma5, libsqlite3-0, libreadline8]
    artifact: python-3.15.1-debian-trixie-amd64.tar.xz
    sha256: ""

  # ------------------------------------------------------------------ go ---
  - tool: go
    version: "1.24.13"
    apt_deps: [ca-certificates, curl]
    artifact: go-1.24.13-debian-trixie-amd64.tar.xz
    sha256: ""

  - tool: go
    version: "1.25.14"
    apt_deps: [ca-certificates, curl]
    artifact: go-1.25.14-debian-trixie-amd64.tar.xz
    sha256: ""

  - tool: go
    version: "1.26.10"
    apt_deps: [ca-certificates, curl]
    artifact: go-1.26.10-debian-trixie-amd64.tar.xz
    sha256: ""

  - tool: go
    version: "1.27.3"
    apt_deps: [ca-certificates, curl]
    artifact: go-1.27.3-debian-trixie-amd64.tar.xz
    sha256: ""

  # ---------------------------------------------------------------- java ---
  - tool: java
    version: "17.0.20+101"
    apt_deps: [ca-certificates, curl]
    artifact: java-17.0.20-101-debian-trixie-amd64.tar.xz
    sha256: ""

  - tool: java
    version: "21.0.12+101"
    apt_deps: [ca-certificates, curl]
    artifact: java-21.0.12-101-debian-trixie-amd64.tar.xz
    sha256: ""

  - tool: java
    version: "25.0.4+101"
    apt_deps: [ca-certificates, curl]
    artifact: java-25.0.4-101-debian-trixie-amd64.tar.xz
    sha256: ""

  - tool: java
    version: "27.0.0+35"
    apt_deps: [ca-certificates, curl]
    artifact: java-27.0.0-35-debian-trixie-amd64.tar.xz
    sha256: ""

  # --------------------------------------------------------------- maven ---
  # Apache Maven, from the official -bin.tar.gz. Needs a JRE, which is NOT
  # bundled: install a java-* setup alongside and JAVA_HOME will be set.
  - tool: maven
    version: "3.10.0"
    apt_deps: [ca-certificates, curl]
    artifact: maven-3.10.0-debian-trixie-amd64.tar.xz
    sha256: ""

  # -------------------------------------------------------------- gradle ---
  - tool: gradle
    version: "9.8.2"
    apt_deps: [ca-certificates, curl, unzip]
    artifact: gradle-9.8.2-debian-trixie-amd64.tar.xz
    sha256: ""

  - tool: gradle
    version: "8.14.6"
    apt_deps: [ca-certificates, curl, unzip]
    artifact: gradle-8.14.6-debian-trixie-amd64.tar.xz
    sha256: ""

  # ---------------------------------------------------------------- ruby ---
  # Ruby ships SOURCE only, so the build compiles it once in the release job
  # and the tarball carries the compiled tree. Installing never compiles.
  - tool: ruby
    version: "4.0.8"
    apt_deps: [ca-certificates, curl, libssl3, libyaml-0-2, zlib1g, libffi8, libreadline8, libgmp10]
    artifact: ruby-4.0.8-debian-trixie-amd64.tar.xz
    sha256: ""

  - tool: ruby
    version: "3.4.11"
    apt_deps: [ca-certificates, curl, libssl3, libyaml-0-2, zlib1g, libffi8, libreadline8, libgmp10]
    artifact: ruby-3.4.11-debian-trixie-amd64.tar.xz
    sha256: ""

  # ---------------------------------------------------------------- rust ---
  # The host toolchain: rustc + cargo + the linux std. The release job merges
  # those three upstream components into ONE tree, so installing is a single
  # unpack and nothing is fetched from rustup at run time.
  - tool: rust
    version: "1.99.1"
    apt_deps: [ca-certificates, curl, gcc, libc6-dev]
    artifact: rust-1.99.1-debian-trixie-amd64.tar.xz
    sha256: ""

  # Cross target: Windows GNU. It links with mingw on linux, so this one really
  # produces a .exe from a linux host - that is why it carries the linker's
  # runtime package in apt_deps.
  - tool: rust-toolchain-x86_64-pc-windows-gnu
    builder: rust
    version: "1.99.1"
    requires: [rust-1.99.1]
    apt_deps: [ca-certificates, curl, gcc-mingw-w64-x86-64]
    artifact: rust-toolchain-x86_64-pc-windows-gnu-1.99.1-debian-trixie-amd64.tar.xz
    sha256: ""

  # Cross target: Windows MSVC. Only the std is published for it; linking needs
  # MSVC on Windows, so on linux this supports `cargo check`, not a finished
  # binary. Stated here so nobody expects an .exe.
  - tool: rust-toolchain-x86_64-pc-windows-msvc
    builder: rust
    version: "1.99.1"
    requires: [rust-1.99.1]
    apt_deps: [ca-certificates, curl]
    artifact: rust-toolchain-x86_64-pc-windows-msvc-1.99.1-debian-trixie-amd64.tar.xz
    sha256: ""

  # -------------------------------------------------------------- dotnet ---
  - tool: dotnet
    version: "10.0.402"
    apt_deps: [ca-certificates, curl, libicu76, libssl3, zlib1g]
    artifact: dotnet-10.0.402-debian-trixie-amd64.tar.xz
    sha256: ""

  # ----------------------------------------------------------------- php ---
  - tool: php
    version: "8.5"
    apt_deps: [ca-certificates, curl, libxml2, libsqlite3-0, libssl3, zlib1g, libonig5, libcurl4, libsodium23, libargon2-1, libpcre2-8-0, libgcc-s1]
    artifact: php-8.5-debian-trixie-amd64.tar.xz
    sha256: ""

  # ---------------------------------------------------------------- helm ---
  - tool: helm
    version: "4.3.1"
    apt_deps: [ca-certificates, curl]
    artifact: helm-4.3.1-debian-trixie-amd64.tar.xz
    sha256: ""

  # --------------------------------------------------------------- bazel ---
  - tool: bazel
    version: "9.3.1"
    apt_deps: [ca-certificates, curl, unzip, gcc, libc6-dev, zlib1g, openjdk-21-jre-headless]
    artifact: bazel-9.3.1-debian-trixie-amd64.tar.xz
    sha256: ""

  # ----------------------------------------------------------------- buf ---
  - tool: buf
    version: "1.75.0"
    apt_deps: [ca-certificates, curl]
    artifact: buf-1.75.0-debian-trixie-amd64.tar.xz
    sha256: ""

  # ---------------------------------------------------------------- deno ---
  # Single static binary. Covers the `jsr` protocol.
  - tool: deno
    version: "2.9.8"
    apt_deps: [ca-certificates, curl, unzip]
    artifact: deno-2.9.8-debian-trixie-amd64.tar.xz
    sha256: ""

  # --------------------------------------------------------------- conda ---
  # Miniforge: a self-contained conda whose installer just unpacks a prefix.
  - tool: conda
    version: "26.7.2-1"
    apt_deps: [ca-certificates, curl, bzip2, libx11-6, libxext6, libxrender1, libsm6, libice6]
    artifact: conda-26.7.2-1-debian-trixie-amd64.tar.xz
    sha256: ""

  # ------------------------------------------------------------------- R ---
  # COMPILED FROM SOURCE (first setup done this way). The prebuilt options are
  # per-distro: posit's ubuntu-24.04 .deb needs libicuuc.so.74 and libjpeg.so.8,
  # while trixie ships libicu 76 and libjpeg .so.62 - different ABIs, so the tree
  # cannot run here and no apt_deps can fix it. Building against trixie's own
  # libraries removes that entire class of failure.
  - tool: r
    version: "4.6.1"
    apt_deps: [ca-certificates, curl, gcc, g++, gfortran, make, libc6-dev, zlib1g-dev, libbz2-dev, liblzma-dev, libpcre2-dev, libreadline-dev, libcurl4-openssl-dev]
    artifact: r-4.6.1-debian-trixie-amd64.tar.xz
    sha256: ""

  # --------------------------------------------------------------- julia ---
  - tool: julia
    version: "1.12.0"
    apt_deps: [ca-certificates, curl]
    artifact: julia-1.12.0-debian-trixie-amd64.tar.xz
    sha256: ""

  # ----------------------------------------------------------------- dart ---
  - tool: dart
    version: "3.10.0"
    apt_deps: [ca-certificates, curl, unzip]
    artifact: dart-3.10.0-debian-trixie-amd64.tar.xz
    sha256: ""

  # ----------------------------------------------------------------- opam ---
  # Single binary. It still needs an OCaml compiler to do anything, which opam
  # fetches on demand - that is opam's own model, not something we can pin.
  - tool: opam
    version: "2.6.1"
    apt_deps: [ca-certificates, curl, bzip2, m4, build-essential, pkg-config]
    artifact: opam-2.6.1-debian-trixie-amd64.tar.xz
    sha256: ""

  # --------------------------------------------------------------- erlang ---
  # Prebuilt OTP from erlef/otp_builds (ubuntu 24.04 build; glibc is backward
  # compatible with trixie's).
  - tool: erlang
    version: "29.1.2"
    apt_deps: [ca-certificates, curl, libssl3, zlib1g, libncursesw6, libstdc++6]
    artifact: erlang-29.1.2-debian-trixie-amd64.tar.xz
    sha256: ""

  # --------------------------------------------------------------- elixir ---
  # Needs a BEAM runtime: erlang is a real dependency, not an optional add-on.
  - tool: elixir
    version: "1.20.4"
    requires: [erlang-29.1.2]
    apt_deps: [ca-certificates, curl, unzip]
    artifact: elixir-1.20.4-debian-trixie-amd64.tar.xz
    sha256: ""

  # ------------------------------------------------------------------ sbt ---
  # Covers the `ivy` protocol. Needs a JRE, which a java-* setup provides.
  - tool: sbt
    version: "2.0.11"
    apt_deps: [ca-certificates, curl]
    artifact: sbt-2.0.11-debian-trixie-amd64.tar.xz
    sha256: ""

  # ------------------------------------------------------------------ ghc ---
  # GHC ships deb11/deb12/deb13 builds; only deb11 and deb12 exist for these
  # versions, and a deb12 build runs on trixie (glibc is backward compatible).
  # Covers hackage and stackage together with cabal.
  - tool: ghc
    version: "9.12.2"
    apt_deps: [ca-certificates, curl, gcc, g++, libc6-dev, libgmp10, libnuma1, xz-utils, make]
    artifact: ghc-9.12.2-debian-trixie-amd64.tar.xz
    sha256: ""

  - tool: cabal
    version: "3.12.1.0"
    apt_deps: [ca-certificates, curl]
    artifact: cabal-3.12.1.0-debian-trixie-amd64.tar.xz
    sha256: ""

  # ----------------------------------------------------------------- perl ---
  # skaji/relocatable-perl: a perl that runs from any prefix, and it already
  # bundles cpanm, which is exactly the client the `cpan` protocol needs.
  - tool: perl
    version: "5.44.0.0"
    apt_deps: [ca-certificates, curl, libc6-dev, gcc, make]
    artifact: perl-5.44.0.0-debian-trixie-amd64.tar.xz
    sha256: ""

  # ------------------------------------------------------------------ lua ---
  - tool: lua
    version: "5.4.8"
    apt_deps: [ca-certificates, curl, libc6-dev, gcc, make]
    artifact: lua-5.4.8-debian-trixie-amd64.tar.xz
    sha256: ""

  # ------------------------------------------------------------- luarocks ---
  # Needs a lua interpreter, declared as a dependency.
  - tool: luarocks
    version: "3.12.2"
    requires: [lua-5.4.8]
    apt_deps: [ca-certificates, curl, unzip]
    artifact: luarocks-3.12.2-debian-trixie-amd64.tar.xz
    sha256: ""
